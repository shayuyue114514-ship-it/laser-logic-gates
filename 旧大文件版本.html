<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>绘制网格</title>
<style>
  /* 页面白底、无滚动条：网格只出现在视口矩形内，视口外保持白底 */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  /* touch-action 关掉浏览器自带手势，避免与滚轮缩放、中键拖拽冲突 */
  #gridCanvas {
    display: block;
    touch-action: none;
    user-select: none;
    /* 画布本身不可聚焦，加 tabindex 后可以主动抢键盘焦点；全屏画布不需要焦点框 */
    outline: none;
  }
  /* 元件层：盖在画布上方的 SVG，本步不做交互，指针事件全部透传给画布 */
  #elemLayer {
    position: fixed;
    left: 0;
    top: 0;
    pointer-events: none;
  }
  /* 简介浮层：独立于 Canvas 的 DOM 层，靠 z-index 压在元件层之上，不会被网格上的元件盖住
     这里只管定位与层级，字号、内边距、圆角、颜色都由 JS 从 CONFIG / COLOR 一次性注入 */
  #slotTip {
    position: fixed;
    left: 0;
    top: 0;
    box-sizing: border-box;
    border: 2px solid;
    opacity: 0;
    pointer-events: none;
    z-index: 5;
  }
  #slotTipName {
    font-weight: 600;
  }
  /* 弹出面板的通用外观：设置弹窗与文件弹窗共用这一类，两者的底板、行布局、控件样式完全一致
     这里只管定位与层级，字号、内边距、圆角、颜色由 JS 从 CONFIG / COLOR 一次性注入
     显示时要接住鼠标，所以指针事件是开的；隐藏时 display 为 none，自然收不到任何事件 */
  .popup {
    position: fixed;
    left: 0;
    top: 0;
    box-sizing: border-box;
    display: none;
    border: 2px solid;
    opacity: 0;
    pointer-events: auto;
    z-index: 4;
  }
  /* 弹窗里的每一行：文字靠左、控件靠右，行高由 JS 从配置注入，以后放滑块也按同一行高对齐 */
  .popup .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  /* 开关：圆角滑轨加圆形滑块，开与关只差一个类，滑块位移和滑轨变色都交给 CSS 过渡 */
  /* 尺寸写死在这里而不是走配置：它只有这一处用，且必须和行高对得上，放配置区反而多一层跳转 */
  .popup .sw {
    position: relative;
    flex: none;                 /* 不被左边的文字挤扁 */
    width: 34px;
    height: 18px;
    border-radius: 9px;
    background: #B9CBD8;        /* 关闭态滑轨：灰蓝，明确区别于开启态 */
    transition: background-color 0.16s ease-out;  /* 与槽反馈同为 0.16 秒的缓出，手感统一 */
  }
  .popup .sw .knob {
    position: absolute;
    left: 2px;
    top: 2px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #ffffff;
    transition: transform 0.16s ease-out;
  }
  .popup .sw.on {
    background: #29B6F6;        /* 开启态滑轨：与视口边框同色，整页仍是同一色系 */
  }
  .popup .sw.on .knob {
    transform: translateX(16px);  /* 滑轨宽 34 减滑块 14 再减左右各 2 的留边 */
  }
  /* 行首文字：禁止换行并禁止收缩，否则一行挤不下时会被压成一字一行 */
  .popup .lbl {
    flex: none;
    white-space: nowrap;
  }
  /* 速度滑块：轨道与滑块交给浏览器原生渲染，只用 accent-color 把它染成同一个蓝 */
  /* 宽度写死并禁止收缩，否则会被左边的文字挤变形，与开关同样对待 */
  .popup input[type="range"] {
    flex: none;
    width: 110px;
    accent-color: #29B6F6;
  }
  /* 速度数值：做成小徽章，白底圆角、数字等宽居中，读数清楚又不像裸露的文本 */
  .popup .val {
    flex: none;
    box-sizing: border-box;
    width: 58px;
    margin-left: 8px;
    padding: 3px 0;
    text-align: center;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.72);
    color: #1B6C8F;                /* 深一档的蓝：白底上比正文灰更清楚 */
    font-variant-numeric: tabular-nums;  /* 等宽数字：拖动时数字跳动不会左右晃 */
  }
  /* 文件名：占满行内剩余宽度，超长时从左侧省略，绝不把整行撑破 */
  .popup .fname {
    flex: 1;
    min-width: 0;               /* 缺了它，弹性子项不会收缩，省略号永远不会出现 */
    margin-left: 8px;
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: #1B6C8F;
  }
  /* 文件弹窗里的动作项：一行一个，整行都是可点区域 */
  /* 平时不着色也不描边，只在悬停时浮出一层淡蓝——弹窗本身很窄，再并排放三块白底会显得很吵 */
  .popup .btn {
    display: flex;
    align-items: center;
    box-sizing: border-box;
    width: 100%;
    padding: 0 8px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: #1B6C8F;             /* 深一档的蓝：与文件名同色，读起来是「可以点的」，又不必加底板 */
    font-family: inherit;
    font-size: inherit;
    text-align: left;
    cursor: pointer;
    transition: background-color 0.16s ease-out;
  }
  .popup .btn:hover { background: rgba(255, 255, 255, 0.66); }
  .popup .btn:active { background: rgba(255, 255, 255, 0.92); }
  /* 教程弹窗：点教程按钮后从屏幕正中弹出，比设置、文件两个弹窗大得多 */
  /* 居中用左右各 50% 再位移自身一半来实现，与窗口实际尺寸无关，所以尺寸改大改小都不用动这里 */
  .popup.modal {
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    flex-direction: column;   /* 取消按钮在上、内容区在下，纵向排 */
    z-index: 6;               /* 压在所有浮层之上：它是模态窗口，弹出来就在最前面 */
  }
  /* 关闭按钮：一个正方形的图标按钮，叉是 SVG 里两笔圆头描边，收笔的圆与画布上那几个图标一致 */
  /* 这里特意不给常态底色：本项目里白色是「选中」的信号，一个常驻白底的按钮会被读成当前选中项 */
  /* 只靠深一档的蓝表示「可点」，与文件弹窗里那几个动作项同一套读法 */
  .popup.modal .btn.icon {
    align-self: flex-start;   /* 靠左上收住：不写这句会被横向拉伸，按钮就占满一整行 */
    flex: none;
    justify-content: center;  /* .popup .btn 默认把内容靠左排，图标要居中才不偏在左边 */
    width: 26px;              /* 与设置弹窗的行高同档，刚好放得下 18 的图标再留一圈空白 */
    height: 26px;
    padding: 0;               /* 尺寸已经定死，内边距再撑就会把图标挤歪 */
  }
  .popup.modal .btn.icon svg {
    pointer-events: none;     /* 让指针事件一律落在按钮本身上：按下时判定的是按钮，不是里面的路径 */
  }
  /* 内容区：占满取消按钮之外的全部高度；文字多了自己滚动，绝不把窗口撑高 */
  /* 底色与文字色由 JS 从 COLOR 注入，取的是「未选中」那一档的蓝，压暗窗口底板一级，读起来是凹进去的一块 */
  .popup.modal .doc {
    box-sizing: border-box;
    flex: 1;                  /* 吃掉剩余高度，窗口加高时它跟着长 */
    min-height: 0;            /* 缺了它，弹性子项不会低于内容自身高度，滚动条就永远不出现 */
    overflow-y: auto;
    margin-top: 8px;
    padding: 10px 12px;
    border-radius: 6px;
    line-height: 1.6;
    user-select: text;        /* 教程是给人读的，允许选中复制 */
    white-space: normal;      /* 正文改用块级元素分层排布，版面由结构决定，不再取决于源码里的换行与缩进 */
  }
  /* 调试面板：默认隐藏，用 debugPanel.show() 唤出；浮在网格之上，方便随时调参 */
  /* 钉在左下角而不是左上角：左上角是元件选择面板的位置，钉在那里会把选项槽全挡住 */
  #debugPanel {
    display: none;
    position: fixed;
    left: 12px;
    bottom: 12px;
    padding: 8px 10px;
    background: rgba(255, 255, 255, 0.94);
    border: 1px solid #90CAF9;
    border-radius: 6px;
    font-size: 12px;
    line-height: 1.4;
    color: #111111;
    z-index: 10;
    user-select: none;
  }
  #debugPanel .grp {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #debugPanel .grp + .grp {
    margin-top: 6px;
  }
  #debugPanel .sw {
    width: 16px;
    height: 16px;
    border: 1px solid #1565C0;
    border-radius: 3px;
  }
  #debugPanel label {
    display: flex;
    align-items: center;
    gap: 3px;
    color: #444444;
  }
  #debugPanel input[type="range"] {
    width: 84px;
  }
  #debugPanel .code {
    font-family: Menlo, Consolas, monospace;
    color: #444444;
  }
</style>
</head>
<body>

<canvas id="gridCanvas" tabindex="0"></canvas>
<svg id="elemLayer"></svg>

<!-- 简介浮层：排在元件层之后，配合 z-index 保证它永远画在元件之上 -->
<div id="slotTip">
  <div id="slotTipName"></div>
  <div id="slotTipDesc"></div>
</div>

<!-- 设置弹窗：排在简介浮层之后，齿轮点亮时显示在齿轮正下方；开关初始带 on 类，与默认开启的状态一致 -->
<div id="settingsPanel" class="popup">
  <div class="row">
    <span class="lbl">渲染网格</span>
    <span class="sw on" id="gridSwitch"><span class="knob"></span></span>
  </div>
  <div class="row">
    <span class="lbl">高级渲染</span>
    <span class="sw on" id="advSwitch"><span class="knob"></span></span>
  </div>
  <div class="row">
    <span class="lbl">运行速度</span>
    <input type="range" id="speedSlider">
    <span class="val" id="speedValue"></span>
  </div>
</div>

<!-- 文件弹窗：文件按钮点亮时显示在该按钮正下方，与设置弹窗同款底板 -->
<!-- 文件名一行，三个动作各占一行；动作本步只打印，确认接上之后下一步再换成真实读写 -->
<div id="filePanel" class="popup">
  <div class="row">
    <span class="lbl">当前文件</span>
    <span class="fname" id="fileName"></span>
  </div>
  <button class="btn" id="btnOpen">打开</button>
  <button class="btn" id="btnSave">保存</button>
  <button class="btn" id="btnSaveAs">另存为</button>
  <button class="btn" id="btnImportSel">以选区导入</button>
  <button class="btn" id="btnExportSel">以选区导出</button>
</div>

<!-- 教程弹窗：点教程按钮后从屏幕正中弹出，底板与设置、文件两个弹窗同一套配色 -->
<!-- 左上角是一个叉形的关闭按钮，点了就把窗口关掉；下面的内容区先留空，等教程文字写好之后再填进去 -->
<div id="tutorialPanel" class="popup modal">
  <button class="btn icon" id="btnTutorialCancel" aria-label="取消">
    <!-- 叉用两笔圆头描边画成，收笔是圆的，与画布上齿轮、文件、教程三个图标的收笔同一套 -->
    <!-- 描边取 currentColor：颜色跟着按钮文字色走，以后改按钮色不必再改这里 -->
    <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true" focusable="false">
      <path d="M5.5 5.5 L12.5 12.5 M12.5 5.5 L5.5 12.5"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
    </svg>
  </button>
  <div class="doc" id="tutorialDoc"></div>
</div>

<div id="debugPanel">
  <div class="grp">
    <span class="sw" id="swFill"></span>
    <label>填充</label>
    <label>H<input type="range" id="fillH" min="0" max="360" step="1"></label>
    <label>S<input type="range" id="fillS" min="0" max="100" step="1"></label>
    <label>L<input type="range" id="fillL" min="0" max="100" step="1"></label>
    <span class="code" id="codeFill"></span>
  </div>
  <div class="grp">
    <span class="sw" id="swStroke"></span>
    <label>描边</label>
    <label>H<input type="range" id="strokeH" min="0" max="360" step="1"></label>
    <label>S<input type="range" id="strokeS" min="0" max="100" step="1"></label>
    <label>L<input type="range" id="strokeL" min="0" max="100" step="1"></label>
    <span class="code" id="codeStroke"></span>
  </div>
  <div class="grp">
    <span class="sw" id="swPanel"></span>
    <label>底板</label>
    <label>H<input type="range" id="panelH" min="0" max="360" step="1"></label>
    <label>S<input type="range" id="panelS" min="0" max="100" step="1"></label>
    <label>L<input type="range" id="panelL" min="0" max="100" step="1"></label>
    <span class="code" id="codePanel"></span>
  </div>
  <div class="grp">
    <span class="sw" id="swSlot"></span>
    <label>槽填充</label>
    <label>H<input type="range" id="slotH" min="0" max="360" step="1"></label>
    <label>S<input type="range" id="slotS" min="0" max="100" step="1"></label>
    <label>L<input type="range" id="slotL" min="0" max="100" step="1"></label>
    <span class="code" id="codeSlot"></span>
  </div>
  <div class="grp">
    <span class="sw" id="swGearFill"></span>
    <label>齿轮填充</label>
    <label>H<input type="range" id="gearFillH" min="0" max="360" step="1"></label>
    <label>S<input type="range" id="gearFillS" min="0" max="100" step="1"></label>
    <label>L<input type="range" id="gearFillL" min="0" max="100" step="1"></label>
    <span class="code" id="codeGearFill"></span>
  </div>
  <div class="grp">
    <span class="sw" id="swGearStroke"></span>
    <label>齿轮描边</label>
    <label>H<input type="range" id="gearStrokeH" min="0" max="360" step="1"></label>
    <label>S<input type="range" id="gearStrokeS" min="0" max="100" step="1"></label>
    <label>L<input type="range" id="gearStrokeL" min="0" max="100" step="1"></label>
    <span class="code" id="codeGearStroke"></span>
  </div>
  <div class="grp">
    <span class="sw" id="swSetFill"></span>
    <label>设置槽填充</label>
    <label>H<input type="range" id="setFillH" min="0" max="360" step="1"></label>
    <label>S<input type="range" id="setFillS" min="0" max="100" step="1"></label>
    <label>L<input type="range" id="setFillL" min="0" max="100" step="1"></label>
    <span class="code" id="codeSetFill"></span>
  </div>
  <div class="grp">
    <span class="sw" id="swSetStroke"></span>
    <label>设置槽描边</label>
    <label>H<input type="range" id="setStrokeH" min="0" max="360" step="1"></label>
    <label>S<input type="range" id="setStrokeS" min="0" max="100" step="1"></label>
    <label>L<input type="range" id="setStrokeL" min="0" max="100" step="1"></label>
    <span class="code" id="codeSetStroke"></span>
  </div>
</div>

<script>
"use strict";

/* ========== 常量配置 ========== */

const CONFIG = {
  gridUnit: 1,            // 网格基本单位：1 个世界单位 = 1 格，也是永远显示的最小格子
  viewportMargin: 24,     // 视口相对画布的内缩边距（CSS px），让视口边界可见
  panelHeight: 70,        // 画布上方预留的空白高度（CSS px）：给元件选择面板用，网格视图整体下移这么多
  panelGap: 12,           // 上方面板矩形与窗口顶边、网格顶边之间的空隙（CSS px）
  bottomBarHeight: 35,    // 底部栏的高度（CSS px）：取上方元件面板高度的一半，整页上下形成呼应
  hintFontSize: 15,       // 底栏提示文字的字号（CSS px）
  panelSlotCount: 8,      // 面板里选项槽的数量
  panelSlotPad: 8,        // 选项槽区域相对面板内沿的内缩（CSS px），让槽不贴到面板边框上
  panelSlotGap: 8,        // 选项槽之间的横向间隔（CSS px）
  panelSlotRadius: 8,     // 选项槽的圆角半径（CSS px）
  panelSlotSide: 50,      // 选项槽边长（CSS px）：固定值，不再由面板高度推出，面板加高不会把槽一起撑大
  panelSlotElementLen: 28,      // 槽内元件的长度（CSS px，三角形顶点到底边）：形状比例不变，宽度按 elementWid/elementLen 自动推出
  panelSlotHoverScale: 0.93,    // 悬停时整个槽缩到的比例：槽与槽内元件一起缩，不会只缩框不缩元件
  panelSlotPressedScale: 0.86,  // 按下时整个槽缩到的比例：比悬停更深，手感像真的按进去
  panelSlotAnimDuration: 0.16,  // 槽反馈动画时长（秒）：悬停与按下的缩放都用它，走固定时长的缓出曲线，不用指数平滑
  slotSelectedBorderWidth: 3,   // 选中槽的描边宽度（CSS px）：比普通槽的 2px 略粗，作为选中标识
  settingsLitAmount: 0.45,      // 设置按钮打开时的提亮幅度（0~1）：朝白色混这么多，太大就发灰不像同一色系
  settingsLitDuration: 0.22,    // 设置按钮提亮的过渡时长（秒）：亮起与熄灭都走它，太快会像闪一下
  gearTeeth: 8,           // 齿轮齿数：8 齿在二十几像素的尺寸下疏密刚好，再多就糊成一圈看不出齿
  gearTipR: 0.33,         // 齿顶半径（世界单位）：和元件同一套尺度，随槽内缩放自动变小
  gearRootR: 0.245,       // 齿根半径（世界单位）：齿顶到齿根的高度即齿高，太浅就不像齿轮
  gearHoleR: 0.125,       // 中心孔半径（世界单位）：孔和齿根之间要留出一圈可见的环，否则齿轮糊成一坨
  gearTipHalfDeg: 7,      // 齿顶半角（度）：齿顶比齿根窄，齿才是有锥度的梯形而不是方块
  gearRootHalfDeg: 12,    // 齿根半角（度）：两齿之间的空隙由它和齿距共同决定
  gearStroke: 0.07,       // 齿轮描边宽度（世界单位）：比元件描边细，否则中心孔会被描边糊死
  fileHalfW: 0.26,        // 文件图标半宽（世界单位）：纸比齿轮窄一点，视觉重量才和齿轮相当
  fileHalfH: 0.325,       // 文件图标半高（世界单位）：约 26px，加上描边后与齿轮外径 29px 基本齐平
  fileCornerR: 0.06,      // 文件图标外框圆角半径（世界单位）：与齿轮的圆角风格一致，不出现硬直角
  fileFoldLen: 0.15,      // 文件图标右上折角的边长（世界单位）：随纸面一起缩小，比例保持不变
  fileStroke: 0.04,       // 文件图标描边宽度（世界单位）：比齿轮明显细一档，约 1.6px，纸面才显得轻盈不糊

// 元件选择面板各槽放的类型：下标即类型下标，第一个元件槽放的就是第 0 个类型
const PANEL_SLOT_TYPES = ["deflector", "transmitter", "light", "inverter", "lamp"];

// 「选中」工具槽的序号：插在所有元件槽的最左侧，所以是 0
// 它和元件槽一样占一个槽位、一样走悬停与按下的动画，但不是元件槽，不参与放置类型和简介
const SELECT_SLOT_INDEX = 0;

// 第一个元件槽的序号：紧跟在选中槽右边
// 元件槽的序号一律由它推算，以后还想在最左边再加工具槽，只改这一个数即可
const ELEMENT_SLOT_BASE = SELECT_SLOT_INDEX + 1;

// 设置按钮在槽动画数组里的下标：排在所有元件槽之后
// 给它一个正式序号，悬停与按下就自动走元件槽那同一套，不必再维护第二份状态，手感也不会走样
const SETTINGS_SLOT_INDEX = CONFIG.panelSlotCount;

// 文件按钮在槽动画数组里的下标：紧挨着设置按钮的左边，所以序号再往后一位
// 同样给正式序号，悬停与按下复用元件槽那套动画，和设置按钮手感完全一致
const FILE_SLOT_INDEX = SETTINGS_SLOT_INDEX + 1;

// 教程按钮在槽动画数组里的下标：紧挨着文件按钮的左边，所以序号再往后一位
// 同样给正式序号，悬停与按下复用元件槽那套动画，三个按钮手感完全一致
const TUTORIAL_SLOT_INDEX = FILE_SLOT_INDEX + 1;

// 判断某个槽序号是不是「元件槽」：元件槽才响应放置类型与简介，选中槽和两个按钮槽都不算
// 以后再加按钮时，只要它的序号排在元件槽之后，这里不必改
function isElementSlot(i) {
  return i >= ELEMENT_SLOT_BASE && i < ELEMENT_SLOT_BASE + PANEL_SLOT_TYPES.length;
}

// 判断某个槽序号是不是「可选中的槽」：选中槽和元件槽都能点中并高亮，两个按钮槽不能
// 按钮槽有自己的开关状态，不参与选中，所以不能拿 isElementSlot 反过来当「不可选」
function isPickableSlot(i) {
  return i === SELECT_SLOT_INDEX || isElementSlot(i);
}

  light: {

// 反相器的最终几何：气泡圆心落在三角形顶点上，整个符号（三角形+气泡）再整体下移，使包围盒在格心居中
// 下移量取半径的一半：气泡只在顶点外侧探出一个半径，取一半正好让上下留白相等，四个朝向旋转都不会出格
// 两侧边在气泡上的交点由「沿侧边走到离顶点一个半径处」解出，SVG 与 Canvas 两套路径共用这组数
function bubbleGeometry(typeId) {
  const dx = CONFIG.elementWid / 2;              // 三角形底边半宽
  const dy = CONFIG.inverterLen;                 // 三角形顶点到底边的竖直长度
  const r = ELEMENT_TYPES[typeId].bubble;        // 气泡半径
  const shift = r / 2;                           // 整体下移量，让「三角形∪气泡」的包围盒在格心居中
  const yApex = -dy / 2 + shift;                 // 顶点 y，同时也是气泡圆心的 y
  const yBase = dy / 2 + shift;                  // 底边 y
  const s = r / Math.sqrt(dx * dx + dy * dy);    // 交点沿侧边的参数：离顶点一个半径处就是切出点
  const half = dx * s;                           // 交点相对圆心的水平偏移
  const drop = dy * s;                           // 交点相对圆心的竖直偏移
  const phi = Math.atan2(half, drop);            // 交点偏离「正下方」的角度，决定圆弧要扫过多大范围
  return { dx: dx, yApex: yApex, yBase: yBase, r: r, half: half, drop: drop, phi: phi };
}

// 把类型点列转成 SVG 的路径字符串（d 属性）
// 带 bubble 的类型（非门）走另一条分支：三角形两侧边在气泡上截断，中间用一段大圆弧接起来
// 于是整条路径就是「三角形∪气泡」的外轮廓，描边只勾一圈，不会在三角形内部多出一道弧线
function elementPathD(typeId) {
  const t = ELEMENT_TYPES[typeId];
  if (t.bubble) {
    const g = bubbleGeometry(typeId);
    const cy = g.yApex + g.drop;                 // 两个交点等高，圆弧从这里起、也从这里落
    // 从左侧交点顺时针绕过顶部到右侧交点：扫过 2π-2φ 超过半圈，所以 large-arc 与 sweep 都取 1
    return "M " + (-g.dx) + " " + g.yBase +
      " L " + (-g.half) + " " + cy +
      " A " + g.r + " " + g.r + " 0 1 1 " + g.half + " " + cy +
      " L " + g.dx + " " + g.yBase + " Z";
  }
  if (t.roundRect) {
    // 圆角正方形：四条直边 + 四段四分之一圆弧，每段弧的 sweep 取 1 表示顺时针接向下一条边
    const h = t.roundRect.half;   // 半边长
    const r = t.roundRect.r;      // 圆角半径
    return "M " + (-h + r) + " " + (-h) +
      " L " + (h - r) + " " + (-h) +
      " A " + r + " " + r + " 0 0 1 " + h + " " + (-h + r) +
      " L " + h + " " + (h - r) +
      " A " + r + " " + r + " 0 0 1 " + (h - r) + " " + h +
      " L " + (-h + r) + " " + h +
      " A " + r + " " + r + " 0 0 1 " + (-h) + " " + (h - r) +
      " L " + (-h) + " " + (-h + r) +
      " A " + r + " " + r + " 0 0 1 " + (-h + r) + " " + (-h) +
      " Z";
  }
  const pts = t.points;
  let d = "M " + pts[0][0] + " " + pts[0][1];
  for (let i = 1; i < pts.length; i++) d += " L " + pts[i][0] + " " + pts[i][1];
  d += " Z";
  return d;
}

// 把类型点列描成 Canvas 路径；调用前坐标系必须已经平移到元件中心并按需缩放好
// 气泡分支与 SVG 侧取同一组几何数，描出的外轮廓完全一致，两边不会各自漂移
function traceElementPath(typeId) {
  const t = ELEMENT_TYPES[typeId];
  ctx.beginPath();
  if (t.bubble) {
    const g = bubbleGeometry(typeId);
    // Canvas 的角度从 +x 轴起、顺时针增大；交点落在「正下方」偏 φ 处，所以起点取 π/2+φ
    const start = Math.PI / 2 + g.phi;
    ctx.moveTo(-g.dx, g.yBase);
    ctx.lineTo(-g.half, g.yApex + g.drop);
    ctx.arc(0, g.yApex, g.r, start, start + (Math.PI * 2 - g.phi * 2), false);
    ctx.lineTo(g.dx, g.yBase);
    ctx.closePath();
    return;
  }
  if (t.roundRect) {
    // 圆角正方形交给标准的 roundRect：x/y 取左上角，宽高是边长的两倍，第 5 个参数直接给圆角半径
    const h = t.roundRect.half;
    ctx.roundRect(-h, -h, h * 2, h * 2, t.roundRect.r);
    return;
  }
  const pts = t.points;
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
}

// 当前选中的元件类型：虚影形状与放置出的元件都取它，切换选择时只改 slotSelectedIndex 这一处
// 槽序号与类型下标差一个基准，减掉它才是类型下标
// 选中槽不是元件槽，没有对应类型，返回 null：调用方据此知道「手上没拿元件」
function selectedTypeId() {
  if (slotSelectedIndex === SELECT_SLOT_INDEX) return null;
  return PANEL_SLOT_TYPES[slotSelectedIndex - ELEMENT_SLOT_BASE];
}

/* 撤销/重做：只记「已落定的电路」的差分，悬空中的那批不进历史 */
// 每步存一组差分，一条差分描述一个元件的新增、消失或字段变化；不存整份电路，所以步数与电路大小无关
let historyStack = [];     // Array<Array<Object>>：历史里每一步的差分清单
let historyIndex = -1;     // number：当前走到历史里的哪一步，-1 表示还停在起点、没有可撤销的步
let committedTable = new Map(); // Map<number, {rec:Object, el:Object}>：上一次落定时已落定电路的样子，按元件内部编号存
let nextElementId = 1;     // number：元件内部编号的发号器；编号只在本程序内用来认人，不写进存档
const HISTORY_LIMIT = 100; // number：最多保留多少步，超出丢掉最老的，避免长时间编辑把内存撑大

const state = {
  cssW: 0,                // number：画布 CSS 宽度
  cssH: 0,                // number：画布 CSS 高度
  anchorWX: CONFIG.defaultAnchorWX, // number：参考点的世界坐标 X
  anchorWY: CONFIG.defaultAnchorWY, // number：参考点的世界坐标 Y
  anchorSX: 0,            // number：参考点当前的屏幕 X（平滑值，平移时变化）
  anchorSY: 0,            // number：参考点当前的屏幕 Y
  tAnchorSX: 0,           // number：参考点屏幕 X 的目标值
  tAnchorSY: 0,           // number：参考点屏幕 Y 的目标值
  scale: CONFIG.defaultScale, // number：当前缩放（世界单位 → CSS px）
  logScale: Math.log(CONFIG.defaultScale),  // number：当前缩放的对数（对数插值更自然）
  tLogScale: Math.log(CONFIG.defaultScale), // number：缩放目标值的对数
  isPanning: false,       // boolean：是否正在中键拖拽
  panPointerId: null,     // number|null：正在拖拽的指针 id
  panLastX: 0,            // number：上一次 pointermove 的屏幕 X，用来自己算位移
  panLastY: 0,            // number：上一次 pointermove 的屏幕 Y
  lastTs: 0               // number：上一帧时间戳（毫秒），用于计算 dt
};

/* ========== 工具函数 ========== */

// 把 v 限制在 [lo, hi] 区间，用于钳制缩放范围
function clamp(v, lo, hi) {
  return v < lo ? lo : (v > hi ? hi : v);
}

// 指数缓出曲线：起步最快、越接近终点越慢；t = 0.1 时输出正好 0.5，即位移走完一半
function easeOutExpo(t) {
  return t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
}

// 三次缓出曲线：起步快、收尾慢；删除动画用它就是先迅速收缩、再收干净，反馈跟手
function easeOutCubic(t) {
  return 1 - Math.pow(1 - t, 3);
}

// 三次缓入缓出曲线：两端慢、中间快；简介浮层用它，出现和收起都不生硬
function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

// 建一个已停稳的缓动标量：cur 是当前值，from→to 在固定时长内按缓出曲线推进，t 到 1 表示停稳
function newEased(value) {
  return { cur: value, from: value, to: value, t: 1 };
}

// 把缓动标量朝目标推进：目标一变就从当前值重新起步，所以动画中途改目标也不会跳变
// easing 可指定曲线，缺省是三次缓出；传 easeInOutCubic 就得到两端都慢的柔和动画
function stepEased(a, to, dt, duration, easing) {
  const ease = easing || easeOutCubic;
  if (a.to !== to) {
    a.from = a.cur;
    a.to = to;
    a.t = 0;
  }
  if (a.t >= 1) return;
  a.t = Math.min(1, a.t + dt / duration);
  a.cur = a.from + (a.to - a.from) * ease(a.t);
}

/* ========== 坐标变换 ========== */

// 屏幕位置 = 参考点屏幕位置 + 世界偏移 × 缩放；用参考点表示，缩放时只有缩放量在变，位移天然单调
function worldToScreenX(wx) {
  return state.anchorSX + (wx - state.anchorWX) * state.scale;
}

// 世界 Y → 屏幕 Y：屏幕 Y 向下、世界 Y 向上，所以取负号
function worldToScreenY(wy) {
  return state.anchorSY - (wy - state.anchorWY) * state.scale;
}

// 屏幕 X → 世界 X，用于把鼠标位置换算成世界坐标
function screenToWorldX(sx) {
  return state.anchorWX + (sx - state.anchorSX) / state.scale;
}

// 屏幕 Y → 世界 Y
function screenToWorldY(sy) {
  return state.anchorWY - (sy - state.anchorSY) / state.scale;
}

// 世界 X 所在格子的格心 X：格子是 [i, i+1]，格心即 i+0.5；floor 对负数同样正确
function cellCenterX(wx) {
  return Math.floor(wx) + 0.5;
}

// 世界 Y 所在格子的格心 Y
function cellCenterY(wy) {
  return Math.floor(wy) + 0.5;
}

/* ========== 尺寸与视口 ========== */

// 按 devicePixelRatio 调整画布位图尺寸，并把绘制坐标系统一到 CSS 像素
function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  state.cssW = window.innerWidth;
  state.cssH = window.innerHeight;
  canvas.width = Math.round(state.cssW * dpr);
  canvas.height = Math.round(state.cssH * dpr);
  canvas.style.width = state.cssW + "px";
  canvas.style.height = state.cssH + "px";
  // setTransform 只在这里设置一次；后续所有绘制都用 CSS 像素坐标，避免高清屏模糊
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// 计算视口矩形：画布内缩固定边距，网格只在这个矩形内显示
// 上边额外让出 panelHeight 的空白给元件选择面板；画布本身仍是全窗口且左上角在原点，
// 所以指针坐标不用做任何偏移换算，视口之外（含上方空白）由 isInViewport 统一挡掉
function getViewport() {
  const m = CONFIG.viewportMargin;
  const top = m + CONFIG.panelHeight;
  const w = Math.max(0, state.cssW - m * 2);
  // 底部要再给那条栏腾地方：栏高加上下各一个 panelGap，视口高度相应缩短，栏才不会压在网格上
  const bottom = CONFIG.panelGap * 2 + CONFIG.bottomBarHeight;
  const h = Math.max(0, state.cssH - top - bottom);
  return { x: m, y: top, w: w, h: h };
}

// 屏幕点是否落在视口内：视口外的网格不显示，虚影与放置遵循同一条边界
function isInViewport(sx, sy) {
  const vp = getViewport();
  return sx >= vp.x && sx <= vp.x + vp.w && sy >= vp.y && sy <= vp.y + vp.h;
}

/* ========== 网格绘制 ========== */

// 把网格画到指定上下文：视口内填淡蓝底，再描一遍全部网格线
// 单独抽出来是为了同一份绘制代码既服务主画布、也服务离屏缓存，两处不会各自漂移
function paintGrid(g, vp) {
  // 永远只画最小格子（1×1），不随缩放合并成更大的格子；缩小时线会变密，这是预期行为
  const step = CONFIG.gridUnit;

  // 视口内可见的世界坐标范围，用于只画屏幕内需要的线
  const leftWorld = screenToWorldX(vp.x);
  const rightWorld = screenToWorldX(vp.x + vp.w);
  const topWorld = screenToWorldY(vp.y);
  const bottomWorld = screenToWorldY(vp.y + vp.h);

  g.save();
  // 裁剪到视口矩形：这是「视口外不显示」的关键
  g.beginPath();
  g.rect(vp.x, vp.y, vp.w, vp.h);
  g.clip();

  g.fillStyle = COLOR.background;
  g.fillRect(vp.x, vp.y, vp.w, vp.h);

  // 关掉网格渲染时到此为止：视口底色保留，省掉每帧几百条线的描边，画面仍能看出视口范围
  if (!gridRenderOn) {
    g.restore();
    return;
  }

  // 所有网格线粗细、颜色完全一致，攒成一条路径一次描边（逐条 stroke 会明显变慢）
  const path = new Path2D();

  // 竖线：世界 x = n * step
  const nStartX = Math.ceil(leftWorld / step);
  const nEndX = Math.floor(rightWorld / step);
  for (let n = nStartX; n <= nEndX; n++) {
    // 保留浮点位置，不做像素取整：取整会让每条线在不同帧各自跳 1px，间距忽宽忽窄，看起来就是抖动
    const sx = worldToScreenX(n * step);
    path.moveTo(sx, vp.y);
    path.lineTo(sx, vp.y + vp.h);
  }

  // 横线：世界 y = n * step
  const nStartY = Math.ceil(bottomWorld / step);
  const nEndY = Math.floor(topWorld / step);
  for (let n = nStartY; n <= nEndY; n++) {
    // 同样不做像素取整，理由同竖线
    const sy = worldToScreenY(n * step);
    path.moveTo(vp.x, sy);
    path.lineTo(vp.x + vp.w, sy);
  }

  g.lineWidth = 1;
  g.strokeStyle = COLOR.line;
  g.stroke(path);

  g.restore();
}

// 画网格：相机还在动时直接画到主画布；相机停住后改成贴一张离屏位图，省掉每帧重建几百条线
// 网格只跟相机与画布尺寸有关，激光、元件、虚影在动的时候它其实一动不动，这正是可以缓存的前提
function drawGrid(vp) {
  const dpr = window.devicePixelRatio || 1;
  // 相机正在平移或缩放：网格每帧都在变，缓存必然失效，直接画反而省下一次整屏拷贝
  const cameraMoving = state.anchorSX !== state.tAnchorSX || state.anchorSY !== state.tAnchorSY ||
    state.logScale !== state.tLogScale;
  if (cameraMoving) {
    gridCacheKey = "";  // 弃用旧缓存，相机停下后必定重画一张
    paintGrid(ctx, vp);
    return;
  }
  // 相机与画布尺寸的指纹：任一项变了都说明上一张位图不能再用
  const key = state.anchorSX + "|" + state.anchorSY + "|" + state.logScale + "|" +
    state.cssW + "|" + state.cssH + "|" + dpr;
  if (gridCacheKey !== key) {
    if (gridCache === null) {
      gridCache = document.createElement("canvas");
      gridCacheCtx = gridCache.getContext("2d");
    }
    const w = Math.round(state.cssW * dpr);
    const h = Math.round(state.cssH * dpr);
    // 位图尺寸跟着画布走，否则换了窗口大小会贴出一张被拉伸的旧图
    if (gridCache.width !== w || gridCache.height !== h) {
      gridCache.width = w;
      gridCache.height = h;
    }
    // 离屏也用 CSS 像素坐标系，与主画布同一套，绘制代码才能原样复用
    gridCacheCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    gridCacheCtx.clearRect(0, 0, state.cssW, state.cssH);
    paintGrid(gridCacheCtx, vp);
    gridCacheKey = key;
  }
  // 位图按 CSS 尺寸贴回：主画布的变换已含 dpr，正好一比一落到物理像素上，不会糊
  ctx.drawImage(gridCache, 0, 0, state.cssW, state.cssH);
}

// 画激光场：把每段裁到视口范围，再描两遍——先粗的半透明外光，后细的实心光芯
// 线段端点可能是 ±Infinity，夹到视口的世界范围即可，不必真去算无穷远
// 不缓存路径：裁剪结果依赖当前相机，而线段条数很少，每帧重建这点开销远小于维护缓存的复杂度
function drawLaser(vp) {
  if (laserSegments.length === 0) return;

  // 视口对应的世界范围：注意屏幕 y 向下、世界 y 向上，所以上边界对应 maxY
  const minX = screenToWorldX(vp.x);
  const maxX = screenToWorldX(vp.x + vp.w);
  const minY = screenToWorldY(vp.y + vp.h);
  const maxY = screenToWorldY(vp.y);

  ctx.save();
  // 裁剪到视口：延伸到视口外的激光不该画到面板或画布空白处
  ctx.beginPath();
  ctx.rect(vp.x, vp.y, vp.w, vp.h);
  ctx.clip();

  // 所有线段攒成一条路径，下面两次 stroke 复用同一条，不必各建一次
  ctx.beginPath();
  for (let j = 0; j < laserSegments.length; j++) {
    const s = laserSegments[j];
    if (s.horizontal) {
      // 行上的线段：固定坐标是 wy，变化坐标是 wx
      if (s.key < minY || s.key > maxY) continue;  // 整条线在视口上下之外，跳过
      const a = Math.max(s.a, minX);
      const b = Math.min(s.b, maxX);
      if (a > b) continue;                          // 裁完为空，说明这段在视口左右之外
      ctx.moveTo(worldToScreenX(a), worldToScreenY(s.key));
      ctx.lineTo(worldToScreenX(b), worldToScreenY(s.key));
    } else {
      // 列上的线段：固定坐标是 wx，变化坐标是 wy
      if (s.key < minX || s.key > maxX) continue;
      const a = Math.max(s.a, minY);
      const b = Math.min(s.b, maxY);
      if (a > b) continue;
      ctx.moveTo(worldToScreenX(s.key), worldToScreenY(a));
      ctx.lineTo(worldToScreenX(s.key), worldToScreenY(b));
    }
  }

  ctx.lineCap = "round";  // 圆头：线段末端不出现生硬的方角
  const w = CONFIG.laserWidth * state.scale;
  // 铺辉光：若干层同心描边由内到外依次变宽变淡，叠出连续衰减
  // 用多层而不是「一圈固定宽度的半透明」，是因为后者边缘是硬的，看起来像一条带子而不是光晕
  // 关掉高级渲染就整段跳过：只剩最内层的光芯，激光的走向照样看得清，省下每层一次整路径描边
  if (advancedRenderOn) {
    const N = CONFIG.laserGlowLayers;
    ctx.strokeStyle = COLOR.laserGlow;
    for (let k = 0; k < N; k++) {
      const t = k / N;                  // 0 贴着光芯，越接近 1 越靠外
      const fade = (1 - t) * (1 - t);   // 二次衰减：近处降得慢、远处迅速消失，观感更柔
      ctx.lineWidth = w * (1 + (CONFIG.laserGlowSpread - 1) * t);
      ctx.globalAlpha = CONFIG.laserGlowAlpha * fade;
      ctx.stroke();                     // 每层复用同一条路径，不重建
    }
  }
  // 最后描光芯：实色不透明，压在最内层之上，保证中心是一根清晰的白线
  ctx.globalAlpha = 1;
  ctx.lineWidth = w;
  ctx.strokeStyle = COLOR.laserCore;
  ctx.stroke();

  ctx.restore();
}

// 画灯的光晕：被照亮的灯在元件层之下铺一团淡红辉光，元件本体是独立 SVG 图层，天然压在光晕中心上
// 关掉高级渲染就整段跳过，与激光辉光保持一致；强度随亮起进度一起涨落，灯不会突然冒出一团光
// 用高斯模糊把灯的轮廓整体向外化开，而不是画一个圆形渐变：
// 圆形渐变与方形灯形状对不上，光晕在四角和四边深浅不一，看上去就是一圈能看出来的边界
// 模糊的是灯本身那个圆角方框，所以光晕天然贴着灯的轮廓，由内到外连续变淡，没有硬边
function drawLampGlow(vp) {
  if (!advancedRenderOn) return;
  // 画布滤镜是标准能力，万一浏览器不支持就别画了：宁可没有光晕，也不要画出一圈硬邦邦的色块
  if (typeof ctx.filter !== "string") return;
  ctx.save();
  // 裁剪到视口：视口外的灯不该把光晕画到面板或画布空白处
  ctx.beginPath();
  ctx.rect(vp.x, vp.y, vp.w, vp.h);
  ctx.clip();
  // 模糊半径随缩放走，灯放大时光晕跟着一起放大，观感始终一致
  ctx.filter = "blur(" + (CONFIG.lampGlowBlur * state.scale) + "px)";
  ctx.fillStyle = COLOR.lampGlow;
  const h = CONFIG.lampHalf * state.scale;        // 光晕底形与灯同大，模糊后自然向外晕出
  const r = CONFIG.lampRadius * state.scale;
  for (let i = 0; i < elements.length; i++) {
    const el = elements[i];
    if (el.typeId !== "lamp" || el.deleting) continue;
    const k = el.litP.cur;
    if (k <= 0) continue;  // 没亮的灯完全不画，省掉一次建路径与模糊
    // 位置取画面的视觉位置：数据位置加上拖动缓动偏移，光晕才跟着灯一起滑
    const cx = worldToScreenX(el.wx + el.mvOffU);
    const cy = worldToScreenY(el.wy + el.mvOffV);
    // 模糊会把边缘摊薄一半，所以贴边处约是这里的一半浓度，整体就是一层淡红
    ctx.globalAlpha = CONFIG.lampGlowAlpha * k;
    ctx.beginPath();
    ctx.roundRect(cx - h, cy - h, h * 2, h * 2, r);
    ctx.fill();
  }
  ctx.filter = "none";   // 复位滤镜，别把后续绘制也糊掉
  ctx.globalAlpha = 1;
  ctx.restore();
}

// 画视口边框，明确标出可显示区域的边界
function drawViewportBorder(vp) {
  ctx.save();
  ctx.lineWidth = 2;
  ctx.strokeStyle = COLOR.border;
  ctx.strokeRect(vp.x + 1, vp.y + 1, vp.w - 2, vp.h - 2);
  ctx.restore();
}

// 画上方元件面板的占位矩形：左右两条边与网格视口边框严格对齐（同 x、同宽度）
// 线宽和颜色直接沿用视口边框，两者是同一套外框样式，看起来才是一体的
// +1/-2 的写法和视口边框一致：让 2px 描边整个落在矩形内部，外沿正好压在 vp.x 与 vp.x + vp.w 上
function drawPanelBox(vp) {
  const gap = CONFIG.panelGap;
  const x = vp.x;
  const w = vp.w;
  const y = gap;
  const h = vp.y - gap * 2; // 上下各留 gap，中间才是矩形
  ctx.save();
  // 底板色硬编码取 COLOR.panelFill，与调试面板的 HSL 滑块解绑：滑块只当取色沙盒，不影响实际渲染
  // 先铺底色再描边：填充范围同样内缩 1px，正好落在描边内侧，边界上不会露出半像素白边
  ctx.fillStyle = COLOR.panelFill;
  ctx.fillRect(x + 1, y + 1, w - 2, h - 2);
  ctx.lineWidth = 2;
  ctx.strokeStyle = COLOR.border;
  ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
  ctx.restore();
}

// 画底部那条栏：风格与上方元件面板完全一致（同底色、同线宽、同描边色、同样是直角），只是高度减半
// 左右两条边同样与网格视口边框对齐；上下各留一个 panelGap，整页上下才是对称的
// 栏内只放一行随状态变化的操作提示，具体文字见 hintText
function drawBottomBar(vp) {
  const gap = CONFIG.panelGap;
  const h = CONFIG.bottomBarHeight;
  const x = vp.x;
  const w = vp.w;
  const y = state.cssH - gap - h;  // 底边离窗口底一个 gap，从下往上量出栏高
  ctx.save();
  ctx.fillStyle = COLOR.panelFill;
  ctx.fillRect(x + 1, y + 1, w - 2, h - 2);
  ctx.lineWidth = 2;
  ctx.strokeStyle = COLOR.border;
  ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
  ctx.restore();
}

// 当前有没有选中的元件：删除动画中的不算，它已经退出模拟，也不该算进选区
function hasSelectedElement() {
  for (let i = 0; i < elements.length; i++) {
    if (elements[i].selected && !elements[i].deleting) return true;
  }
  return false;
}

// 底栏提示的文字：按当前状态挑一条最相关的，回答的是「我现在这一刻能干什么」，不是一份说明书
// 顺序就是优先级，越靠前越具体：正在做的动作 > 手上有东西 > 指针下的东西 > 手上拿的工具 > 默认
// 每次重绘都重算一遍，所以不必另外维护一份「当前提示」，状态一变提示自然就跟着变
// 默认状态返回空串，栏里就空着，不硬凑一句话
function hintText() {
  // 正在拉框 / 正在拖动选区：这时候最该说清的是「松手之后会怎样」
  if (marqueeActive) return "松开完成框选";
  if (moveDragging) return "松手仍是悬空；点空白处才落地";
  // 手上有选中的元件：这时 WASD 转的是整批，右键删的是指针下那一个
  if (hasSelectedElement()) return "WASD旋转；右键删除";
  // 进了选中工具但手上还空着
  if (selectToolActive()) return "拖动框选；shift追加";
  // 指针不在画布上：位置相关的操作都不作数，按默认处理
  if (!pointerInside) return "";
  // 指针停在某个元件上：光源能开关，别的元件只能右键删
  const hovered = findElementAtPointer();
  if (hovered !== null && !hovered.deleting) {
    return hovered.typeId === "light" ? "点击开启/关闭；右键删除" : "WASD旋转；右键删除";
  }
  // 手上拿着元件，正在挑格子放；拿的是光源时多一条开关说明
  // WASD旋转放在缩放之后、开关之前：两条提示里它都紧跟着滚轮缩放，位置固定，读起来不会跳
  const typeId = selectedTypeId();
  if (typeId === "light") return "左键放置；数字键/ ` 键选择；中键拖动视野；滚轮缩放；WASD旋转；点击开启/关闭";
  if (typeId !== null) return "左键放置；数字键/ ` 键选择；中键拖动视野；滚轮缩放；WASD旋转";
  return "";  // 默认：无提示
}

// 把提示文字画在底部栏里：单行、垂直居中、左对齐
// 左内缩取与上方第一个元件槽相同的值，上下两栏的左边缘落在同一条竖线上
// 用 save/restore 包住，字体与对齐方式不会漏到后面的绘制里去
function drawBottomBarHint(vp) {
  const text = hintText();
  if (text === "") return;  // 默认状态没有提示，栏里就空着
  const h = CONFIG.bottomBarHeight;
  const y = state.cssH - CONFIG.panelGap - h;
  const x = vp.x + 2 + CONFIG.panelSlotPad;
  ctx.save();
  ctx.font = CONFIG.hintFontSize + "px " + UI_FONT;
  ctx.fillStyle = COLOR.hintText;
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  // 窗口太窄时提示会比栏还宽：宁可不显示，也不要让它压到描边上、甚至溢出到栏外
  if (ctx.measureText(text).width > vp.x + vp.w - 16 - x) { ctx.restore(); return; }
  ctx.fillText(text, x, y + h / 2);
  ctx.restore();
}

// 第 i 个选项槽的矩形：绘制与鼠标命中判定共用这一个函数，保证「看到的框」和「判定区」永远一致
// 槽恒为正方形，边长取固定常量而不是面板高度：面板以后调整高度，槽的尺寸不会跟着变
function panelSlotRect(i, vp) {
  const pad = CONFIG.panelSlotPad;
  const side = CONFIG.panelSlotSide;
  return {
    x: vp.x + 2 + pad + i * (side + CONFIG.panelSlotGap),  // 从面板左内侧起横向排开
    y: CONFIG.panelGap + 2 + pad,
    w: side,
    h: side
  };
}

// 设置入口槽的矩形：与元件槽同尺寸、同一行的 y，但贴在面板右内侧，序号排在元件槽之后
// 右内缩用和左边同一个 pad：左右留白对称，槽不会贴到面板边框上，以后加元件也挤不走它
function settingsSlotRect(vp) {
  const pad = CONFIG.panelSlotPad;
  const side = CONFIG.panelSlotSide;
  return {
    x: vp.x + vp.w - 2 - pad - side,
    y: CONFIG.panelGap + 2 + pad,
    w: side,
    h: side
  };
}

// 文件入口槽的矩形：尺寸与 y 直接沿用设置入口，只把横坐标往左挪一格加一个间隔
// 这样两个按钮永远同高同宽、间距等于元件槽之间的间隔，面板宽度变了也不会错位
function fileSlotRect(vp) {
  const sr = settingsSlotRect(vp);
  return {
    x: sr.x - CONFIG.panelSlotSide - CONFIG.panelSlotGap,
    y: sr.y,
    w: sr.w,
    h: sr.h
  };
}

// 教程入口槽的矩形：尺寸与 y 沿用文件入口，横坐标再往左挪一格加一个间隔
// 三个按钮永远同高同宽、间距等于元件槽之间的间隔，面板宽度变了也不会错位
function tutorialSlotRect(vp) {
  const fr = fileSlotRect(vp);
  return {
    x: fr.x - CONFIG.panelSlotSide - CONFIG.panelSlotGap,
    y: fr.y,
    w: fr.w,
    h: fr.h
  };
}

// 齿轮轮廓的点列：每个齿依次走「齿根左→齿顶左→齿顶右→齿根右」，角度单调递增所以不会自交
// 齿根半角大于齿顶半角，齿才呈上窄下宽的梯形；半径用世界单位，画时整体乘缩放，大小自动与元件对齐
function gearPoints() {
  const n = CONFIG.gearTeeth;
  const step = Math.PI * 2 / n;                         // 每个齿占的圆心角
  const tip = CONFIG.gearTipHalfDeg * Math.PI / 180;    // 齿顶半角：决定齿顶那条边的宽度
  const root = CONFIG.gearRootHalfDeg * Math.PI / 180;  // 齿根半角：比齿顶大，差值就是齿的锥度
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = i * step;  // 第 i 个齿的中心角
    pts.push([Math.cos(a - root) * CONFIG.gearRootR, Math.sin(a - root) * CONFIG.gearRootR]);
    pts.push([Math.cos(a - tip) * CONFIG.gearTipR, Math.sin(a - tip) * CONFIG.gearTipR]);
    pts.push([Math.cos(a + tip) * CONFIG.gearTipR, Math.sin(a + tip) * CONFIG.gearTipR]);
    pts.push([Math.cos(a + root) * CONFIG.gearRootR, Math.sin(a + root) * CONFIG.gearRootR]);
  }
  return pts;
}

// 文件图标的轮廓：一张右上角折起的纸，外框圆角用 arcTo 磨圆，与齿轮的圆角风格一致
// 路径按顺时针走一圈：左上→左下→右下→右边上行到折角→折角斜边→回到左上
function traceFilePath() {
  const hw = CONFIG.fileHalfW;
  const hh = CONFIG.fileHalfH;
  const r = CONFIG.fileCornerR;
  const f = CONFIG.fileFoldLen;
  ctx.beginPath();
  ctx.moveTo(-hw + r, -hh);                        // 从顶边靠左的位置起笔
  ctx.arcTo(-hw, -hh, -hw, -hh + r, r);            // 左上圆角
  ctx.lineTo(-hw, hh - r);
  ctx.arcTo(-hw, hh, -hw + r, hh, r);              // 左下圆角
  ctx.lineTo(hw - r, hh);
  ctx.arcTo(hw, hh, hw, hh - r, r);                // 右下圆角
  ctx.lineTo(hw, -hh + f);                         // 右边上行，停在折角开始处
  ctx.lineTo(hw - f, -hh);                         // 折角的斜边
  ctx.lineTo(-hw + r, -hh);
  ctx.closePath();
}

// 在槽内画文件图标：坐标与齿轮同一套世界单位，所以两者大小、粗细天然一致
// 先描折角再描外框，最后统一填充，避免填充把折角线盖掉
function drawFileIcon(r) {
  const cx = r.x + r.w / 2;
  const cy = r.y + r.h / 2;
  const k = CONFIG.panelSlotElementLen / CONFIG.elementLen;  // 与元件槽同一个缩放系数
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(k, k);
  ctx.strokeStyle = hslCss(settingsHSL.gearStroke);
  ctx.lineWidth = CONFIG.fileStroke;
  ctx.lineJoin = "round";  // 折角与圆角都用圆角连接，和元件的圆角风格一致
  traceFilePath();
  ctx.fillStyle = hslCss(settingsHSL.gearFill);
  ctx.fill();
  ctx.stroke();
  // 折角的小翻边：单独描一个 L 形，纸面看起来才是折过来的，而不是缺了一个角
  const hw = CONFIG.fileHalfW;
  const hh = CONFIG.fileHalfH;
  const f = CONFIG.fileFoldLen;
  ctx.beginPath();
  ctx.moveTo(hw - f, -hh);
  ctx.lineTo(hw - f, -hh + f);
  ctx.lineTo(hw, -hh + f);
  ctx.stroke();
  ctx.restore();
}

// 在槽内画「教程」图标：外圈与问号的基础几何取自 Lucide / Feather 图标库的 help-circle，问号按本项目的习惯微调过
// 原图是 24×24 网格：外圈是半径 10 的圆、描边 2、圆头圆角；问号在原图基础上把钩上移、补一笔竖、点下移，细节见下方注释
// 换算：先把原图坐标整体减 12 把原点挪到圆心，再乘比例缩到槽内，所以改外缘半径时整幅图标等比缩放
// 圆面填实成与齿轮、文件图标同一支蓝，边框只当一圈细轮廓；问号取边框同色，与圆环呼应成一体
function drawTutorialIcon(r) {
  const cx = r.x + r.w / 2;
  const cy = r.y + r.h / 2;
  const k = CONFIG.panelSlotElementLen / CONFIG.elementLen;  // 与元件槽同一个缩放系数，图标大小天然对齐
  const s = CONFIG.tutorialIconOuterR / 11;  // 原图外缘半径是圆半径 10 加半个描边 1，共 11
  const gx = (v) => (v - 12) * s;            // 原图横坐标 → 槽心坐标：先减半格挪原点，再等比缩小
  const gy = (v) => (v - 12) * s;            // 纵坐标同一比例，两轴一致，图形不会被拉变形
  const markCss = hslCss(settingsHSL.gearStroke);  // 问号颜色：与圆环边框同一支色，内外一个色系
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(k, k);
  ctx.lineCap = "round";   // 原图就是圆头：问号的勾、尾巴和那个点都靠它收得圆润
  ctx.lineJoin = "round";
  // 外圈：原图 <circle cx=12 cy=12 r=10>，圆心正好落在槽心；圆面填实，描边单独用细一档的线宽
  ctx.beginPath();
  ctx.arc(0, 0, 10 * s, 0, Math.PI * 2);
  ctx.fillStyle = hslCss(settingsHSL.gearFill);      // 圆面填色：取齿轮本体那支蓝，与齿轮、文件图标一致
  ctx.strokeStyle = hslCss(settingsHSL.gearStroke);  // 边框描边：与齿轮描边同色，粗细另取一支更细的
  ctx.lineWidth = CONFIG.tutorialRingStroke;
  ctx.fill();
  ctx.stroke();
  // 问号主体：在原图路径 M9.09 9 a3 3 0 0 1 5.83 1 c0 2-3 3-3 3 上做了三处调整
  // 一是钩整体上移 0.7 格，二是尾巴改成末端竖直，三是补了一笔短竖，最后把点往下挪 0.7 格
  // 这样钩、尾、竖、点四段上下连贯：钩的末端与尾的起端切线都朝正下方，接缝处不会有折角
  ctx.beginPath();
  ctx.moveTo(gx(9.09), gy(8.30));
  ctx.arc(gx(11.92), gy(9.30), 3 * s, -2.8033, 0.0015, false);  // 弧的扫角沿用原图，只把弧心整体上移
  // 尾：从钩的右下端往下探、边下探边向左靠到中轴，末端切线正好竖直，与下面那笔竖无缝接上
  ctx.bezierCurveTo(gx(14.90), gy(11.00), gx(12.00), gy(11.30), gx(12.00), gy(12.30));
  // 竖：原图没有这一笔，是补的；短短一竖压在中轴上，问号才立得住，也才与这套元件的直线风格一致
  ctx.lineTo(gx(12.00), gy(14.20));
  ctx.strokeStyle = markCss;  // 问号用边框同色描出来，与外面那圈细边框呼应
  ctx.lineWidth = 2 * s;      // 问号描边宽度：沿用原图的 2 同比缩小，比圆环略粗一档，缩小后仍看得清
  ctx.stroke();
  // 点：原图用一段零长度的线配圆头描边画成；Canvas 对零长度子路径不保证给圆头
  // 所以直接填一个半径等于半个描边宽的圆，观感与原图一致，也更稳妥；位置比原图下移了 0.7 格
  ctx.beginPath();
  ctx.arc(gx(12), gy(17.70), s, 0, Math.PI * 2);
  ctx.fillStyle = markCss;
  ctx.fill();
  ctx.restore();
}

// 「选中」指针箭头的轮廓点列（归一化坐标：x 向右、y 向下，左上角是笔尖）
// 存归一化点列而不是直接写世界坐标：以后想调箭头形状只改这几个点，居中和缩放由绘制时算出来
const SELECT_ICON_PTS = [
  [0.08, 0.02],   // 笔尖
  [0.08, 0.78],   // 左边缘向下到底
  [0.28, 0.60],   // 往内收的缺口
  [0.42, 0.95],   // 尾巴左下
  [0.56, 0.88],   // 尾巴右下
  [0.42, 0.55],   // 尾巴右上
  [0.66, 0.55]    // 右侧倒钩
];

// 在槽里画「选中」图标：一个指针箭头，与其它图标共用同一套局部坐标（原点在槽心）
// 点列先按包围盒居中、再按高度缩放，所以改形状不必重新算偏移，箭头永远落在槽心
function drawSelectIcon(r) {
  const cx = r.x + r.w / 2;
  const cy = r.y + r.h / 2;
  const k = CONFIG.panelSlotElementLen / CONFIG.elementLen;  // 与元件槽同一个缩放系数，图标大小天然对齐
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (let i = 0; i < SELECT_ICON_PTS.length; i++) {
    const p = SELECT_ICON_PTS[i];
    if (p[0] < minX) minX = p[0];
    if (p[0] > maxX) maxX = p[0];
    if (p[1] < minY) minY = p[1];
    if (p[1] > maxY) maxY = p[1];
  }
  const s = CONFIG.selectIconH / (maxY - minY);  // 按高度定缩放，宽度随形状比例自动得出
  const ox = (minX + maxX) / 2;
  const oy = (minY + maxY) / 2;
  ctx.save();
  ctx.translate(cx + CONFIG.selectIconDX * k, cy);  // 右移量按同一个缩放系数换算成屏幕像素
  ctx.scale(k, k);
  ctx.fillStyle = hslCss(settingsHSL.gearFill);
  ctx.strokeStyle = hslCss(settingsHSL.gearStroke);
  ctx.lineWidth = CONFIG.selectIconStroke;
  ctx.lineJoin = "round";   // 拐角磨圆，与齿轮、文件图标的圆角风格一致
  ctx.beginPath();
  for (let i = 0; i < SELECT_ICON_PTS.length; i++) {
    const x = (SELECT_ICON_PTS[i][0] - ox) * s;
    const y = (SELECT_ICON_PTS[i][1] - oy) * s;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.stroke();   // 先描边后填充：描边内侧那半被填充盖住、只留外面一圈，与元件画法一致
  ctx.fill();
  ctx.restore();
}

// 画一个按钮槽：文件与设置两个按钮共用，保证两者的底色、描边、缩放、悬停按下手感完全一致
// 图标由调用方传入并在同一个缩放坐标系里绘制，所以图标必然跟着框一起缩，不会只缩框不缩图标
function drawButtonSlot(r, animIndex, lit, drawIcon) {
  const s = slotAnim[animIndex].cur;  // 按钮当前缩放比例：悬停略缩、按下更缩
  ctx.save();
  // 和元件槽一样绕槽心缩放：框和图标共用这套局部坐标
  ctx.translate(r.x + r.w / 2, r.y + r.h / 2);
  ctx.scale(s, s);
  ctx.translate(-(r.x + r.w / 2), -(r.y + r.h / 2));
  ctx.fillStyle = hslLit(settingsHSL.slotFill, lit);
  ctx.lineWidth = 2 / s;  // 线宽除以缩放抵消影响，缩小时描边仍是 2px，不会跟着变细
  ctx.beginPath();
  ctx.roundRect(r.x, r.y, r.w, r.h, CONFIG.panelSlotRadius);
  ctx.fill();
  ctx.strokeStyle = hslLit(settingsHSL.slotStroke, lit);
  ctx.stroke();
  drawIcon(r);
  ctx.restore();
}

// 在 Canvas 上描出齿轮的路径：外圈是齿轮点列，另起一条子路径补中心孔
// 两条子路径配合 evenodd 填充，孔才是真的透出槽底色，而不是拿别的颜色盖一块圆上去
function traceGearPath() {
  const pts = gearPoints();
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  // 起点正好落在圆弧的起始角上，所以 moveTo 之后接 arc 不会多出一条连线
  ctx.moveTo(CONFIG.gearHoleR, 0);
  ctx.arc(0, 0, CONFIG.gearHoleR, 0, Math.PI * 2);
}

// 在槽里画设置图标：形状与元件共用同一套局部坐标（原点在中心），这里只是平移到槽心再整体缩放
// 齿轮不参与提亮：亮起的只有底板，齿轮保持原色，两者对比更强，齿形反而比一起变白时更清楚
// 先描边后填充：描边内侧那半被填充盖住、只留外面一圈，与元件的画法保持一致
function drawSettingsIcon(r) {
  const cx = r.x + r.w / 2;
  const cy = r.y + r.h / 2;
  const k = CONFIG.panelSlotElementLen / CONFIG.elementLen;  // 与元件槽同一个缩放系数，两者大小天然对齐
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(k, k);
  ctx.fillStyle = hslCss(settingsHSL.gearFill);
  ctx.strokeStyle = hslCss(settingsHSL.gearStroke);
  ctx.lineWidth = CONFIG.gearStroke;  // 用世界单位，随 k 一起放大，视觉粗细与槽内元件协调
  ctx.lineJoin = "round";             // 齿的尖角靠描边的圆角连接磨圆，与元件的圆角风格一致
  traceGearPath();
  ctx.stroke();
  ctx.fill("evenodd");  // 必须显式给 evenodd：默认的 nonzero 会把中心孔一起填实，齿轮就成了实心饼
  ctx.restore();
}

// 简介浮层的位置：紧贴面板矩形下边缘再留一点间隔，向下盖在网格上
// 不占面板高度，所以面板维持原高度、网格区域也不被压缩
function panelTipRect(vp) {
  const pad = CONFIG.panelSlotPad;
  return {
    x: vp.x + 2 + pad,                              // 与槽一样从面板左内侧起
    y: vp.y - CONFIG.panelGap + CONFIG.panelTipGap, // 面板矩形下边缘再往下一点
    w: vp.w - 4 - pad * 2                           // 横跨面板内宽
  };
}

// 在槽内画指定类型的元件：形状与网格上的元件同一套本地坐标（原点在元件中心、顶点朝 -y），这里只是平移到槽心再整体缩放
function drawSlotElement(r, typeId) {
  const cx = r.x + r.w / 2;
  const cy = r.y + r.h / 2;
  // 缩放系数 = 槽内期望长度 / 元件的世界单位长度，形状比例因此和网格上的元件完全一致
  const k = CONFIG.panelSlotElementLen / CONFIG.elementLen;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(k, k);
  ctx.fillStyle = hslCss(elementHSL.fill);
  ctx.strokeStyle = hslCss(elementHSL.stroke);
  ctx.lineWidth = CONFIG.elementStroke;  // 描边宽度用世界单位，随 k 一起放大，视觉粗细与网格上的元件对齐
  ctx.lineJoin = "round";                // 圆角靠描边的圆角连接实现，与 SVG 侧的 stroke-linejoin 一致
  // 路径由类型点列生成：和 SVG 侧同一份形状定义，两套渲染不会各自漂移
  traceElementPath(typeId);
  // 先描边后填充：描边内侧那半被填充盖住、只留外面一圈，与 SVG 侧的 paint-order="stroke" 等价
  ctx.stroke();
  ctx.fill();
  ctx.restore();
}

// 画面板里的一排选项槽：panelSlotCount 个正方形圆角槽，从面板左内侧起横向排开
// 悬停的槽整体缩小，缩小靠「绕槽心缩放坐标系」实现，所以槽里的元件必然跟着一起缩
function drawPanelSlots(vp) {
  ctx.save();
  for (let i = 0; i < CONFIG.panelSlotCount; i++) {
    const r = panelSlotRect(i, vp);
    const s = slotAnim[i] ? slotAnim[i].cur : 1;  // 该槽当前缩放比例，1 为原尺寸
    const selected = (i === slotSelectedIndex);   // 选中的槽：填充与描边都提亮、描边更粗
    const cx = r.x + r.w / 2;
    const cy = r.y + r.h / 2;
    ctx.save();
    // 槽填充硬编码取常量，与调试面板的 HSL 滑块解绑：滑块只当取色沙盒，不影响实际渲染
    ctx.fillStyle = selected ? COLOR.slotFillSelected : COLOR.slotFill;
    // 把坐标系绕槽心缩一下再画：槽和元件共用这套局部坐标，元件自动跟随方框，不会只缩框不缩元件
    ctx.translate(cx, cy);
    ctx.scale(s, s);
    ctx.translate(-cx, -cy);
    // 线宽除以 s 抵消缩放对描边的影响，缩小时描边仍是设定宽度，不会跟着变细
    ctx.lineWidth = (selected ? CONFIG.slotSelectedBorderWidth : 2) / s;
    ctx.beginPath();
    // roundRect 是标准的 Canvas 2D 方法，第 5 个参数直接给圆角半径
    ctx.roundRect(r.x, r.y, r.w, r.h, CONFIG.panelSlotRadius);
    ctx.fill();
    // 描边：选中的槽略粗且略微提亮，未选中用本色；按下不改色，所以按下不会闪
    ctx.strokeStyle = selected ? COLOR.slotBorderSelected : COLOR.slotBorder;
    ctx.stroke();
    // 选中槽画指针箭头，元件槽画对应元件，其余空槽保持纯色方块
    if (i === SELECT_SLOT_INDEX) drawSelectIcon(r);
    else if (isElementSlot(i)) drawSlotElement(r, PANEL_SLOT_TYPES[i - ELEMENT_SLOT_BASE]);
    ctx.restore();
  }
  // 文件入口：贴在设置入口左边一格，提亮规则与设置入口完全一致，只是各用各的进度标量
  const fileLit = fileLitAnim.cur * CONFIG.settingsLitAmount;  // 文件弹窗打开时的提亮幅度：与设置同一档，两个按钮亮起来才不会一深一浅
  drawButtonSlot(fileSlotRect(vp), FILE_SLOT_INDEX, fileLit, drawFileIcon);
  // 教程入口：再贴在文件入口左边一格，同样各用各的进度标量，三个按钮的亮灭深浅一致
  const tutorialLit = tutorialLitAnim.cur * CONFIG.settingsLitAmount;  // 教程按钮打开时的提亮幅度：与另外两个同一档
  drawButtonSlot(tutorialSlotRect(vp), TUTORIAL_SLOT_INDEX, tutorialLit, drawTutorialIcon);
  // 设置入口：排在左边那排之后、单独贴右边画，所以以后往面板里加元件也不会把它挤走
  const lit = settingsLitAnim.cur * CONFIG.settingsLitAmount;  // 底板打开时的提亮幅度：按进度乘上配置的幅度
  drawButtonSlot(settingsSlotRect(vp), SETTINGS_SLOT_INDEX, lit, drawSettingsIcon);
}

// 把简介浮层的外观一次性从 CONFIG / COLOR 注入到 DOM：字号、行高、内边距、圆角、颜色仍集中在配置里
// 只做一次，不必每帧写样式；文本折行交给浏览器，不用再手动测量断行
function initSlotTipDom() {
  tipDom.style.padding = CONFIG.panelTipPadY + "px " + CONFIG.panelTipPadX + "px";
  tipDom.style.borderRadius = CONFIG.panelTipRadius + "px";
  tipDom.style.background = COLOR.tipFill;
  tipDom.style.borderColor = COLOR.tipBorder;
  tipDom.style.color = COLOR.tipDesc;
  tipDomName.style.fontSize = CONFIG.panelTipNameSize + "px";
  tipDomName.style.lineHeight = (CONFIG.panelTipNameSize + 5) + "px";  // 名称行高：字号再留一点行距，与说明行拉开层次
  tipDomName.style.color = COLOR.tipName;
  tipDomDesc.style.fontSize = CONFIG.panelTipDescSize + "px";
  tipDomDesc.style.lineHeight = CONFIG.panelTipLineHeight + "px";
}

// 把简介浮层同步到 DOM：内容只在换槽时写一次，位置、宽度、透明度、位移每帧更新
// 浮层是独立 DOM 层且 z-index 高于元件层，所以网格上有元件时也不会被盖住
function renderSlotTip(vp) {
  const p = tipAnim.cur;  // 显隐进度：0 全隐、1 全显
  // 收起状态直接隐藏：连同已写入的槽序号一起清掉，下次显示一定重写内容
  if (tipIndex < 0 || p <= 0.001) {
    tipDomIndex = -1;
    tipDom.style.display = "none";
    return;
  }
  if (tipDom.style.display === "none") tipDom.style.display = "";
  // 内容只在换槽时写：同一槽连续多帧不重复改 DOM
  if (tipIndex !== tipDomIndex) {
    tipDomIndex = tipIndex;
    const type = ELEMENT_TYPES[PANEL_SLOT_TYPES[tipIndex - ELEMENT_SLOT_BASE]];
    tipDomName.textContent = type.name;
    tipDomDesc.textContent = type.desc;
  }
  const pos = panelTipRect(vp);
  tipDom.style.left = pos.x + "px";
  tipDom.style.top = pos.y + "px";
  tipDom.style.width = pos.w + "px";
  tipDom.style.opacity = p;
  // 未显示时整体上移一段，随进度滑到位：像是从面板里推出来，而不是硬生生冒出来
  tipDom.style.transform = "translateY(" + (-(1 - p) * CONFIG.panelTipRise) + "px)";
}

/* ========== 存档（序列化与反序列化） ========== */

// 把一个元件转成一条存档记录：坐标由格心换算回整数格，朝向由目标角度换算
// 序列化整份存档与序列化剪贴板共用它，两处的换算规则不会各写一份、慢慢跑偏
function elementToRecord(el) {
  return {
    type: el.typeId,
    gx: Math.round(el.wx - 0.5),  // 元件恒在格心，世界坐标必是半整数，换算成整数格索引无损且无浮点误差
    gy: Math.round(el.wy - 0.5),
    // 朝向取目标角度换算出来的离散值：旋转动画途中朝向索引还没同步，直接读它会存到转过之前的旧方向
    dir: ((Math.round(el.angleTarget / 90) % 4) + 4) % 4,
    on: el.on
  };
}

// 序列化：把当前电路与视野转成纯数据对象，不碰画面也不碰文件，因此可以单独验证
// 只导出电路与视野两类；界面设置与配色属于工作环境偏好，不进存档
function serializeScene() {
  const list = [];
  for (let i = 0; i < elements.length; i++) {
    const el = elements[i];
    if (el.deleting) continue;  // 正在播放消失动画的元件不算数，存下来会凭空多出一个
    list.push(elementToRecord(el));
  }
  return {
    format: "laser-gate",   // 格式标记：读档时用来挡住误把别的 JSON 当存档读的情况
    version: 1,             // 结构版本：以后改结构时递增，读档按它决定怎么解释
    view: {
      worldX: state.anchorWX,   // 参考点的世界坐标
      worldY: state.anchorWY,
      screenX: state.anchorSX,  // 同一个参考点落在屏幕上的位置，与缩放一起唯一确定当前视野
      screenY: state.anchorSY,
      scale: state.scale
    },
    elements: list
  };
}

// 当前程序认识的元件类型标识：校验存档时用它判断某条元件还能不能认出来
// 直接从元件类型表取键，以后加元件类型不必改这里
const KNOWN_ELEMENT_TYPES = Object.keys(ELEMENT_TYPES);

// 判断一个值是不是可用的有限数字：存档来自外部文件，字符串和 NaN 都不能放行
function isFiniteNumber(v) {
  return typeof v === "number" && isFinite(v);
}

// 反序列化：校验一份存档数据，逐条筛出能用的元件，并先判断整份文件能不能用
// 只做判断与换算，不碰画面也不读文件；返回 { ok, reason, view, elements, skipped }
//   ok       整份文件能不能用，false 时 reason 说明原因，此时元件列表为空
//   view     视野，缺失或取值不合法时为 null，交给后面应用的那一步退回默认视野
//   elements 校验通过的元件，字段已换算成程序内部用的形式
//   skipped  被跳过的条目与原因，用来告诉用户一共跳了几条
function parseScene(raw) {
  // 整份文件不可用的几种情况统一从这里返回，免得每个分支各写一遍
  const reject = function (reason) {
    return { ok: false, reason: reason, view: null, elements: [], skipped: [] };
  };
  if (raw === null || typeof raw !== "object" || Array.isArray(raw)) return reject("不是本程序的存档");
  if (raw.format !== "laser-gate") return reject("不是本程序的存档");
  if (raw.version !== 1) return reject("版本不认识");
  if (!Array.isArray(raw.elements)) return reject("不是本程序的存档");

  const list = [];
  const skipped = [];
  for (let i = 0; i < raw.elements.length; i++) {
    const e = raw.elements[i];
    if (e === null || typeof e !== "object" || Array.isArray(e)) { skipped.push({ reason: "条目不是对象", raw: e }); continue; }
    if (KNOWN_ELEMENT_TYPES.indexOf(e.type) < 0) { skipped.push({ reason: "元件类型不认识", raw: e }); continue; }
    // 坐标必须是整数：元件恒在格心，非整数说明这份数据不是本程序写的，放进去会落在格子中间
    if (!Number.isInteger(e.gx) || !Number.isInteger(e.gy)) { skipped.push({ reason: "坐标不是整数", raw: e }); continue; }
    // 朝向必须是 0~3：超范围的朝向会让发射方向掩码算出一个不存在的边，模拟会整个错乱
    if (!Number.isInteger(e.dir) || e.dir < 0 || e.dir > 3) { skipped.push({ reason: "朝向不合法", raw: e }); continue; }
    list.push({
      typeId: e.type,
      wx: e.gx + 0.5,     // 格索引换算回格心世界坐标，与序列化那一步互为逆运算
      wy: e.gy + 0.5,
      dir: e.dir,
      on: e.on === true   // 缺省当关：这个字段只有光源用得上，缺失不该让整条元件作废
    });
  }

  // 视野五项必须都是有限数，缩放还必须是正数：有一项不对就整体退回默认视野，不让坏数据把画面推到看不见的地方
  let view = null;
  const v = raw.view;
  if (v !== null && typeof v === "object" && !Array.isArray(v) &&
      isFiniteNumber(v.worldX) && isFiniteNumber(v.worldY) &&
      isFiniteNumber(v.screenX) && isFiniteNumber(v.screenY) &&
      isFiniteNumber(v.scale) && v.scale > 0) {
    view = { worldX: v.worldX, worldY: v.worldY, screenX: v.screenX, screenY: v.screenY, scale: v.scale };
  }
  return { ok: true, reason: "", view: view, elements: list, skipped: skipped };
}

// 清空画布上所有元件并复位模拟状态：读档前必须走一遍，否则旧电路会和读进来的叠在一起
// 只清电路与推演状态，不动指针、槽位、弹窗这些界面状态——那些属于交互，不属于这一局
function clearScene() {
  for (let i = 0; i < elements.length; i++) elemLayer.removeChild(elements[i].node);
  elements.length = 0;
  recvMask = [];          // 接收掩码是按元件下标存的，元件没了它必须跟着清空，否则下标会串到新元件上
  laserSegments = [];     // 上一帧的激光场一并清掉，不然读档那一瞬间会闪出一片属于旧电路的激光
  lastEmit = null;        // 发射记录作废，让下一微帧从头重新推演
  microframe = 0;         // 微帧计数归零，新电路从第 0 帧重新开始
  microAcc = 0;           // 累加余数清零，免得带着旧电路攒下的零头多算一个微帧
  rayGraph.dirty = true;  // 阻挡图整体作废：放在最后做，避免在元件数组半替换的中途被触发重建
}

// 把校验过的存档应用到画面：先清空旧电路，再按存档重建元件，最后把视野设过去
// 传进来的是校验层的输出，数据已确认可用，这里不再重复判断
function applyScene(parsed) {
  clearScene();
  for (let i = 0; i < parsed.elements.length; i++) {
    const e = parsed.elements[i];
    const el = placeElement(e.wx, e.wy, e.dir, e.typeId);
    el.on = e.on;   // 放置时一律按关建立，这里还原存档里记下的光源开关
  }
  // 视野：当前值和目标值一起设。只设目标值的话，相机会从旧位置慢慢飘过去，而不是立刻到位
  if (parsed.view !== null) {
    state.anchorWX = parsed.view.worldX;
    state.anchorWY = parsed.view.worldY;
    state.anchorSX = parsed.view.screenX;
    state.anchorSY = parsed.view.screenY;
    state.tAnchorSX = parsed.view.screenX;
    state.tAnchorSY = parsed.view.screenY;
    state.scale = parsed.view.scale;
    state.logScale = Math.log(parsed.view.scale);   // 缩放按对数插值，两个表示必须同时设，否则相机会自己动一下
    state.tLogScale = state.logScale;
  }
  resetHistory();  // 换文档不是编辑动作：上一条电路的历史留着只会撤出莫名其妙的画面，直接清空
  sceneDirty = true;
}

/* ========== 弹出面板（设置 / 文件） ========== */

// 弹窗位置：右边缘与所锚定按钮槽的右内沿对齐，顶边贴在上方面板矩形下边缘之下
// 传哪个按钮的矩形就挂在哪个按钮正下方，两个弹窗共用这一条定位规则，宽度也保持一致
function popupPanelRect(vp, anchorRect) {
  return {
    x: anchorRect.x + anchorRect.w - CONFIG.settingsPanelWidth,
    y: vp.y - CONFIG.panelGap + CONFIG.settingsPanelGap,
    w: CONFIG.settingsPanelWidth
  };
}

// 把弹窗的通用外观一次性从 CONFIG / COLOR 注入到 DOM：与简介浮层同一套做法，样式不必每帧重写
// 两个弹窗都走它，底板色、圆角、内边距、字号因此天然一致，改一处两边同时生效
function initPopupDom(dom) {
  dom.style.padding = CONFIG.settingsPanelPadY + "px " + CONFIG.settingsPanelPadX + "px";
  dom.style.borderRadius = CONFIG.settingsPanelRadius + "px";
  dom.style.background = COLOR.tipFill;      // 与简介浮层同色：都是浮在网格上的浅蓝底板
  dom.style.borderColor = COLOR.tipBorder;   // 与面板、视口边框同色，整页仍是同一套外框
  dom.style.color = COLOR.tipDesc;
  dom.style.fontSize = CONFIG.settingsPanelFontSize + "px";
  // 行高逐行写死：以后往行里塞控件时高度不会因内容变化而抖
  const rows = dom.children;
  for (let i = 0; i < rows.length; i++) rows[i].style.height = CONFIG.settingsPanelRowH + "px";
}

// 初始化设置弹窗：注入通用外观，再单独接上它自己的三个控件
function initSettingsPanelDom() {
  initPopupDom(settingsPanelDom);
  // 面板里的控件只在这一处绑定：init 只跑一次，监听器不会重复注册
  gridSwitchDom.addEventListener("click", toggleGridRender);
  advSwitchDom.addEventListener("click", toggleAdvancedRender);
  speedSliderDom.addEventListener("input", onSpeedSliderInput);
  // 滑块的范围与初始位置都由配置推出来：HTML 里不写死刻度，改配置就能整体挪动
  speedSliderDom.min = "0";
  speedSliderDom.max = String(CONFIG.speedSliderSteps);
  speedSliderDom.step = "1";
  speedSliderDom.value = String(dtToSpeedSlider(CONFIG.microframeDt));
  microDt = speedSliderToDt(Number(speedSliderDom.value));  // 以滑块为准反推一次，保证首帧速度与显示位置严格一致
  updateSpeedValueLabel();                                  // 首帧也把数值写出来，不然打开设置面板时数字是空白的
}

// 初始化文件弹窗：注入通用外观，接上三个按钮，并把本地文件读写能力的检测结果写进那一行
// 以后往文件弹窗里加控件，绑定也写在这一处，init 只跑一次，监听器不会重复注册
function initFilePanelDom() {
  initPopupDom(filePanelDom);
  btnOpenDom.addEventListener("click", onOpenFile);
  btnSaveDom.addEventListener("click", onSaveFile);
  btnSaveAsDom.addEventListener("click", onSaveFileAs);
  btnImportSelDom.addEventListener("click", onImportSelection);
  btnExportSelDom.addEventListener("click", onExportSelection);
  // 按下按钮时不让它抢走焦点：按钮一旦留着焦点，之后再按回车会被浏览器当成又点了一次，
  // 而画布要靠焦点才能响应键盘，焦点不该被按钮占着。拦掉按下时的默认行为即可，点击照常触发
  filePanelDom.addEventListener("mousedown", function (e) {
    if (e.target.classList.contains("btn")) e.preventDefault();
  });
  refreshFileName();
}

// 用模板字符串整段保存而不是塞进 HTML 标签，是为了让文字与它的排版样式待在同一处，改文案不必翻回标签里

// 初始化教程弹窗：注入与设置、文件两个弹窗同款的底板外观，再摆好尺寸、接上取消按钮
// 它不锚在按钮下方而是浮在屏幕正中，定位交给 CSS 的居中规则，所以这里只写尺寸与外观
function initTutorialPanelDom() {
  tutorialPanelDom.style.width = CONFIG.tutorialPanelW + "px";
  tutorialPanelDom.style.height = CONFIG.tutorialPanelH + "px";
  tutorialPanelDom.style.padding = CONFIG.settingsPanelPadY + "px " + CONFIG.settingsPanelPadX + "px";
  tutorialPanelDom.style.borderRadius = CONFIG.settingsPanelRadius + "px";
  tutorialPanelDom.style.background = COLOR.tipFill;      // 与另外两个弹窗同色：都是浮在网格上的浅蓝底板
  tutorialPanelDom.style.borderColor = COLOR.tipBorder;   // 与面板、视口边框同色，整页仍是同一套外框
  tutorialPanelDom.style.color = COLOR.tipDesc;
  tutorialPanelDom.style.fontSize = CONFIG.settingsPanelFontSize + "px";
  // 内容区的取色不走 CSS：色值统一从 COLOR 取，同一个蓝不在样式表和脚本里各写一份，免得日后改一处漏一处
  // 底色特意取「未选中」那一档的蓝（slotFill，比窗口底板深一级）：本项目里白色代表选中，
  // 铺白底会把整块内容区误读成选中态；压暗一级反而正好读成凹进去的一块阅读区
  tutorialDocDom.style.background = COLOR.slotFill;
  tutorialDocDom.style.color = COLOR.tipDesc;  // 说明文字色，压在深一级的蓝上仍读得清
  // 把教程正文自己的那套排版样式也装上：导语、过渡句、编号步骤、关键词药丸、结尾各有一档
  initTutorialDocStyle();
  // 把教程正文填进内容区：正文现在是有层级的 HTML，所以走 innerHTML；内容是本文件里的常量，不含任何外部输入
  // 只在这里赋值一次，之后开关窗口都沿用这份内容，不必每次重开都重写
  tutorialDocDom.innerHTML = TUTORIAL_TEXT;

  btnTutorialCancelDom.addEventListener("click", function () {
    tutorialOpen = false;  // 关掉教程窗口；内容不清空，下次再打开还是原来那份教程

  // 叉是画在按钮里的 SVG，但它的指针事件已经在样式里关掉了，所以这里拿到的 target 一定是按钮本身
  tutorialPanelDom.addEventListener("mousedown", function (e) {
    if (e.target.classList.contains("btn")) e.preventDefault();
  });

// 注入教程正文的排版样式：字号一律用 em，跟着弹窗字号一起缩放；颜色全部从 COLOR 取，避免同一个蓝在样式表里再写一份
// 序号圆标用深蓝底配浅蓝字（tipName / tipFill），关键词药丸反过来（tipFill / tipName）：
// 本项目里白色代表选中，这两处都不碰白色，读到什么颜色都不会被误认成选中态

    '.popup.modal .doc .tut-lead { margin: 0 0 6px; font-size: 1.05em; font-weight: 600; color: ' + COLOR.tipName + '; }' +

// 把当前文件名写进弹窗：还没存过时用占位名，后缀始终带着，让人知道存出来会叫什么
function refreshFileName() {
  fileNameDom.textContent = currentFileName || ("未命名" + SAVE_EXT);
}

// 打开（或首次建立）句柄库；不支持 IndexedDB 时静默返回 null，记忆功能降级为「不记忆」，不影响正常存取
function openHandleDB() {
  return new Promise(function (resolve) {
    let req;
    try { req = indexedDB.open(FS_DB_NAME, 1); } catch (err) { resolve(null); return; }
    req.onupgradeneeded = function () { req.result.createObjectStore(FS_STORE_NAME); };
    req.onsuccess = function () { resolve(req.result); };
    req.onerror = function () { resolve(null); };
  });
}

// 把这次用过的文件句柄记下来：同时更新内存，本次会话马上生效；再写进库，跨会话也能读回
// 句柄是可序列化的，能直接存进 IndexedDB；写库失败只影响下次的起始目录，不影响本次存取，所以静默吞掉
function rememberPickerHandle(handle) {
  lastPickerHandle = handle;
  openHandleDB().then(function (db) {
    if (db === null) return;
    db.transaction(FS_STORE_NAME, "readwrite").objectStore(FS_STORE_NAME).put(handle, FS_HANDLE_KEY);
  }).catch(function () {});
}

// 启动时把上次的句柄读回内存：之后选择器要用时直接读内存，不必在点击那一刻再去等异步，用户手势不会被打断
function loadPickerHandle() {
  openHandleDB().then(function (db) {
    if (db === null) return null;
    return new Promise(function (resolve) {
      const req = db.transaction(FS_STORE_NAME, "readonly").objectStore(FS_STORE_NAME).get(FS_HANDLE_KEY);
      req.onsuccess = function () { resolve(req.result || null); };
      req.onerror = function () { resolve(null); };
    });
  }).then(function (h) { lastPickerHandle = h || null; }).catch(function () {});
}

// 选择器选项里的起始目录：有记住的句柄就带上，框会从那个文件所在的目录打开；没有就不带，交给浏览器默认
// startIn 接受文件句柄，落在它所在的那个目录，所以不必额外去取父目录句柄
function startInOption() {
  return lastPickerHandle === null ? {} : { startIn: lastPickerHandle };
}

// 打开：选一个存档读进画面
// 顺序是「先全部读完并校验通过，再动画面」：任何一步失败都原样返回，正在编的电路不会被毁掉
async function onOpenFile() {
  if (!canUseLocalFile) { console.log("[文件] 当前浏览器不支持直接读文件"); return; }
  let handle;
  try {
    const handles = await window.showOpenFilePicker(Object.assign({ multiple: false, types: SAVE_FILE_TYPES }, startInOption()));
    handle = handles[0];   // 只允许选一个，返回的数组里必定有且只有一项
  } catch (err) {
    // 取消同样不是错误，静默收场
    if (err.name !== "AbortError") console.log("[文件] 打开框出错：", err);
    return;
  }
  rememberPickerHandle(handle);  // 记住这次所在的目录，下次打开框直接从这儿起步
  let text;
  try {
    const file = await handle.getFile();
    text = await file.text();
  } catch (err) {
    console.log("[文件] 读取失败：", err);
    return;
  }
  let raw;
  try {
    raw = JSON.parse(text);
  } catch (err) {
    console.log("[文件] 不是本程序的存档：内容不是合法的 JSON");
    return;
  }
  const parsed = parseScene(raw);
  if (!parsed.ok) { console.log("[文件] " + parsed.reason); return; }   // 整份不可用就整个放弃，画面保持原样
  applyScene(parsed);
  // 确认用上了才改绑定：读失败时「当前文件」仍指向原来那个，不会显示成刚选的坏文件
  currentFileHandle = handle;
  currentFileName = handle.name;
  refreshFileName();
  console.log("[文件] 已打开 " + currentFileName +
    (parsed.skipped.length ? "，跳过 " + parsed.skipped.length + " 条坏数据" : ""));
}

// 另存为：弹保存框挑一个新文件，把当前电路写进去，并把它记为当前文件
async function onSaveFileAs() {
  if (!canUseLocalFile) { console.log("[文件] 当前浏览器不支持直接写文件"); return; }
  let handle;
  try {
    handle = await window.showSaveFilePicker(Object.assign({
      suggestedName: currentFileName || ("未命名" + SAVE_EXT),
      types: SAVE_FILE_TYPES
    }, startInOption()));
  } catch (err) {
    // 用户按取消不是错误，静默收场；其它错误才报出来，免得一次取消就弹一堆提示
    if (err.name !== "AbortError") console.log("[文件] 保存框出错：", err);
    return;
  }
  rememberPickerHandle(handle);  // 记住这次所在的目录，下次保存框直接从这儿起步
  // 名字和句柄一起记：两者说的都是「现在绑在哪个文件上」，要改就一起改，不能只改一个
  currentFileHandle = handle;
  currentFileName = handle.name;
  refreshFileName();
  if (await writeCurrentFile()) console.log("[文件] 已另存为 " + currentFileName);
}

// 保存：写回当前文件；还没绑定过文件就退化成另存为，让「保存」永远有结果，不必先去点另存为
async function onSaveFile() {
  if (currentFileHandle === null) { await onSaveFileAs(); return; }
  if (await writeCurrentFile()) console.log("[文件] 已保存到 " + currentFileName);
}

// 把当前电路写进当前文件，成功返回 true
// 写入期间改的是临时文件，关流那一下才真正替换原文件，所以中途出错不会把旧存档毁掉
async function writeCurrentFile() {
  try {
    const stream = await currentFileHandle.createWritable();
    await stream.write(JSON.stringify(serializeScene(), null, 2));  // 缩进两格：存档是给人看的，手工改也方便
    await stream.close();
    return true;
  } catch (err) {
    console.log("[文件] 写入失败：", err);
    return false;
  }
}

// 视野中心所在的格心：整批元件没有别的落点参考时，用它当目标
function viewCenterCell() {
  const vp = getViewport();
  return {
    cx: cellCenterX(screenToWorldX(vp.x + vp.w / 2)),
    cy: cellCenterY(screenToWorldY(vp.y + vp.h / 2))
  };
}

// 把一批「已校验的元件记录」作为悬空选区加进画面：整批保持相对位置，包围盒中心吸附到指定格心
// 偏移取两个格心之差，必是整数格，所以元件之间的相对位置一格不差地保留下来
// 「以选区导入」与「粘贴」共用它，两者的差别只在目标格心怎么定，落位、选中、置顶这些收尾完全一致
// 返回实际加进画面的元件个数
function addRecordsAsSelection(records, targetCX, targetCY) {
  let minWx = Infinity, maxWx = -Infinity, minWy = Infinity, maxWy = -Infinity;
  for (let i = 0; i < records.length; i++) {
    const e = records[i];
    if (e.wx < minWx) minWx = e.wx;
    if (e.wx > maxWx) maxWx = e.wx;
    if (e.wy < minWy) minWy = e.wy;
    if (e.wy > maxWy) maxWy = e.wy;
  }
  const offX = targetCX - cellCenterX((minWx + maxWx) / 2);
  const offY = targetCY - cellCenterY((minWy + maxWy) / 2);

  // 逐个放进画面，先不管选中状态；光源开关按记录还原
  const added = [];
  for (let i = 0; i < records.length; i++) {
    const e = records[i];
    const el = placeElement(e.wx + offX, e.wy + offY, e.dir, e.typeId);
    el.on = e.on;
    added.push(el);
  }
  // 走选区总入口：这一批成为新的选中集合，原来那批选中在这里落地（落点上的普通元件照旧被顶掉）
  // 复用总入口而不是自己挨个置选中，是为了让落位、置顶、朝向归零这些收尾行为和手动框选完全一致
  applySelection(function (e) { return added.indexOf(e) >= 0; }, false);
  // 切到选中工具：只有在这个工具下，画布上的拖动才是「整批搬走」
  setSelectedSlot(SELECT_SLOT_INDEX);
  return added.length;
}

// 以选区导入：选一个存档，把里面的元件作为一批悬空选区加进当前画面
// 与「打开」的区别：不替换当前画面，也不改「当前文件」的绑定，只是往现有电路上再添一批元件
// 落点规则：整批保持相对位置不变，把这一批的包围盒中心挪到当前视野中央
async function onImportSelection() {
  if (!canUseLocalFile) { console.log("[文件] 当前浏览器不支持直接读文件"); return; }
  let handle;
  try {
    const handles = await window.showOpenFilePicker(Object.assign({ multiple: false, types: SAVE_FILE_TYPES }, startInOption()));
    handle = handles[0];   // 只允许选一个，返回的数组里必定有且只有一项
  } catch (err) {
    // 取消同样不是错误，静默收场
    if (err.name !== "AbortError") console.log("[文件] 导入框出错：", err);
    return;
  }
  rememberPickerHandle(handle);  // 记住这次所在的目录，下次导入框直接从这儿起步
  let text;
  try {
    const file = await handle.getFile();
    text = await file.text();
  } catch (err) {
    console.log("[文件] 读取失败：", err);
    return;
  }
  let raw;
  try {
    raw = JSON.parse(text);
  } catch (err) {
    console.log("[文件] 不是本程序的存档：内容不是合法的 JSON");
    return;
  }
  const parsed = parseScene(raw);
  if (!parsed.ok) { console.log("[文件] " + parsed.reason); return; }   // 整份不可用就整个放弃
  if (parsed.elements.length === 0) { console.log("[文件] " + handle.name + " 里没有可导入的元件"); return; }

  const target = viewCenterCell();
  const n = addRecordsAsSelection(parsed.elements, target.cx, target.cy);
  console.log("[文件] 已从 " + handle.name + " 导入 " + n + " 个元件作为选区" +
    (parsed.skipped.length ? "，跳过 " + parsed.skipped.length + " 条坏数据" : ""));
}

// 以选区导出：把当前选区单独存成一个存档文件，结构与整份存档一致，只是不含视野
// 与「另存为」的区别：导出的是一份新文件，不替换画面、也不改「当前文件」的绑定，当前编辑的还是原来那个
async function onExportSelection() {
  const payload = serializeSelection();
  if (payload.elements.length === 0) { console.log("[文件] 没有选区，没东西可导出"); return; }
  if (!canUseLocalFile) { console.log("[文件] 当前浏览器不支持直接写文件"); return; }
  let handle;
  try {
    // 默认名字跟着当前存档走，加个「-选区」后缀，连续导几个不同选区时不会互相覆盖
    const base = currentFileName ? currentFileName.replace(/\.lccas$/i, "") : "未命名";
    handle = await window.showSaveFilePicker(Object.assign({
      suggestedName: base + "-选区" + SAVE_EXT,
      types: SAVE_FILE_TYPES
    }, startInOption()));
  } catch (err) {
    // 用户按取消不是错误，静默收场；其它错误才报出来，免得一次取消就弹一堆提示
    if (err.name !== "AbortError") console.log("[文件] 保存框出错：", err);
    return;
  }
  rememberPickerHandle(handle);  // 记住这次所在的目录，下次导出框直接从这儿起步
  try {
    const stream = await handle.createWritable();
    await stream.write(JSON.stringify(payload, null, 2));  // 与整份存档同样缩进两格，导出的文件也是给人看的
    await stream.close();
    console.log("[文件] 已把 " + payload.elements.length + " 个元件导出到 " + handle.name);
  } catch (err) {
    console.log("[文件] 写入失败：", err);
  }
}

/* ========== 剪贴板（复制选区 / 粘贴） ========== */

// 序列化当前选区，作为剪贴板里的内容：结构与存档一致，只是不带视野——粘贴时落在哪由那时的指针决定
// 与存档的差别只有一条：存档不收悬空的元件，而剪贴板要的恰恰就是这批悬空的元件
function serializeSelection() {
  const list = [];
  for (let i = 0; i < elements.length; i++) {
    const el = elements[i];
    if (!el.selected || el.deleting) continue;
    list.push(elementToRecord(el));
  }
  return { format: "laser-gate", version: 1, elements: list };
}

// 复制选区到系统剪贴板：内容是一段纯文本 JSON，与存档同格式，所以粘进文本编辑器也能直接读
// 写剪贴板要用系统的接口，用户按下的那一下就是「用户手势」，浏览器不会拦
async function copySelection() {
  const payload = serializeSelection();
  if (payload.elements.length === 0) { console.log("[剪贴板] 没有选区，没东西可复制"); return; }
  if (!canUseClipboard) { console.log("[剪贴板] 当前环境不支持写剪贴板"); return; }
  try {
    await navigator.clipboard.writeText(JSON.stringify(payload, null, 2));
    console.log("[剪贴板] 已复制 " + payload.elements.length + " 个元件");
  } catch (err) {
    console.log("[剪贴板] 写入失败：", err);
  }
}

// 粘贴：把剪贴板里的文本解析成元件记录，作为一批悬空选区加进画面
// 必须走系统的粘贴事件，而不是去调「读剪贴板」的接口：那个接口要授权，在本地文件下不可靠；
// 粘贴事件是浏览器主动把内容递过来，不需要任何授权
// 剪贴板里不是本程序的内容就静默忽略，不去动画面
function onPaste(e) {
  const text = e.clipboardData ? e.clipboardData.getData("text/plain") : "";
  if (!text) return;   // 剪贴板里没有文本：不认领，交给浏览器按默认处理
  let raw;
  try {
    raw = JSON.parse(text);
  } catch (err) {
    console.log("[剪贴板] 剪贴板里的内容不是本程序的元件，已忽略");
    return;
  }
  const parsed = parseScene(raw);
  if (!parsed.ok) { console.log("[剪贴板] " + parsed.reason + "，已忽略"); return; }
  if (parsed.elements.length === 0) { console.log("[剪贴板] 剪贴板里没有可粘贴的元件"); return; }
  e.preventDefault();   // 确认要用了才拦默认行为，用不上时留给浏览器自己处理
  // 落点：指针在画布内就以指针所在格为中心，指针不在就退回视野中心
  const target = pointerInside
    ? { cx: cellCenterX(screenToWorldX(pointerSX)), cy: cellCenterY(screenToWorldY(pointerSY)) }
    : viewCenterCell();
  const n = addRecordsAsSelection(parsed.elements, target.cx, target.cy);
  console.log("[剪贴板] 已粘贴 " + n + " 个元件" +
    (parsed.skipped.length ? "，跳过 " + parsed.skipped.length + " 条坏数据" : ""));
}

// 滑块刻度 → 微帧时长（秒）：最左端单独表示「零延迟」，往右走指数曲线
// 用指数而不是线性，是因为人对速度的感知本来就是倍率关系，线性映射会让慢速段挤成一团
function speedSliderToDt(v) {
  const t = v / CONFIG.speedSliderSteps;  // 归一化到 0~1
  if (t <= 0) return 0;                   // 最左端：不设延迟
  const k = CONFIG.speedDtMax / CONFIG.speedDtMin;
  return CONFIG.speedDtMin * Math.pow(k, t);
}

// 微帧时长 → 滑块刻度：上面那条映射的反函数，用于把默认速度换算成滑块的初始位置
function dtToSpeedSlider(dt) {
  if (dt <= CONFIG.speedDtMin) return 0;
  const k = CONFIG.speedDtMax / CONFIG.speedDtMin;
  return Math.round(CONFIG.speedSliderSteps * Math.log(dt / CONFIG.speedDtMin) / Math.log(k));
}

// 拖动「运行速度」滑块：把刻度换算成微帧时长，并清掉累加余数
// 余数是按旧时长攒下的，换了时长还留着就会多算或少算一个微帧，清零最干净
function onSpeedSliderInput() {
  microDt = speedSliderToDt(Number(speedSliderDom.value));
  microAcc = 0;
  updateSpeedValueLabel();
  sceneDirty = true;
}

// 更新速度数值显示：零延迟单独写「极速」，其余一律用秒、固定两位小数，单位统一才好横向比较
function updateSpeedValueLabel() {
  speedValueDom.textContent = microDt <= 0 ? "极速" : microDt.toFixed(2) + "s";
}

// 翻转一个开关的外观，返回翻转后的状态：两个开关共用，开与关的样子只维护这一份
function flipSwitch(el) {
  const on = !el.classList.contains("on");
  el.classList.toggle("on", on);
  return on;
}

// 切换「渲染网格」：改状态、换开关外观、作废网格缓存并要求重绘
// 缓存位图里存的是上一版的画面，不作废就会把带网格线的旧图继续贴出来，开关看着像失灵
function toggleGridRender() {
  gridRenderOn = flipSwitch(gridSwitchDom);
  gridCacheKey = "";   // 指纹清空，下一帧必定按新状态重建位图
  sceneDirty = true;
}

// 切换「高级渲染」：只改状态与开关外观；激光不在任何缓存里，标记重绘就能立刻看到变化
function toggleAdvancedRender() {
  advancedRenderOn = flipSwitch(advSwitchDom);
  sceneDirty = true;
}

// 每帧同步一个弹窗：位置跟着视口走，显隐与透明度直接取它锚定按钮的提亮进度
// 共用同一个进度标量，弹窗与按钮必然同步亮起、同步熄灭，不需要第二套动画状态
function renderPopup(dom, anim, anchorRect, vp) {
  const p = anim.cur;  // 0 全隐、1 全显，与按钮提亮同源
  if (p <= 0.001) {
    dom.style.display = "none";  // 收干净直接隐藏，不留下一个透明的空壳压住网格
    return;
  }
  if (dom.style.display === "none") dom.style.display = "block";
  const pos = popupPanelRect(vp, anchorRect);
  dom.style.left = pos.x + "px";
  dom.style.top = pos.y + "px";
  dom.style.width = pos.w + "px";
  dom.style.opacity = p;
}

// 每帧同步两个弹窗：各自锚定自己的按钮，互不影响；同时只开一个，所以不会出现两块底板叠在一起
function renderPanels(vp) {
  renderPopup(settingsPanelDom, settingsLitAnim, settingsSlotRect(vp), vp);
  renderPopup(filePanelDom, fileLitAnim, fileSlotRect(vp), vp);
}

// 每帧同步教程弹窗：位置由 CSS 居中，这里只管进度驱动的显隐与透明度
// 收干净就 display:none，不留一个透明的空壳压住网格，也顺带把它的指针拦截一起解掉
function renderTutorialPanel() {
  const p = tutorialModalAnim.cur;  // 0 全隐、1 全显，与教程按钮的提亮同源
  if (p <= 0.001) {
    tutorialPanelDom.style.display = "none";
    return;
  }
  // 显示时用 flex 而不是 block：窗口内部要靠弹性布局把内容区撑满取消按钮之外的高度
  // 这里比对的是 "flex" 而不是 "none"：内联样式没写过时读回来是空串，只认 "none" 会在首帧漏掉一次
  if (tutorialPanelDom.style.display !== "flex") tutorialPanelDom.style.display = "flex";
  tutorialPanelDom.style.opacity = p;
}

/* ========== 面板选项槽的交互 ========== */

// 屏幕位置落在哪个槽上：返回槽序号，没命中返回 -1
// 选中槽与元件槽都算命中，空槽不响应；两者共用同一套悬停与按下反馈，手感一致
// 设置按钮也算一个槽，序号排在所有元件槽之后，所以它天然共用同一套悬停与按下逻辑，手感不会走样
// 悬停与点击共用它，两处判定不会算歪
function slotIndexAt(sx, sy) {
  const vp = getViewport();
  // 从选中槽一直扫到最后一个元件槽，中间不留空：这两类槽在面板上是连着的
  for (let i = SELECT_SLOT_INDEX; i < ELEMENT_SLOT_BASE + PANEL_SLOT_TYPES.length; i++) {
    const r = panelSlotRect(i, vp);
    if (sx >= r.x && sx <= r.x + r.w && sy >= r.y && sy <= r.y + r.h) return i;
  }
  const sr = settingsSlotRect(vp);
  if (sx >= sr.x && sx <= sr.x + sr.w && sy >= sr.y && sy <= sr.y + sr.h) return SETTINGS_SLOT_INDEX;
  const fr = fileSlotRect(vp);
  if (sx >= fr.x && sx <= fr.x + fr.w && sy >= fr.y && sy <= fr.y + fr.h) return FILE_SLOT_INDEX;
  const tr = tutorialSlotRect(vp);
  if (sx >= tr.x && sx <= tr.x + tr.w && sy >= tr.y && sy <= tr.y + tr.h) return TUTORIAL_SLOT_INDEX;
  return -1;
}

// 按指针屏幕位置更新悬停槽
function updateSlotHoverAt(sx, sy) {
  const hit = slotIndexAt(sx, sy);
  // 换了槽就重新计时：简介的延迟按「停在同一个槽上」的时长算，扫过一排槽不会触发
  if (hit !== slotHoverIndex) slotHoverTime = 0;
  slotHoverIndex = hit;
  // 按住后把指针拖离该槽就退出按下态，和普通按钮一致，避免两个槽同时停在缩小状态
  if (slotPressedIndex >= 0 && slotPressedIndex !== slotHoverIndex) slotPressedIndex = -1;
}

// 每帧推进简介浮层：先累计当前槽的停留时长，够久才把浮层切到这个槽并淡入，否则淡出
function updateSlotTip(dt) {
  // 简介只对元件槽有效：两个按钮也在槽序号里，但它们没有元件简介，得排除掉
  const onElementSlot = isElementSlot(slotHoverIndex);
  if (onElementSlot) {
    slotHoverTime += dt;
  } else {
    slotHoverTime = 0;
  }
  const wantShow = onElementSlot && slotHoverTime >= CONFIG.panelTipDelay;
  // 先把要显示的槽记下来，再推进动画：移开鼠标后浮层仍按 tipIndex 把淡出播完
  if (wantShow) tipIndex = slotHoverIndex;
  stepEased(tipAnim, wantShow ? 1 : 0, dt, CONFIG.panelTipAnimDuration, easeInOutCubic);
  // 淡出收干净后清掉记录的槽，下次淡入不会先闪一下旧内容
  if (tipAnim.cur <= 0.001 && !wantShow) tipIndex = -1;
}

// 推进每个槽的缩放缓动：目标每帧由「是否被悬停 / 是否被按下」现算，两种状态的任意组合都自动成立
// 这样就不必在状态切换时手动起停动画，也不会漏掉「按下时移出」这类组合
// 亮度不参与这里的动画：按下只改变缩放，变亮与否完全由「是否选中」决定，所以按下不会闪
function updateSlotAnim(dt) {
  // 设置按钮就在这个数组里，跟着一起走，所以它的悬停与按下反馈与元件槽逐帧同源，不会有半点差别
  for (let i = 0; i < slotAnim.length; i++) {
    // 按下的槽缩得比悬停更深
    const targetScale = (i === slotPressedIndex) ? CONFIG.panelSlotPressedScale
      : (i === slotHoverIndex ? CONFIG.panelSlotHoverScale : 1);
    stepEased(slotAnim[i], targetScale, dt, CONFIG.panelSlotAnimDuration);
  }
  // 提亮不参与缩放那套：它是「弹窗开着」的状态显示，不是按下反馈，所以不看悬停与按下
  stepEased(settingsLitAnim, settingsOpen ? 1 : 0, dt, CONFIG.settingsLitDuration);
  stepEased(fileLitAnim, filePanelOpen ? 1 : 0, dt, CONFIG.settingsLitDuration);  // 文件按钮走同一套时长，两个按钮亮灭的节奏才不会一个快一个慢
  stepEased(tutorialLitAnim, tutorialOpen ? 1 : 0, dt, CONFIG.settingsLitDuration);  // 教程按钮也走同一套时长，三个按钮亮灭的节奏一致
  // 教程弹窗的淡入淡出与上面这支提亮同源同时长：按钮亮起来的同时窗口淡出来，不会一个先一个后
  stepEased(tutorialModalAnim, tutorialOpen ? 1 : 0, dt, CONFIG.settingsLitDuration);
}

// 按当前槽数量重建槽动画状态：全部停在原尺寸、未悬停、未按下；重开或改槽数量后都要走一遍
function resetSlots() {
  slotAnim.length = 0;
  // 多建三个给教程、文件和设置按钮：它们占最后三个下标，所以数组比元件槽多三个
  for (let i = 0; i <= TUTORIAL_SLOT_INDEX; i++) {
    slotAnim.push(newEased(1));
  }
  slotHoverIndex = -1;
  slotPressedIndex = -1;
  slotSelectedIndex = ELEMENT_SLOT_BASE + 1;  // 默认选中透射器那个槽，与初始虚影形状保持一致
  // 提亮不在这里复位：它跟随的是设置开没开，属于界面状态而不是这一局的状态
  // 简介浮层一并复位：停留计时归零、浮层收起、动画标量直接停在 0，避免重开时残留上一局的浮层
  slotHoverTime = 0;
  tipIndex = -1;
  tipAnim.cur = 0;
  tipAnim.from = 0;
  tipAnim.to = 0;
  tipAnim.t = 1;
}

/* ========== 元件（SVG 层） ========== */

// 同步元件层的尺寸与裁剪矩形，让元件和网格一样只出现在视口内
function resizeElementLayer() {
  const vp = getViewport();
  elemLayer.setAttribute("width", state.cssW);
  elemLayer.setAttribute("height", state.cssH);
  elemLayer.style.width = state.cssW + "px";
  elemLayer.style.height = state.cssH + "px";
  clipRect.setAttribute("x", vp.x);
  clipRect.setAttribute("y", vp.y);
  clipRect.setAttribute("width", vp.w);
  clipRect.setAttribute("height", vp.h);
}

// 建一个元件节点：路径取指定类型（由类型表生成），摆放靠每帧写 transform，所以节点本身不带位置
// opacity 用于虚影，取 1 就是实体元件
function createElementNode(typeId, opacity) {
  const node = document.createElementNS(SVG_NS, "path");
  node.setAttribute("d", elementPathD(typeId));
  node.setAttribute("fill", hslCss(elementHSL.fill));
  node.setAttribute("stroke", hslCss(elementHSL.stroke));
  // 描边宽度用世界单位，随缩放一起放大，元件轮廓才始终跟着元件走
  node.setAttribute("stroke-width", CONFIG.elementStroke);
  // 圆角靠描边的圆角连接实现：拐角外侧按描边宽度的一半倒圆，不用改路径数据
  node.setAttribute("stroke-linejoin", "round");
  // 先描边后填充：描边内侧那半被填充盖住，只留外面一圈，外框和填充不再重叠
  node.setAttribute("paint-order", "stroke");
  // 用整节点透明度而不是 fill-opacity：后者会让填充透光、盖不住描边内侧，虚影的圈会粗一倍
  node.setAttribute("opacity", opacity);
  return node;
}

// 查找占据指定格心的元件；格心坐标是 floor 结果加 0.5，都是精确可表示的半整数，可以直接比较
// 同一格出现多个元件只是操作途中的临时状态（把选中的元件挪到了别人身上），
// 而「一格最多一个元件」是模型硬约束，所以这里必须给出唯一答案，交给下面的层级判定
function findElementAt(wx, wy) {
  return topElementAtCell(wx, wy);
}

// 某一格最上层的元件：正在手上（选中）的压在其他元件之上，正在消失的排在最下
// 这个顺序和绘制顺序完全一致（选中的会被挪到元件层末尾），所以「看到谁在最上面就命中谁」，
// 命中结果不会和画面矛盾；同层取数组里靠后的，也和绘制顺序对齐
function topElementAtCell(wx, wy) {
  let best = null;
  let bestRank = -1;
  for (let i = 0; i < elements.length; i++) {
    const el = elements[i];
    if (el.wx !== wx || el.wy !== wy) continue;
    // 正在消失的排 0，普通元件排 1，选中元件排 2；这样正在消失的元件永远不会挡住真实元件
    const rank = el.deleting ? 0 : (el.selected ? 2 : 1);
    if (rank >= bestRank) { best = el; bestRank = rank; }  // 同层取靠后的，和绘制顺序一致
  }
  return best;
}

// 在指定格心点放置一个指定类型、朝 dir 方向的元件
function placeElement(wx, wy, dir, typeId) {
  const node = createElementNode(typeId, 1);
  elemLayer.appendChild(node);
  const el = {
    id: nextElementId++,  // 内部编号：只用来在历史差分里认人，不写进存档；换文档时随新元件重新发号
    wx: wx, wy: wy, dir: dir, typeId: typeId,
    angle: dir * 90, angleTarget: dir * 90,  // 初始角度就是放置时的朝向，动画从静止开始
    node: node, deleting: false, deleteP: 0,
    on: false,  // 光源的开关状态：由外部点击切换，默认关；只有光源类型会读它
    selected: false, // 是否被选中：选中即离地，该元件退出电路模拟（不挡光也不发光），落位取消选中时才回到电路里
    litK: 0,         // number：上一次写进节点的选中进度（0 常态、1 全选中），相同就跳过重写，避免每帧改属性
    litK2: 0,        // number：上一次写进节点的亮起进度；与 litK 一起当缓存键，灯以外的元件恒为 0
    litIn: false,    // boolean：本微帧有没有被激光照到；只由结算层写，灯以外的元件不读
    litP: newEased(0), // Object：灯的亮起缓动进度标量，0 不亮、1 全亮；只有灯会推进它
    selP: newEased(0), // Object：选中缓动进度标量，0 常态、1 全选中，在固定时长内走缓出曲线
    selBase: false,  // 拉框按下那一刻的选中快照：按住 Shift 框选时以它为基准做翻转，框动来动去也不会反复横跳
    orbitU0: null,   // number | null：公转起点格号 u；null 表示这个元件没在公转
    orbitV0: null,   // number | null：公转起点格号 v
    orbitAngle0: 0,  // number：公转开始时的角度，公转期间画的角度从它往上加
    orbitShiftU: 0,  // number：落位吸附量 u：动画途中按进度补上，收尾时正好落在格心上
    orbitShiftV: 0,  // number：落位吸附量 v
    mvOffU: 0,       // number：拖动缓动的视觉偏移 u（世界单位）：拖动时先让画面留在原地，再缓出追上目标格
    mvOffV: 0,       // number：拖动缓动的视觉偏移 v
    out: 0      // 本微帧要发射的掩码：偏转器与透射器由 scheduleOutputs 按上一微帧的接收结果写入
  };
  elements.push(el);
  rayGraph.dirty = true;  // 元件增删会打乱 elements 下标，阻挡图必须重建
  sceneDirty = true;      // 新元件的节点需要摆到屏幕位置上，强制重绘一次
  return el;              // 交给调用方接着改字段（读档要还原光源开关），省得再回头查一遍
}

// 在屏幕位置处放置元件：吸附到所在格心，视口外不放置，同一格已有元件则忽略
function placeElementAtScreen(screenX, screenY) {
  if (!isInViewport(screenX, screenY)) return;
  const wx = cellCenterX(screenToWorldX(screenX));
  const wy = cellCenterY(screenToWorldY(screenY));
  // 一个格子最多一个元件，这是基本逻辑里的硬约束
  if (findElementAt(wx, wy) !== null) return;
  // 朝向取虚影当前的目标角度：目标角度永远是 90 的整数倍，取模得到 0 上 1 右 2 下 3 左
  const dir = ((Math.round(ghostAngleTarget / 90) % 4) + 4) % 4;
  // 类型取当前选中的槽：放下去的就是手上那个虚影，形状与预览完全一致
  // 手上拿的是选中工具时没有元件可放，回车直接不响应
  const typeId = selectedTypeId();
  if (typeId === null) return;
  placeElement(wx, wy, dir, typeId);
  commitHistory();  // 放置是直接改电路的动作，放下去这一刻就记一步
}

// 一个元件的屏幕变换：平移到格心屏幕位置 → 按角度旋转 → 按缩放放大
// 参数直接收角度（度），因为虚影旋转动画中途会传入非 90 整数倍的值
// scaleMul 是删除动画的收缩系数（1 = 原尺寸），必须显式传入，缺省会算出 NaN
// 等比缩放下旋转与缩放可交换，顺序不影响结果
function elementTransform(wx, wy, angleDeg, scaleMul) {
  return "translate(" + worldToScreenX(wx) + " " + worldToScreenY(wy) + ")" +
    " rotate(" + angleDeg + ")" +
    " scale(" + state.scale * scaleMul + ")";
}

// 每帧把元件摆到屏幕上；删除中的元件同时被收缩和淡出
function renderElements() {
  for (let i = 0; i < elements.length; i++) {
    const el = elements[i];
    // 删除动画的缓动值同时驱动缩放和透明度；没在删除时恒为 0，等于原样绘制
    const e = el.deleting ? easeOutCubic(el.deleteP) : 0;
    el.node.setAttribute("opacity", 1 - e);
    // 公转中的元件画的是弧线上的插值位置：数据要等落位才改，所以此刻画面和数据是有意分开的
    let wx = el.wx, wy = el.wy, angle = el.angle;
    if (orbitActive && el.orbitU0 !== null) {
      const t = easeOutCubic(orbitP);
      const total = orbitTurns * 90;
      const rad = total * t * Math.PI / 180;
      const c = Math.cos(rad), s = Math.sin(rad);
      const du = el.orbitU0 - orbitPivotU;
      const dv = el.orbitV0 - orbitPivotV;
      // 吸附量随进度线性补上：走到头时画面位置正好等于落位后的格心，不会在收尾时跳半格
      wx = orbitPivotU + du * c + dv * s + el.orbitShiftU * t + 0.5;
      wy = orbitPivotV - du * s + dv * c + el.orbitShiftV * t + 0.5;
      angle = el.orbitAngle0 + total * t;
    }
    // 拖动缓动的视觉偏移叠在数据位置之上：数据已经跳到目标格，画面还差一点点，缓出追上后偏移归零
    // 偏移只影响画面，不参与模拟与占位判定，所以拖动途中激光立刻按新格重算，手感是「跟手但不硬跳」
    wx += el.mvOffU;
    wy += el.mvOffV;
    // 用动画中的连续角度：旋转过程中元件是斜着的，转到位才正对格子
    el.node.setAttribute("transform", elementTransform(wx, wy, angle, 1 - e));
    // 选中走「内亮外深」：填充提亮、描边加深加粗，浅底配深边把轮廓扣出来，不额外套框
    // 灯另走一套：亮起时在 RGB 里把常态色逐通道混向淡红，等价于盖一层淡红遮罩淡入，中间不会绕色环
    // 其它元件亮起进度恒为 0，仍按原来的 HSL 路径在常态色与选中色之间过渡，行为与改动前完全一致
    // 两个进度任一变过就重写一次属性，避免每帧无谓重排
    const kSel = el.selP.cur;
    const kLit = el.litP.cur;
    if (el.litK !== kSel || el.litK2 !== kLit) {
      el.litK = kSel;
      el.litK2 = kLit;
      if (el.typeId === "lamp") {
        // 先按亮起进度混向淡红，再按选中进度混向选中色；两级都逐通道做，蓝到红之间只有一段偏灰的紫
        const fill = mixRgb(mixRgb(RGB.elementFill, RGB.lampFill, kLit), RGB.selectFill, kSel);
        const stroke = mixRgb(mixRgb(RGB.elementStroke, RGB.lampStroke, kLit), RGB.selectStroke, kSel);
        el.node.setAttribute("fill", rgbCss(fill));
        el.node.setAttribute("stroke", rgbCss(stroke));
      } else {
        const fill = mixHslTriple(elementHSL.fill, selectLitHSL.fill, kSel);
        const stroke = mixHslTriple(elementHSL.stroke, selectLitHSL.stroke, kSel);
        el.node.setAttribute("fill", hslCss(fill));
        el.node.setAttribute("stroke", hslCss(stroke));
      }
      // 描边宽度跟着选中进度一起从常态加粗到选中值，取消选中时原样退回
      el.node.setAttribute("stroke-width", CONFIG.elementStroke + (CONFIG.elementStrokeSelected - CONFIG.elementStroke) * kSel);
    }
  }
}

// 找出指针当前所指格子里的元件：视口外或格内没有元件都返回 null
function findElementAtPointer() {
  if (!isInViewport(pointerSX, pointerSY)) return null;
  return findElementAt(cellCenterX(screenToWorldX(pointerSX)), cellCenterY(screenToWorldY(pointerSY)));
}

// 切换指针所在格光源的开关：只在指针下是存活的光源时生效，空格、其他类型、删除动画中的都忽略
// 开关一变，发射掩码随之改变，结算层下一微帧就会重算激光场
function toggleLightAtPointer() {
  const el = findElementAtPointer();
  if (el === null || el.deleting || el.typeId !== "light") return;
  el.on = !el.on;
  commitHistory();  // 开关本身也是电路状态的一部分，跟着一起可撤销
}

// 删除屏幕位置所在格的元件：视口外、格内没有元件、或该元件已在删除动画中，都直接忽略
function deleteElementAtScreen(screenX, screenY) {
  if (!isInViewport(screenX, screenY)) return;
  const el = findElementAt(cellCenterX(screenToWorldX(screenX)), cellCenterY(screenToWorldY(screenY)));
  if (el === null || el.deleting) return;
  el.deleting = true;
  el.deleteP = 0;
  rayGraph.dirty = true;  // 删除动画一开始就把它从模拟里摘掉，不等动画放完
  commitHistory();  // 标记成「正在消失」这一刻它就已经不算电路里的人了，所以在这里记步
}

// 删除整个选区：选中的元件一起进入消失动画，压在下面的其他元件不受影响
// 顺序有讲究：先把它们逐个标成「正在删除」，再走选区总入口清空选中
// 删除中的元件不会被算作「离开选区」，所以不会像正常落位那样把落点上的其他元件一并顶掉
// 返回 true 表示这次按键已由选区接手，调用方不必再去删指针所在格
function deleteSelection() {
  let any = false;
  for (let i = 0; i < elements.length; i++) {
    const el = elements[i];
    if (!el.selected || el.deleting) continue;
    el.deleting = true;
    el.deleteP = 0;
    any = true;
  }
  if (!any) return false;
  applySelection(function () { return false; }, false);
  return true;
}

// 每帧推进所有删除中的元件动画；动画走完才真正移除节点和数据
function updateDeletions(dt) {
  // 倒序遍历：移除元素用的是 splice，倒着走不会漏掉还没处理的项
  for (let i = elements.length - 1; i >= 0; i--) {
    const el = elements[i];
    if (!el.deleting) continue;
    el.deleteP = Math.min(1, el.deleteP + dt / CONFIG.elementDeleteDuration);
    if (el.deleteP >= 1) {
