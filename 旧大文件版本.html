      // 动画期间这一格仍算被占用，虚影不会提前淡入；走完才腾出格子
      elemLayer.removeChild(el.node);
      elements.splice(i, 1);
      rayGraph.dirty = true;  // splice 让后面所有下标前移，阻挡图里存的下标随之失效
    }
  }
}

/* ========== 撤销 / 重做 ========== */

// 两条记录是否描述同一个元件的同一状态：类型、格号、朝向、开关全一样才算没变
function recordEquals(a, b) {
  return a.type === b.type && a.gx === b.gx && a.gy === b.gy && a.dir === b.dir && a.on === b.on;
}

// 把元件按记录摆回原样：位置、朝向、开关，以及各种动画与拖动的残留一并归零
// 撤销与重做都走它，两个方向写的是同一套字段，不会出现「撤销干净、重做留尾巴」
function writeRecord(el, rec) {
  el.wx = rec.gx + 0.5;   // 元件恒在格心，格号加半格就是世界坐标
  el.wy = rec.gy + 0.5;
  el.dir = rec.dir;
  el.angle = rec.dir * 90;
  el.angleTarget = el.angle;
  el.on = rec.on;
  el.mvOffU = 0;      // 拖动缓动的视觉偏移归零，画面与数据立刻对齐
  el.mvOffV = 0;
  el.orbitU0 = null;  // 公转起点作废，避免残留的起点被下一段公转当成自己人
  el.orbitV0 = null;
  el.deleting = false;
  el.deleteP = 0;
}

// 把元件挂回画面：数据回到列表、节点回到元件层；已经在列表里的只补状态，不重复插入
// 撤销回来的元件一律是落定状态，不会带着悬空身份复活，也不会留着上一次的选中配色
function attachElement(el) {
  if (elements.indexOf(el) < 0) elements.push(el);
  if (el.node.parentNode !== elemLayer) elemLayer.appendChild(el.node);
  el.selected = false;
  el.deleting = false;  // 撤销删除时元件可能还在播消失动画，不清掉的话动画会接着放完、把它真的摘走
  el.deleteP = 0;
  el.selP = newEased(0);  // 选中缓动重新起算，否则会从上次留下的进度接着亮
  el.litP = newEased(0);  // 灯的亮起缓动同样重新起算，撤销回来的灯不会带着上次的亮态
  el.litIn = false;       // 照到没照到由下一微帧的结算重新判定
  el.litK = -1;           // 逼下一帧重写配色，把可能残留的选中配色刷回常态
}

// 把元件从画面摘掉：数据出列表、节点离开元件层，同时从拖动组里除名
// 摘掉只是「离开画面」，元件对象与它的节点都还被历史里的差分引用着，撤销时原样挂回去
function detachElement(el) {
  const i = elements.indexOf(el);
  if (i >= 0) elements.splice(i, 1);
  if (el.node.parentNode === elemLayer) elemLayer.removeChild(el.node);
  const g = moveGroup.indexOf(el);
  if (g >= 0) moveGroup.splice(g, 1);
  el.selected = false;
}

// 重建已落定对照表：只有不正在消失的元件才算电路里的人
// 悬空中的元件保留它进悬空前的记录：它只是暂时离地，位置还没定下来，不能拿它现在的位置当基准
// 每次记步与每次撤销/重做之后都要重建，否则下一次比对会拿旧样子当基准、算出假差异
function rebuildCommittedTable() {
  const next = new Map();
  for (let i = 0; i < elements.length; i++) {
    const el = elements[i];
    if (el.deleting) continue;
    if (el.selected) {
      const prev = committedTable.get(el.id);
      if (prev !== undefined) next.set(el.id, prev);  // 悬空期间新来的（粘贴、导入）本来就不在表里，不建条目
      continue;
    }
    next.set(el.id, { rec: elementToRecord(el), el: el });
  }
  committedTable = next;
}

// 记一步：把这一刻的已落定电路与上一次落定时逐条比，差异就是这一步
// 新出现的记「挂上来」、消失的记「摘下去」、字段变了的记「从什么样变成什么样」
// 悬空与正在消失要分开看：正在消失才算离开电路，悬空只是暂时离地，既不算离开也不算新来
function commitHistory() {
  const ops = [];
  const seen = new Set();
  for (let i = 0; i < elements.length; i++) {
    const el = elements[i];
    if (el.deleting) continue;  // 正在消失的元件已经不算电路里的人，会被下面那条「摘下去」认领
    seen.add(el.id);
    if (el.selected) continue;  // 悬空中的这一轮不比对：位置还没定下来，落地那一刻才比
    const rec = elementToRecord(el);
    const prev = committedTable.get(el.id);
    if (prev === undefined) ops.push({ kind: "attach", el: el, after: rec });
    else if (!recordEquals(prev.rec, rec)) ops.push({ kind: "set", el: el, before: prev.rec, after: rec });
  }
  committedTable.forEach(function (v, id) {
    // 消失的元件按它「离开那一刻」的样子记，而不是上一次落定的样子：
    // 它可能在悬空期间被搬动过，撤销删除时应该回到用户最后看到的位置
    if (!seen.has(id)) ops.push({ kind: "detach", el: v.el, before: elementToRecord(v.el) });
  });
  if (ops.length === 0) return;  // 没有真实变化就不占一步，免得空点一下也吃满一百步
  historyStack.length = historyIndex + 1;  // 在历史中间做了新动作，后面的重做分支作废
  historyStack.push(ops);
  historyIndex = historyStack.length - 1;
  if (historyStack.length > HISTORY_LIMIT) { historyStack.shift(); historyIndex--; }
  rebuildCommittedTable();
}

// 执行一组差分：reverse 为真表示撤销（每条反过来做），为假表示重做
function applyOps(ops, reverse) {
  const list = reverse ? ops.slice().reverse() : ops;
  for (let i = 0; i < list.length; i++) {
    const op = list[i];
    if (op.kind === "attach") {
      // 正着走 = 元件进入电路，倒着走 = 退出；进入时按记录摆正，位置才不会停在别处
      if (reverse) detachElement(op.el);
      else { attachElement(op.el); writeRecord(op.el, op.after); }
    } else if (op.kind === "detach") {
      if (reverse) { attachElement(op.el); writeRecord(op.el, op.before); }
      else detachElement(op.el);
    } else {
      writeRecord(op.el, reverse ? op.before : op.after);
    }
  }
  rayGraph.dirty = true;  // 元件增删或字段变了，谁挡谁与激光场都得重算
  sceneDirty = true;
}

// 撤销/重做前先把正在进行的交互收干净：拖动、拉框、公转全部中断
// 不回退它们已经造成的画面状态，因为紧接着的撤销/重做会把电路整个摆正
function settleInteractions() {
  moveDragging = false;
  movePointerId = -1;
  moveDGX = 0;
  moveDGY = 0;
  moveGroup.length = 0;
  marqueePressing = false;
  marqueeActive = false;
  marqueePointerId = -1;
  orbitActive = false;
  orbitP = 0;
  orbitTurns = 0;
  for (let i = 0; i < elements.length; i++) {
    // 公转起点与拖动偏移只存在元件身上，不逐个清掉会留下半截姿态
    elements[i].orbitU0 = null;
    elements[i].orbitV0 = null;
    elements[i].mvOffU = 0;
    elements[i].mvOffV = 0;
  }
}

// 取消当前悬空的一批：整个悬空会话本来就不在历史里，所以这里不动历史，只是把它整个抹掉
// 原本就在电路里的元件摆回它进入悬空前的样子（位置从已落定对照表里取，对照表在悬空期间一直替它留着旧记录）；
// 悬空期间新加进来的（粘贴、导入）在对照表里查无此人，说明电路里本来就没有它，直接摘掉
// 返回 true 表示手上确实有悬空、这次按键已经被它吃掉
function cancelFloat() {
  let any = false;
  // 倒序遍历：摘掉当前项会让后面所有下标前移，倒着走不会漏掉还没处理的项
  for (let i = elements.length - 1; i >= 0; i--) {
    const el = elements[i];
    if (!el.selected || el.deleting) continue;
    any = true;
    const prev = committedTable.get(el.id);
    if (prev === undefined) detachElement(el);
    else writeRecord(el, prev.rec);
  }
  if (!any) return false;
  settleInteractions();
  applySelection(function () { return false; }, false);  // 走总入口统一取消选中，落位规则与平时完全一致
  return true;
}

// 撤销：手上有悬空就先把它取消（这一步不进历史），否则往回退一步
function undo() {
  if (cancelFloat()) return;
  if (historyIndex < 0) return;
  settleInteractions();
  applyOps(historyStack[historyIndex], true);
  historyIndex--;
  rebuildCommittedTable();  // 电路已经变了，对照表必须跟着换，否则下一次记步会算出假差异
  sceneDirty = true;
}

// 重做：与撤销对称，手上有悬空同样先取消，再往前恢复一步
function redo() {
  if (cancelFloat()) return;
  if (historyIndex + 1 >= historyStack.length) return;
  settleInteractions();
  historyIndex++;
  applyOps(historyStack[historyIndex], false);
  rebuildCommittedTable();
  sceneDirty = true;
}

// 换文档（打开文件）后历史跟着清空：换文档不是编辑动作，留着上一条电路的历史只会撤出莫名其妙的画面
function resetHistory() {
  historyStack = [];
  historyIndex = -1;
  rebuildCommittedTable();
}

/* ========== 阻挡图 ========== */

// 取元件在全局某轴上的阻挡属性：元件朝左/朝右时自身转了 90°，局部水平与垂直互换
// 参数 horizontal 为 true 表示问「挡不挡全局水平激光」，false 表示问全局垂直
function blocksGlobal(el, horizontal) {
  const t = ELEMENT_TYPES[el.typeId];
  const same = horizontal ? t.blocksH : t.blocksV;
  const swapped = horizontal ? t.blocksV : t.blocksH;
  return el.dir % 2 === 0 ? same : swapped;
}

// 重建阻挡图：按 wy 分出行、按 wx 分出列，各自排序后扫一遍，给每个元件记下四方向第一个阻挡者
// 结算时只需读表，不必每微帧拿坐标比大小，所以只在元件增删或朝向改变后调用一次
function rebuildRayGraph() {
  const rows = new Map();
  const cols = new Map();
  // 正在删除的、以及悬空的元件都不参与模拟：前者算「已被删掉」，后者算「还没放进世界」
  // 悬空即被选中；选中等于离地，要等落位（取消选中）那一刻才回到电路里
  for (let i = 0; i < elements.length; i++) {
    const el = elements[i];
    if (el.deleting || el.selected) continue;
    if (!rows.has(el.wy)) rows.set(el.wy, []);
    rows.get(el.wy).push(i);
    if (!cols.has(el.wx)) cols.set(el.wx, []);
    cols.get(el.wx).push(i);
  }
  // 排序之后「第一个阻挡者」就退化成数组上的一次邻项扫描，不用再比坐标
  rows.forEach(function (arr) {
    arr.sort(function (a, b) { return elements[a].wx - elements[b].wx; });
  });
  cols.forEach(function (arr) {
    arr.sort(function (a, b) { return elements[a].wy - elements[b].wy; });
  });

  const n = elements.length;
  const endR = new Array(n).fill(-1);
  const endL = new Array(n).fill(-1);
  const endD = new Array(n).fill(-1);
  const endU = new Array(n).fill(-1);

  // 行内向右：从右往左扫，扫到 p 时手上拿的就是 p 右边最近的阻挡者位置
  // 没人挡时终点记行数组长度 k，这样 [p, endR] 正好是激光覆盖的下标闭区间，结算时不用再分支
  rows.forEach(function (arr) {
    const k = arr.length;
    let next = k;
    for (let p = k - 1; p >= 0; p--) {
      const i = arr[p];
      endR[i] = next;
      if (blocksGlobal(elements[i], true)) next = p;
    }
    // 行内向左：从左往右扫，没人挡记 -1
    let prev = -1;
    for (let p = 0; p < k; p++) {
      const i = arr[p];
      endL[i] = prev;
      if (blocksGlobal(elements[i], true)) prev = p;
    }
  });

  // 列：列数组按 wy 升序，而 wy 越大在屏幕上越靠上，所以下标增大方向是「上」
  cols.forEach(function (arr) {
    const k = arr.length;
    let next = k;
    for (let p = k - 1; p >= 0; p--) {
      const i = arr[p];
      endU[i] = next;   // 下标更大 = wy 更大 = 视觉更靠上，所以这是「向上」的阻挡者
      if (blocksGlobal(elements[i], false)) next = p;
    }
    let prev = -1;
    for (let p = 0; p < k; p++) {
      const i = arr[p];
      endD[i] = prev;   // 下标更小 = wy 更小 = 视觉更靠下
      if (blocksGlobal(elements[i], false)) prev = p;
    }
  });

  rayGraph.rows = rows;
  rayGraph.cols = cols;
  rayGraph.endR = endR;
  rayGraph.endL = endL;
  rayGraph.endD = endD;
  rayGraph.endU = endU;
  rayGraph.dirty = false;
}

/* ========== 结算 ========== */

// 单微帧结算：重建阻挡图（若脏）→ 收集发射 → 算接收掩码与激光场
// 元件规则已接入 elementEmit，后续新增元件类型只需在 elementEmit 里补一条分支
function stepMicroframe() {
  // 元件增删或朝向定下来之后才重建阻挡图；重建会让上一微帧的发射掩码作废，必须重算
  if (rayGraph.dirty) {
    rebuildRayGraph();
    lastEmit = null;
  }
  const emit = buildEmitMask();
  // 发射掩码与上一微帧完全一致时，激光场与接收掩码必然不变，跳过重算
  // 既省掉空转时的重复计算，也让下面的临时打印只在真有变化时输出
  if (!emitEquals(emit, lastEmit)) {
    recvMask = computeRecvMask(emit);
    laserSegments = computeLaserSegments(emit);
    scheduleOutputs(recvMask);  // 按本微帧的接收排下一微帧的输出，微时序的 1 帧延迟就落在这一步
    updateLampInputs(recvMask); // 顺手把接收结果落到灯身上，决定它这一微帧亮不亮
    lastEmit = emit.slice();    // 存一份副本而不是直接引用；否则 runToQuiescence 里比较前后两个状态时永远相等
    sceneDirty = true;  // 激光场变了，强制重绘一次，否则静止判定会把这次变化吞掉
  }
  microframe++;  // 时钟自增：本微帧的结算已完成，进入下一微帧
}

// 按当前微帧时长推进时钟：把本帧真实时长换算成微帧数逐个结算
// 用累加余数而不是直接取整，避免帧率与微帧时长不成整数倍时把零头丢掉、时钟越走越慢
// 单帧步数设上限，超出的积压时间直接丢弃，否则一帧要补算的量会越滚越大
function stepSimulation(dt) {
  // 速度滑块拉到最左端：不设延迟，本帧内直接把整条链结算到底，不等真实时间
  if (microDt <= 0) {
    runToQuiescence();
    return;
  }
  microAcc += dt;
  let steps = 0;
  while (microAcc >= microDt && steps < CONFIG.maxStepsPerFrame) {
    microAcc -= microDt;
    stepMicroframe();
    steps++;
  }
  if (microAcc >= microDt) microAcc = 0;
}

// 不设延迟时把整条链在一帧内跑完：反复结算，直到某一微帧的发射掩码与上一微帧完全相同
// 掩码没变说明没有任何元件再产生新输出，链已停住；上限只用来防止逻辑成环时死循环
// 元件之间那 1 微帧的延迟仍然保留，只是不再等真实时间，逻辑语义与慢速时完全一致
function runToQuiescence() {
  microAcc = 0;  // 零延迟下不攒余数，否则切回慢速时会突然补算一帧
  for (let i = 0; i < CONFIG.maxQuiescentSteps; i++) {
    const before = lastEmit;
    stepMicroframe();
    // 用值比较而不是引用比较：lastEmit 是 slice 出来的副本，引用每轮都变，不能用 === 判断
    // before 为 null 时说明还没初始化过，不能算"停了"
    if (before !== null && emitEquals(lastEmit, before)) return;
  }
}

// 收集本微帧所有元件要发射的方向，返回以 elements 下标为索引的位掩码
// 正在删除的与悬空的元件都已从模拟里摘掉，既不发射也不接收，所以直接跳过
function buildEmitMask() {
  const emit = new Array(elements.length).fill(0);
  for (let i = 0; i < elements.length; i++) {
    if (elements[i].deleting || elements[i].selected) continue;
    emit[i] = elementEmit(elements[i]);
  }
  return emit;
}

// 单个元件的输出规则：返回它本微帧要发射的方向位掩码，0 表示不发射
// 光源：开启时朝箭头方向发射；它不接收任何输入，所以只看自身开关
// 灯：只作指示，收到光也不发射，永远返回 0
// 偏转器与透射器：输出规则相同（收到有效输入就朝箭头方向发），具体值由上一微帧排好的 el.out 给出
function elementEmit(el) {
  if (el.typeId === "light") return el.on ? (1 << el.dir) : 0;
  if (el.typeId === "lamp") return 0;
  return el.out;
}

// 把本微帧的接收结果落到灯身上：只要有任何一侧的激光射到它，就算被照亮
// 灯是实体，来光到它中心即终止，所以「被照到」正好等于接收掩码非零，不需要再区分方向
// 只在掩码重算的分支里调用：掩码不变时灯的亮灭自然沿用上一微帧，不会无故闪断
function updateLampInputs(recv) {
  for (let i = 0; i < elements.length; i++) {
    if (elements[i].typeId !== "lamp") continue;
    elements[i].litIn = recv[i] !== 0;
  }
}

// 按本微帧的接收结果安排各元件下一微帧的输出，实现文档 §8.2 的「t 微帧接收、t+1 微帧输出」
// 出口规则：元件只朝箭头方向输出，所以来自箭头侧的输入一律无效，只有其他侧来光才算有效输入
// 光源不参与：它的输出完全由开关决定，elementEmit 里已经直接算好
// 灯也不参与：它只作指示，收到光只用来点亮自己，不会往下游发
function scheduleOutputs(recv) {
  for (let i = 0; i < elements.length; i++) {
    const el = elements[i];
    if (el.deleting || el.selected || el.typeId === "light" || el.typeId === "lamp") continue;
    const valid = recv[i] & ~(1 << el.dir);  // 抹掉出口侧那一位，剩下的位里只要有一位就是有效输入
    // 反相器是非门：有有效输入就不发射、没有输入才发射，正好与偏转器、透射器相反
    if (el.typeId === "inverter") {
      el.out = valid ? 0 : (1 << el.dir);
    } else {
      el.out = valid ? (1 << el.dir) : 0;
    }
  }
}

// 判断两个发射掩码是否完全一致：长度不同或任一位不同都算不一致
// 掩码一致且阻挡图未重建时，激光场与接收掩码必然一模一样，本微帧可以直接跳过重算
function emitEquals(a, b) {
  if (b === null || a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) {
    if (a[i] !== b[i]) return false;
  }
  return true;
}

// 算出每个元件的接收掩码：某一位为 1，表示「有一个位于我这一侧的发射者，它的激光覆盖到了我」
// 注意不是「我这一侧有没有激光」：从对面射来又穿过去的光两侧都有，但它只从对面来，出口规则要靠这个区别
// 每行每列各扫两遍：前缀最大管「左边来的光最远射到哪」，后缀最小管「右边来的光最远射到哪」
// 这样整行一趟 O(行长) 就能得到该行所有人的掩码，不必让每条激光各自去标记自己覆盖了谁
function computeRecvMask(emit) {
  const mask = new Array(elements.length).fill(0);

  // 行：从左往右，reach 是「左边所有朝右发射的激光里，能覆盖到的最右位置」
  rayGraph.rows.forEach(function (arr) {
    const k = arr.length;
    let reach = -1;
    for (let p = 0; p < k; p++) {
      const i = arr[p];
      // 先判后记，严格不等式把元件自己排除在外：自己发的光不该算成自己的输入
      if (reach >= p) mask[i] |= SIDE_LEFT;
      if (emit[i] & SIDE_RIGHT) reach = Math.max(reach, rayGraph.endR[i]);
    }
    // 行：从右往左，reach2 是「右边所有朝左发射的激光里，能覆盖到的最左位置」
    let reach2 = k;
    for (let p = k - 1; p >= 0; p--) {
      const i = arr[p];
      if (reach2 <= p) mask[i] |= SIDE_RIGHT;
      if (emit[i] & SIDE_LEFT) reach2 = Math.min(reach2, rayGraph.endL[i]);
    }
  });

  // 列：列数组按 wy 升序，下标增大方向是「上」，两趟扫描的逻辑与行完全一致
  rayGraph.cols.forEach(function (arr) {
    const k = arr.length;
    let reach = -1;
    for (let p = 0; p < k; p++) {
      const i = arr[p];
      if (reach >= p) mask[i] |= SIDE_DOWN;   // 来自更小下标 = wy 更小 = 视觉下方
      if (emit[i] & SIDE_UP) reach = Math.max(reach, rayGraph.endU[i]);
    }
    let reach2 = k;
    for (let p = k - 1; p >= 0; p--) {
      const i = arr[p];
      if (reach2 <= p) mask[i] |= SIDE_UP;    // 来自更大下标 = wy 更大 = 视觉上方
      if (emit[i] & SIDE_DOWN) reach2 = Math.min(reach2, rayGraph.endD[i]);
    }
  });

  return mask;
}

// 合并同一行（或同一列）上的区间：按起点排序后一遍扫过，与上一段相接或重叠就并进去
// 相接也算并，因为激光场是个点集，首尾相接的两段对模型来说就是连续的一段
// 区间用的是阻挡图里的位置坐标，无人阻挡的两端记 -1 和数组长度，都是有限整数，排序不会碰到 Infinity
function mergeSpans(spans) {
  spans.sort(function (s, t) { return (s[0] - t[0]) || (s[1] - t[1]); });
  const merged = [];
  for (let j = 0; j < spans.length; j++) {
    const s = spans[j];
    const last = merged[merged.length - 1];
    if (last !== undefined && s[0] <= last[1]) {
      if (s[1] > last[1]) last[1] = s[1];
    } else {
      merged.push([s[0], s[1]]);
    }
  }
  return merged;
}

// 位置坐标换成世界坐标：位置 -1 表示左边没人挡、位置等于数组长度表示右边没人挡，都换成 ±Infinity
// 有限位置直接取该位置元件对应的坐标分量，key 传 "wx" 或 "wy"
function spanToWorld(arr, key, p) {
  if (p === -1) return -Infinity;
  if (p === arr.length) return Infinity;
  return elements[arr[p]][key];
}

// 单微帧的激光场：先按阻挡图给每条射线定出两端，再按行、按列各自取并集
// 取并集是模型要求：同一条线上重叠或相接的激光，作为点集本来就是一段，不能当成多条
// 返回 [{horizontal, key, a, b}]：horizontal 为 true 是行上的线段，key 是该行 wy，a/b 是两端的 wx；反之是列
function computeLaserSegments(emit) {
  const out = [];

  // 行：固定坐标是 wy，变化坐标是 wx
  rayGraph.rows.forEach(function (arr, wy) {
    const k = arr.length;
    const spans = [];
    for (let p = 0; p < k; p++) {
      const i = arr[p];
      if (emit[i] & SIDE_RIGHT) spans.push([p, rayGraph.endR[i]]);  // 向右：起点是自己，终点是右边最近的阻挡者
      if (emit[i] & SIDE_LEFT) spans.push([rayGraph.endL[i], p]);   // 向左：起点是左边最近的阻挡者，终点是自己
    }
    const merged = mergeSpans(spans);
    for (let j = 0; j < merged.length; j++) {
      out.push({
        horizontal: true, key: wy,
        a: spanToWorld(arr, "wx", merged[j][0]),
        b: spanToWorld(arr, "wx", merged[j][1])
      });
    }
  });

  // 列：固定坐标是 wx，变化坐标是 wy
  rayGraph.cols.forEach(function (arr, wx) {
    const k = arr.length;
    const spans = [];
    for (let p = 0; p < k; p++) {
      const i = arr[p];
      if (emit[i] & SIDE_UP) spans.push([p, rayGraph.endU[i]]);    // 向上：起点是自己，终点是上方最近的阻挡者
      if (emit[i] & SIDE_DOWN) spans.push([rayGraph.endD[i], p]);  // 向下：起点是下方最近的阻挡者，终点是自己
    }
    const merged = mergeSpans(spans);
    for (let j = 0; j < merged.length; j++) {
      out.push({
        horizontal: false, key: wx,
        a: spanToWorld(arr, "wy", merged[j][0]),
        b: spanToWorld(arr, "wy", merged[j][1])
      });
    }
  });

  return out;
}

/* ========== 选中 ========== */

// 当前是不是「选中工具」：只有它被选中时，画布上的左键才是选择而不是放置
// 放置与选择共用一个左键，靠这个判据分流，两边不会互相抢操作
function selectToolActive() {
  return slotSelectedIndex === SELECT_SLOT_INDEX;
}

// 切换选中的选项槽：手上虚影随之换成新类型；从选中工具切走时立刻把选区收掉
// 收选区必须「立刻」而不是等下次操作：元件一直离地会让画面和数据长期不一致，用户也看不到落位结果
function setSelectedSlot(index) {
  const wasSelect = selectToolActive();
  slotSelectedIndex = index;
  if (wasSelect && !selectToolActive()) exitSelectTool();
  applyGhostType();
}

// 退出选中模式：把所有选中一并取消，离地的元件就地落位（落点上的普通元件被顶掉）
// 走 applySelection 这个总入口，落位规则与「单击空白清空选中」完全一致，不会出现两套行为
function exitSelectTool() {
  let any = false;
  for (let i = 0; i < elements.length; i++) {
    if (elements[i].selected) { any = true; break; }
  }
  if (!any) return;  // 本来就没选中：不白跑一遍落位
  applySelection(function () { return false; }, false);
}

// ===== 选区框架 =====
// 「谁被选中」和「选区有没有离地」是两件事：
// 离地 = 这批元件暂时不跟地图发生占用关系，压在别人的格子上也不会把别人顶掉，画面上允许暂时重叠；
// 只有元件离开选区那一刻才落地，落点格子上没被选中的元件才被顶掉。
// 单击和拉框共用 applySelection 这一个入口，「不按 Shift 只留命中的、按住 Shift 逐个翻转」只有一份规则。

// 落位：把「这一轮离开选区」的元件放下来，落点格子上没被选中的元件直接顶掉
// 用立即移除而不是走删除动画：动画期间那一格仍算被占用，会和刚落下的元件叠在同一格里
// 只有离开选区的元件才落地，继续留在选区里的仍然离地，所以拖动、旋转中途随便改主意都不会造成不可逆的破坏
function landSelection(landing) {
  if (landing.length === 0) return;
  let removed = 0;
  // 倒序遍历：splice 会让后面所有下标前移，倒着走不会漏掉还没处理的项
  for (let i = elements.length - 1; i >= 0; i--) {
    const el = elements[i];
    if (el.selected || el.deleting) continue;        // 还在选区里的自己人不能动；正在消失的元件不参与判定
    if (landing.indexOf(el) >= 0) continue;          // 这次落地的自己人留着
    if (!cellOccupiedBy(landing, el.wx, el.wy)) continue;  // 没有落地元件压住它这一格，留着
    elemLayer.removeChild(el.node);
    elements.splice(i, 1);
    removed++;
  }
  // 真的顶掉了才需要重算：否则每一下拉框都会全量重建阻挡图，白卡一顿
  if (removed > 0) rayGraph.dirty = true;  // splice 让下标前移，阻挡图里存的下标随之失效
}

// 指定格心是否被名单里某个元件占着：落位判定用，只看格心相等
function cellOccupiedBy(list, wx, wy) {
  for (let i = 0; i < list.length; i++) {
    if (list[i].wx === wx && list[i].wy === wy) return true;
  }
  return false;
}

// 选区判定总入口：单击与拉框都走这里，两边的规则不会各写一份、慢慢跑偏
// isHit 是个判定函数，告诉框架某个元件这一轮算不算被命中（单击看是不是指针所在那个，拉框看格子与框有没有相交）
// toggle 为真（按住 Shift）时以按下时的快照为基准逐个翻转；为假时按常规「只留命中的」处理
// 翻转用快照而不是当前状态，所以框拉大拉小、来回拖，同一个元件都不会反复横跳
function applySelection(isHit, toggle) {
  const landing = [];  // 这一轮从「选中」变成「不选中」的元件：只有它们算被放下
  const nextSel = [];  // 与 elements 一一对应的新选中状态，先全部算好再统一写回
  for (let i = 0; i < elements.length; i++) {
    const el = elements[i];
    let sel = false;
    if (!el.deleting) {  // 删除动画中的元件不参与选中
      const hit = isHit(el);
      sel = toggle ? (hit ? !el.selBase : el.selBase) : hit;
      if (el.selected && !sel) landing.push(el);  // 离开选区，这一刻才落地
    }
    nextSel.push(sel);
  }
  for (let i = 0; i < elements.length; i++) elements[i].selected = nextSel[i];  // 先写回状态，落地时按新状态认人
  landSelection(landing);  // 只有离开选区的那些才放下；Shift 加点新元件不会把手上这批顺手提交掉
  raiseSelectedElements();  // 选中的挪到元件层最上面，和命中判定的上下关系保持一致
  selOrientDir = 0;  // 这一批算新选区，朝向从朝上重新起算，接着按 WASD 才是相对「朝上」转
  rayGraph.dirty = true;  // 选中集合一变，参与模拟的元件就变了，阻挡图必须按新集合重建
  sceneDirty = true;
  // 记一步：元件落地、以及落点顶掉别人，都发生在这一刻，这才是电路真正被改动的时刻
  // 拉框途中不记：每动一下都记会把一次框选拆成几十步，等松手时统一记一次
  if (!marqueeActive) commitHistory();
}

// 把选中的元件挪到元件层最上面：正在手上的那一批压在其他元件之上
// 这样「谁在最上面」和命中判定用的是同一个顺序，用户看到哪个就能选到哪个，不会出现看得见却选不中的情况
// 只在选区变化时调用一次；appendChild 作用在已有子节点上等于把它挪到末尾，不必每帧重排
function raiseSelectedElements() {
  for (let i = 0; i < elements.length; i++) {
    const el = elements[i];
    if (el.selected && !el.deleting) elemLayer.appendChild(el.node);
  }
}

// 单击选中：命中的是指针所在那一格的元件；点空白处谁都没命中，等于清空全部选中
// 按住 Shift 时和拉框一样走翻转，点一下就在「选中」与「未选中」之间切一次
function selectAtPointer(toggle) {
  const el = findElementAtPointer();
  const hitEl = (el !== null && !el.deleting) ? el : null;  // 删除动画中的元件不算点中，避免选到一个正在消失的东西
  applySelection(function (e) { return e === hitEl; }, toggle);
}

// 框选：逐个判元件所占的格子与拉框矩形是否相交，相交即命中
// 用整格去判而不是用格心：框擦到格子边缘也算命中，和常见画图软件的手感一致
function selectInMarquee(x0, y0, x1, y1, toggle) {
  const left = Math.min(x0, x1);
  const right = Math.max(x0, x1);
  const top = Math.min(y0, y1);
  const bottom = Math.max(y0, y1);
  const half = state.scale / 2;  // 半格在屏幕上的像素数：一格是 1×1 世界单位，所以整格宽就是当前缩放
  applySelection(function (el) {
    const cx = worldToScreenX(el.wx);
    const cy = worldToScreenY(el.wy);
    if (!(cx + half >= left && cx - half <= right && cy + half >= top && cy - half <= bottom)) return false;
    // 同一格只认最上层那个：被压住的元件不参与命中，否则一格会同时选中两个元件
    return el === topElementAtCell(el.wx, el.wy);
  }, toggle);
}

// 拉框按下：记下起点并捕获指针，这样指针移出画布甚至移出窗口也能继续收到 move
function beginMarquee(e) {
  marqueePointerId = e.pointerId;
  marqueePressing = true;
  marqueeActive = false;
  marqueeStartSX = e.clientX;
  marqueeStartSY = e.clientY;
  marqueeEndSX = e.clientX;
  marqueeEndSY = e.clientY;
  // 按下的这一刻把每个元件的选中状态存一份快照：按住 Shift 框选时的翻转以它为基准，
  // 拖动过程中选中状态一直在变，不存快照的话同一个元件会被反复翻转
  for (let i = 0; i < elements.length; i++) elements[i].selBase = elements[i].selected;
  canvas.setPointerCapture(e.pointerId);
}

// 拉框移动：超过阈值才算真的在拉框，没超过仍按单击处理，避免手一抖就拉出一个空框把选中清掉
function moveMarquee(e) {
  if (!marqueePressing || e.pointerId !== marqueePointerId) return;
  marqueeEndSX = e.clientX;
  marqueeEndSY = e.clientY;
  if (!marqueeActive) {
    const dx = marqueeEndSX - marqueeStartSX;
    const dy = marqueeEndSY - marqueeStartSY;
    if (dx * dx + dy * dy < CONFIG.marqueeThreshold * CONFIG.marqueeThreshold) return;
    marqueeActive = true;
  }
  // 边拉边亮：每动一下都按当前框重算一遍选中，框到的元件立刻提亮，缩回去的自动退回未选中
  // 与松开时用的是同一个判定，所见即所得，不会出现「预览亮着、松手结果不一样」
  // 按住 Shift 就切到翻转模式，拖动途中按下或松开 Shift 都能即时切换，不必重新拉框
  selectInMarquee(marqueeStartSX, marqueeStartSY, marqueeEndSX, marqueeEndSY, e.shiftKey);
  sceneDirty = true;  // 框要跟着指针走，每动一下都得重画
}

// 拉框松开：真拉出框了就按框选一批，否则当成一次单击（选中点中的元件，或清空选中）
// 两条路都要走，否则「按下不动再松开」会既没选中也没清空，手感很怪
// 单击时把 Shift 状态一并传下去，这样 Shift+单击也能像 Shift+框选那样翻转，两边的规则完全一致
function endMarquee(e) {
  if (marqueeActive) selectInMarquee(marqueeStartSX, marqueeStartSY, marqueeEndSX, marqueeEndSY, e.shiftKey);
  else selectAtPointer(e.shiftKey);
  marqueePressing = false;
  marqueeActive = false;
  marqueePointerId = -1;
  if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
  sceneDirty = true;
  commitHistory();  // 框选期间刻意不记步，松手这一刻把整场框选（含落位顶替）合成一步
}

// 拉框被系统打断（如触控中断）：只收状态、不动选中，免得把用户已有的选择误清掉
function cancelMarquee(e) {
  marqueePressing = false;
  marqueeActive = false;
  marqueePointerId = -1;
  if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
  sceneDirty = true;
  commitHistory();  // 框选途中已经有元件落过地，被打断也要把那些改动记下来，否则会和后面的步混成一步
}

// 按下已选中的元件：进入拖动准备态，记下起点世界坐标，并把这一批选中的元件收进拖动组
// 组里存的是元件引用而不是下标：落地时可能删掉被覆盖的元件，下标会整体前移，存下标会指错人
function beginMove(e) {
  moveDragging = true;
  movePointerId = e.pointerId;
  moveStartWX = screenToWorldX(e.clientX);
  moveStartWY = screenToWorldY(e.clientY);
  moveDGX = 0;
  moveDGY = 0;
  moveGroup.length = 0;
  for (let i = 0; i < elements.length; i++) {
    const el = elements[i];
    if (el.selected && !el.deleting) moveGroup.push(el);  // 删除动画中的元件不带走
  }
  canvas.setPointerCapture(e.pointerId);
}

// 拖动中：按指针相对按下点的位移算出整数格位移，只把「与上次的差值」加给元件，避免每帧重复累加
// 位移取整到整格，数据始终落在格心上；画面位置另加一份缓动偏移，松手前会平滑追上，看着不硬跳
// 拖动期间相机不动，所以直接用按下时的世界坐标当基准，不必每帧换算参考点
function moveSelectionDrag(e) {
  if (!moveDragging || e.pointerId !== movePointerId) return;
  const dgx = Math.round(screenToWorldX(e.clientX) - moveStartWX);
  const dgy = Math.round(screenToWorldY(e.clientY) - moveStartWY);
  if (dgx === moveDGX && dgy === moveDGY) return;  // 还没跨到下一格：不动元件，也不必重算激光
  const stepX = dgx - moveDGX;
  const stepY = dgy - moveDGY;
  moveDGX = dgx;
  moveDGY = dgy;
  for (let i = 0; i < moveGroup.length; i++) {
    const el = moveGroup[i];
    el.wx += stepX;
    el.wy += stepY;
    // 视觉偏移反向补上这一步：数据已经跳到新格，画面先留在原处，再由 updateMoveAnim 缓出追上
    el.mvOffU -= stepX;
    el.mvOffV -= stepY;
  }
  rayGraph.dirty = true;  // 位置变了，谁挡谁的结论随之改变，下一微帧按新位置重算激光
  sceneDirty = true;      // 元件节点要摆到新格心上，强制重绘一次
}

// 松开左键：只收拖动状态，不动地图上的其他元件
// 落点顶替不在这里做——选区结束（重新确定选区）时才统一落位，拖动中途随便改主意都不会造成不可逆的破坏
// 没挪动过（原地按下又松开）就什么都不做：多选时点一下已选中的元件不该把选中收缩成一个
function endMove(e) {
  moveDragging = false;
  movePointerId = -1;
  moveDGX = 0;
  moveDGY = 0;
  moveGroup.length = 0;
  if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
  sceneDirty = true;
}

// 拖动被系统打断（如触控中断）：把元件退回原位再收状态
// 位移是整组统一的整数格位移，反向加回去即可，不需要逐个记原始坐标
function cancelMove(e) {
  for (let i = 0; i < moveGroup.length; i++) {
    const el = moveGroup[i];
    el.wx -= moveDGX;
    el.wy -= moveDGY;
    el.mvOffU = 0;  // 退回原位是「撤销」，不该留缓动尾巴，直接归零让画面与数据立刻对齐
    el.mvOffV = 0;
  }
  if (moveDGX !== 0 || moveDGY !== 0) rayGraph.dirty = true;  // 退回去了，激光要按原位重算
  moveDragging = false;
  movePointerId = -1;
  moveDGX = 0;
  moveDGY = 0;
  moveGroup.length = 0;
  if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
  sceneDirty = true;
}

// 选中元件的包围盒，用格号表示：没有选中元件时返回 null
// 元件一定在格心上，格心坐标减 0.5 就是整数格号，可以直接取整
function selectionBounds() {
  let uMin = Infinity, uMax = -Infinity, vMin = Infinity, vMax = -Infinity, n = 0;
  for (let i = 0; i < elements.length; i++) {
    const el = elements[i];
    if (!el.selected || el.deleting) continue;
    const u = Math.round(el.wx - 0.5);
    const v = Math.round(el.wy - 0.5);
    if (u < uMin) uMin = u;
    if (u > uMax) uMax = u;
    if (v < vMin) vMin = v;
    if (v > vMax) vMax = v;
    n++;
  }
  if (n === 0) return null;
  return { uMin: uMin, uMax: uMax, vMin: vMin, vMax: vMax };
}

// 起一段公转：把每个元件的起点格号与起点角度记在它自己身上，进度归零
// 起点只记在元件上，动画期间元件的 wx/wy 一动不动，激光要等落位后才按新位置重算
function beginOrbit(refs, pivotU, pivotV, turns) {
  orbitPivotU = pivotU;
  orbitPivotV = pivotV;
  orbitTurns = turns;
  orbitP = 0;
  const total = turns * 90;
  for (let i = 0; i < refs.length; i++) {
    const el = refs[i];
    el.orbitU0 = Math.round(el.wx - 0.5);
    el.orbitV0 = Math.round(el.wy - 0.5);
    el.orbitAngle0 = el.angle;
    // 轴心在半格上时，转完的精确位置会卡在半格边界，落位要吸附回格心；把这个吸附量先记下来，
    // 动画途中按进度逐步补上，收尾那一下才不会整批跳半格
    const p = orbitPoint(el.orbitU0, el.orbitV0, total);
    el.orbitShiftU = Math.round(p.u) - p.u;
    el.orbitShiftV = Math.round(p.v) - p.v;
  }
  orbitActive = true;
  sceneDirty = true;
}

// 走一步公转：上一段还在飞就先把它的终点落位，再按当前选中的元件重新起一段
// 这样连续跨过好几格也不丢步，只是每段动画被压缩成「立即到位」
// 拖拽弧线与 WASD 都走这里，选区朝向也在这里同步推进，两条入口不会各自记一份朝向
function applyOrbitStep(step) {
  if (step === 0) return;
  if (orbitActive) finishOrbit();
  const refs = [];
  for (let i = 0; i < elements.length; i++) {
    if (elements[i].selected && !elements[i].deleting) refs.push(elements[i]);
  }
  if (refs.length === 0) return;
  // 整批转了 step 个 90°，选区朝向跟着一起走，下次按键才是相对新朝向算要转多少
  selOrientDir = ((selOrientDir + step) % 4 + 4) % 4;
  beginOrbit(refs, rotPivotU, rotPivotV, step);
}

// 用 WASD 把整个选区转到按下的方向：上、右、下、左，整批按最短路径一起转 90° 的整数倍
// 要转多少以选区自己的朝向为准（新选区一律朝上），不是看某个元件的角度，所以整批刚体旋转、相对形状不变
// 轴心沿用拖拽弧线那套「包围盒几何中心」，每次按键按当前包围盒重算，转完再吸附回格心
// 返回 true 表示这次按键已经由选区接手；没有选中元件时返回 false，让调用方退回悬停元件 / 虚影的老逻辑
function rotateSelectionToDir(dirKey) {
  let hasSelection = false;
  for (let i = 0; i < elements.length; i++) {
    if (elements[i].selected && !elements[i].deleting) { hasSelection = true; break; }
  }
  if (!hasSelection) return false;
  // 上一段公转还在飞就先落位，否则朝向与画面错位，整批会多转一步或少转一步
  if (orbitActive) finishOrbit();
  const steps = Math.round(shortestTurnTo(selOrientDir * 90, dirKey * 90) / 90);
  if (steps === 0) return true;  // 已经朝着这个方向：不做动作，但也不能再落到悬停元件上
  const b = selectionBounds();
  if (b === null) return true;
  rotPivotU = (b.uMin + b.uMax) / 2;
  rotPivotV = (b.vMin + b.vMax) / 2;
  applyOrbitStep(steps);
  return true;
}

// 用 WASD 把指针悬停的那个元件转到按下的方向：没有选区时的第二顺位
// 与虚影共用同一套「最短路径」算法：元件自带朝向，只拨到目标朝向，不顺着累积角度绕远路
// 转完立刻记一步：悬停旋转是就地生效的改动，不像选区那样「悬空」，不记的话撤销会跳过它去撤更早的动作
// 返回 true 表示这次按键已经由悬停元件接手；指针下没元件（空格、视口外、正在消失的）时返回 false，让调用方退回虚影
function rotateHoveredElement(dirKey) {
  if (!pointerInside) return false;
  if (orbitActive) return false;  // 整批公转还在飞：这一拍让给选区，避免同一个元件被两套旋转同时改角度
  const el = findElementAtPointer();
  if (el === null || el.deleting) return false;
  const next = el.angleTarget + shortestTurnTo(el.angleTarget, dirKey * 90);
  if (next === el.angleTarget) return true;  // 已经朝着这个方向：不做动作，但也不能再落到虚影上
  el.angleTarget = next;
  commitHistory();  // 朝向是电路的一部分（决定激光往哪边走），转一下就该占一步历史
  sceneDirty = true;  // 角度目标变了，即使画面此刻静止也要重绘一帧把旋转动画推起来
  return true;
}

// 公转推进：进度按固定时长走满，配缓出曲线，起步快、收尾慢，落位干脆
function updateOrbit(dt) {
  if (!orbitActive) return;
  orbitP += dt / CONFIG.orbitDuration;
  if (orbitP >= 1) { finishOrbit(); return; }
  sceneDirty = true;  // 元件每帧都在弧线上挪位置，必须每帧重画
}

// 公转落位：把终点写回元件数据（格心、角度、离散朝向），再让阻挡图按新位置重算
// 动画期间只改画面不改数据，所以落位这一刻才是激光真正跟着转的一刻
// 这里不顶掉落点上的其他元件：选区还在，元件仍算离地，等选区结束那一刻才统一落位
function finishOrbit() {
  const total = orbitTurns * 90;
  for (let i = 0; i < elements.length; i++) {
    const el = elements[i];
    if (el.orbitU0 === null) continue;
    // 落点先按精确位置算，再吸附回最近的格心：轴心在半格上时这一步会把整批平移半格
    const p = orbitPoint(el.orbitU0, el.orbitV0, total);
    el.wx = Math.round(p.u) + 0.5;
    el.wy = Math.round(p.v) + 0.5;
    el.angle = el.orbitAngle0 + total;
    el.angleTarget = el.angle;
    el.dir = ((Math.round(el.angle / 90) % 4) + 4) % 4;  // 离散朝向跟着落位角度走，激光逻辑读的是它
    el.orbitU0 = null;
    el.orbitV0 = null;
    el.orbitShiftU = 0;
    el.orbitShiftV = 0;
  }
  orbitActive = false;
  orbitP = 0;
  orbitTurns = 0;
  rayGraph.dirty = true;  // 位置与朝向都变了，阻挡图和激光场必须重算
  sceneDirty = true;
}

// 把某个格号绕轴心旋转指定角度，返回旋转后的精确位置（可能落在半格上，不做取整）
// 角度永远是 90 的整数倍，这里用精确的 0/±1 代替 cos/sin：浮点算出的 cos90° 是 6.1e-17 而不是 0，
// 会让恰好卡在半格边界上的结果多出 ±1e-17，Math.round 在 .5 处就会朝两边乱跳，整批形状被撕开
function orbitPoint(u, v, angleDeg) {
  const k = ((Math.round(angleDeg / 90) % 4) + 4) % 4;  // 归一化成四个象限，绕几圈都只看余数
  const c = [1, 0, -1, 0][k];  // cos(k×90°) 的精确值
  const s = [0, 1, 0, -1][k];  // sin(k×90°) 的精确值
  const du = u - orbitPivotU;
  const dv = v - orbitPivotV;
  return { u: orbitPivotU + du * c + dv * s, v: orbitPivotV - du * s + dv * c };
}

// 画拉框：半透明填充加一圈实线，直接用屏幕坐标画，不参与相机变换
function drawMarquee() {
  if (!marqueeActive) return;
  const x = Math.min(marqueeStartSX, marqueeEndSX);
  const y = Math.min(marqueeStartSY, marqueeEndSY);
  const w = Math.abs(marqueeEndSX - marqueeStartSX);
  const h = Math.abs(marqueeEndSY - marqueeStartSY);
  ctx.save();
  ctx.fillStyle = COLOR.selectFill;
  ctx.fillRect(x, y, w, h);
  ctx.lineWidth = CONFIG.marqueeWidth;
  ctx.strokeStyle = COLOR.selectBorder;
  ctx.strokeRect(x, y, w, h);
  ctx.restore();
}

/* ========== 虚影 ========== */

// 建虚影节点：路径取当前选中的类型，整体降低不透明度表示「尚未放置」；虚影不接收指针事件
function createGhostNode() {
  const node = createElementNode(selectedTypeId(), CONFIG.ghostOpacity);
  node.setAttribute("pointer-events", "none");
  return node;
}

// 把虚影形状换成当前选中的类型：切换选项槽时调用，虚影立即变成手上的那个元件
function applyGhostType() {
  if (ghostNode === null) return;
  const typeId = selectedTypeId();
  if (typeId === null) return;   // 选中工具没有形状可换，此刻虚影也是收起的，保留原路径即可
  ghostNode.setAttribute("d", elementPathD(typeId));
}

// 每帧更新虚影：先从指针位置重算目标格心（相机可能正在平移缩放），再按「可放置 / 不可放置」两条分支推进
function updateGhost(dt) {
  // 指针不在画布内、或跑到视口外时立刻隐藏，也不做「进不去」动画
  if (!pointerInside || !isInViewport(pointerSX, pointerSY)) {
    ghostVisible = false;
    ghostRejectActive = false;
    ghostAlpha = 0;
    return;
  }
  // 手上拿的是选中工具时没有元件要预览，虚影直接收起，同样不走「进不去」动画
  if (selectedTypeId() === null) {
    ghostVisible = false;
    ghostRejectActive = false;
    ghostAlpha = 0;
    return;
  }
  const wx = cellCenterX(screenToWorldX(pointerSX));
  const wy = cellCenterY(screenToWorldY(pointerSY));

  // 分支一：目标格可放置 —— 淡入并向格心平滑靠近，同时取消可能还在走的「进不去」动画
  if (findElementAt(wx, wy) === null) {
    ghostRejectActive = false;
    ghostTWX = wx;
    ghostTWY = wy;
    // 从隐藏变为显示时直接落到目标格，避免虚影从上一个位置飞过来
    if (!ghostVisible) {
      ghostWX = ghostTWX;
      ghostWY = ghostTWY;
    }
    ghostVisible = true;
    const k = 1 - Math.exp(-CONFIG.ghostLambda * dt);
    ghostWX += (ghostTWX - ghostWX) * k;
    ghostWY += (ghostTWY - ghostWY) * k;
    // 和相机一样做吸附，否则虚影会在格心附近永远做亚像素漂移
    if (Math.abs(ghostTWX - ghostWX) < CONFIG.ghostSettle) ghostWX = ghostTWX;
    if (Math.abs(ghostTWY - ghostWY) < CONFIG.ghostSettle) ghostWY = ghostTWY;
    const kf = 1 - Math.exp(-CONFIG.ghostFadeInLambda * dt);
    ghostAlpha += (1 - ghostAlpha) * kf;
    // 指数平滑逼近而不到达，到达端直接吸附，避免永远留一丝透明
    if (ghostAlpha > 0.998) ghostAlpha = 1;
    return;
  }

  // 分支二：目标格不可放置 —— 一边朝那一格格心移动一边消失，表示这一格进不去
  // 位移与透明度共用同一条缓动进度，所以「位移走到一半」与「透明度归零」仍是同一时刻
  if (!ghostRejectActive || ghostRejectToWX !== wx || ghostRejectToWY !== wy) {
    // 首次进入、或鼠标又滑到另一个不可放置格：都从当前位置重新起算，透明度才不会跳变
    ghostRejectActive = true;
    ghostRejectP = 0;
    ghostRejectStartAlpha = ghostAlpha;
    ghostRejectFromWX = ghostWX;
    ghostRejectFromWY = ghostWY;
    ghostRejectToWX = wx;
    ghostRejectToWY = wy;
  }
  ghostVisible = false;
  // 进度按固定时长推进，帧率不同也走同样长的时间
  ghostRejectP = Math.min(1, ghostRejectP + dt / CONFIG.ghostRejectDuration);
  // 缓动值同时喂给位置和透明度：位移走完一半距离时，缓动值正好 0.5，透明度也正好归零
  const e = easeOutExpo(ghostRejectP);
  ghostWX = ghostRejectFromWX + (ghostRejectToWX - ghostRejectFromWX) * e;
  ghostWY = ghostRejectFromWY + (ghostRejectToWY - ghostRejectFromWY) * e;
  // 乘起始系数是为了中途换格时不闪一下
  ghostAlpha = ghostRejectStartAlpha * Math.max(0, 1 - 2 * e);
  if (ghostAlpha < 0.002) ghostAlpha = 0;
}

// 求「从当前角度拨到某个朝向」所需的最小增量，结果落在 (-180, 180]
// 角度是连续累积的，所以不能直接赋绝对值；这里只算最近的那条路，避免按反方向键时顺着累积角度绕一大圈
function shortestTurnTo(curAngle, dirAngle) {
  let delta = (dirAngle - (curAngle % 360)) % 360;
  if (delta > 180) delta -= 360;
  if (delta < -180) delta += 360;
  return delta;
}

// 把数字键的键位码解析成从 0 开始的槽序号，主键盘与小键盘都认；不是 1~9 就返回 -1
// 用键位码而不是键名，同样是为了避开中文输入法把字母与数字变成 "Process" 的情况
function digitKeyIndex(code) {
  const m = /^(?:Digit|Numpad)([1-9])$/.exec(code);
  return m === null ? -1 : Number(m[1]) - 1;
}

// 每帧把虚影朝向的角度推向目标角度：指数收敛（先快后慢），停下后吸附并归一化
function updateGhostRotation(dt) {
  const k = 1 - Math.exp(-CONFIG.rotateLambda * dt);
  ghostAngle += (ghostAngleTarget - ghostAngle) * k;
  // 指数平滑永远逼近而不到达，误差足够小就直接吸附，避免长期停在零点几度的残差上
  if (Math.abs(ghostAngleTarget - ghostAngle) < CONFIG.rotateSettle) {
    ghostAngle = ghostAngleTarget;
    // 停下后把两者一起对 360 取模：此刻两者是同一个角度，同时取模不会让画面跳变，又能防止数值无限增大
    ghostAngle = ghostAngle % 360;
    ghostAngleTarget = ghostAngleTarget % 360;
  }
}

// 每帧把每个元件的角度推向它自己的目标角度：与虚影同一套收敛和归一化，手感保持一致
function updateElementRotations(dt) {
  const k = 1 - Math.exp(-CONFIG.rotateLambda * dt);
  for (let i = 0; i < elements.length; i++) {
    const el = elements[i];
    // 已经静止的元件直接跳过，省掉每帧的无谓计算
    if (el.angle === el.angleTarget) continue;
    el.angle += (el.angleTarget - el.angle) * k;
    if (Math.abs(el.angleTarget - el.angle) < CONFIG.rotateSettle) {
      el.angle = el.angleTarget;
      // 停下后归一化角度，并把离散朝向索引同步成最终朝向，供后续激光逻辑读取
      el.angle = el.angle % 360;
      el.angleTarget = el.angleTarget % 360;
      el.dir = ((Math.round(el.angleTarget / 90) % 4) + 4) % 4;
      rayGraph.dirty = true;  // 朝向变了，全局阻挡属性可能随之在水平/垂直之间互换
    }
  }
}

// 每帧推进所有元件的选中缓动：目标由「是否被选中」决定，固定时长走缓出曲线，很快但不生硬
// 正在删除的元件目标直接归零，跟着淡出一起退回常态配色，不会留下半亮的样子
function updateSelectionAnim(dt) {
  for (let i = 0; i < elements.length; i++) {
    const el = elements[i];
    stepEased(el.selP, el.selected && !el.deleting ? 1 : 0, dt, CONFIG.selectAnimDuration);
  }
}

// 每帧推进所有灯的亮起缓动：目标由「本微帧有没有被激光照到」决定，固定时长走缓出曲线
// 正在删除的灯目标直接归零，跟着淡出一起退回常态，不会留下半亮的残影
// 灯以外的元件直接跳过，省掉每帧一次无谓的 stepEased
function updateLampAnim(dt) {
  for (let i = 0; i < elements.length; i++) {
    const el = elements[i];
    if (el.typeId !== "lamp") continue;
    stepEased(el.litP, el.litIn && !el.deleting ? 1 : 0, dt, CONFIG.lampAnimDuration);
  }
}

// 每帧推进拖动缓动：把元件的视觉偏移按指数缓出收回到 0，元件平滑滑向数据所在的格心
// 用指数收敛而不是固定时长：连续跨格时每一步都从当前偏移接着走，快拖不会一顿一顿，慢拖也跟得住
function updateMoveAnim(dt) {
  const k = 1 - Math.exp(-CONFIG.moveLambda * dt);
  for (let i = 0; i < elements.length; i++) {
    const el = elements[i];
    if (el.mvOffU === 0 && el.mvOffV === 0) continue;  // 已经归零的直接跳过，省掉每帧的无谓计算
    el.mvOffU *= 1 - k;
    el.mvOffV *= 1 - k;
    // 残差小于阈值就直接归零：指数收敛永远到不了 0，不吸附的话画面会一直停着一丝抖动
    if (Math.abs(el.mvOffU) < CONFIG.moveSettle) el.mvOffU = 0;
    if (Math.abs(el.mvOffV) < CONFIG.moveSettle) el.mvOffV = 0;
    sceneDirty = true;  // 视觉位置每帧都在变，必须重绘
  }
}

// 每帧把虚影摆到屏幕上；完全透明时直接隐藏节点，连 transform 都不用算
function renderGhost() {
  if (ghostNode === null) return;
  if (ghostAlpha <= 0) {
    ghostNode.style.display = "none";
    return;
  }
  ghostNode.style.display = "";
  // ghostOpacity 是虚影的不透明度上限，实际透明度再乘上淡入淡出系数
  ghostNode.setAttribute("opacity", CONFIG.ghostOpacity * ghostAlpha);
  // 用动画中的连续角度：旋转过程中虚影是斜着的，转到位才正对格子
  ghostNode.setAttribute("transform", elementTransform(ghostWX, ghostWY, ghostAngle, 1));
}

// 初始化元件层：建裁剪路径，再建虚影节点（虚影要盖在已放置元件之上）
function initElementLayer() {
  elemLayer = document.getElementById("elemLayer");
  const clipPath = document.createElementNS(SVG_NS, "clipPath");
  clipPath.setAttribute("id", "viewportClip");
  clipRect = document.createElementNS(SVG_NS, "rect");
  clipPath.appendChild(clipRect);
  elemLayer.appendChild(clipPath);
  elemLayer.setAttribute("clip-path", "url(#viewportClip)");
  resizeElementLayer();
  // 虚影放在已放置元件之后，保证它画在最上层
  ghostNode = createGhostNode();
  elemLayer.appendChild(ghostNode);
}

/* ========== 调试面板 ========== */

// 调试面板默认隐藏，避免干扰正常界面；需要时在控制台执行 debugPanel.show() 唤出
let debugPanelEl = null;      // HTMLElement：调试面板根节点
let debugPanelVisible = false; // boolean：面板当前是否可见

// 统一设置面板可见性：内联 display 覆盖 CSS 里的默认隐藏
function setDebugPanelVisible(visible) {
  debugPanelVisible = visible;
  debugPanelEl.style.display = visible ? "block" : "none";
}

// 对外接口：以后往面板里加别的调试控件（不限于 HSL）也从这个对象进出
window.debugPanel = {
  show: function () { setDebugPanelVisible(true); },
  hide: function () { setDebugPanelVisible(false); },
  toggle: function () { setDebugPanelVisible(!debugPanelVisible); }
};

// 底板配色的 HSL 编辑器入口：唤出的就是上面这个调试面板，底板那组滑块在里面
// 单开一个入口是因为底板色属于界面而不是元件，调用点上写 panelColor.show() 比 debugPanel.show() 更明确
window.panelColor = {
  show: function () { setDebugPanelVisible(true); },
  hide: function () { setDebugPanelVisible(false); },
  toggle: function () { setDebugPanelVisible(!debugPanelVisible); }
};

// 把 HSL 三元组转成 CSS 颜色字符串；SVG 的 fill/stroke 直接接受 hsl() 写法
function hslCss(c) {
  return "hsl(" + c.h + ", " + c.s + "%, " + c.l + "%)";
}

// 两个 HSL 三元组按 k 线性混合（0 取 a，1 取 b），返回 CSS 的 hsl() 写法
// 供选中缓动使用：逐通道插值，色相只在本体与选中之间小幅平移，不会跨越 0 度而绕远路
function mixHsl(a, b, k) {
  return "hsl(" + (a.h + (b.h - a.h) * k) + ", " +
    (a.s + (b.s - a.s) * k) + "%, " +
    (a.l + (b.l - a.l) * k) + "%)";
}

// 同上的混合，但返回三元组本身而不是 CSS 写法：需要连着混两次（先按亮起、再按选中）时用它
// k 为 0 时返回的是 a 的副本，逐通道都加了 0，数值与 a 完全一致，不会给没参与混合的元件带来偏差
function mixHslTriple(a, b, k) {
  return {
    h: a.h + (b.h - a.h) * k,
    s: a.s + (b.s - a.s) * k,
    l: a.l + (b.l - a.l) * k
  };
}

// 把 HSL 三元组换算成 0-255 的 RGB：灯的亮起改用 RGB 逐通道混合，先把两端颜色取成 RGB 备用
// 标准换算：先由饱和度与亮度定出色度，再按色相落到六个扇区之一取出三分量，最后按亮度补正
function hslToRgb(c) {
  const s = c.s / 100;
  const l = c.l / 100;
  const k = (1 - Math.abs(2 * l - 1)) * s;        // 色度：饱和度越高、越远离全黑全白就越大
  const hp = (((c.h % 360) + 360) % 360) / 60;    // 色相归一化到 0-6，落在哪个扇区就取哪组分量
  const x = k * (1 - Math.abs((hp % 2) - 1));     // 扇区内的过渡分量
  let r = 0, g = 0, b = 0;
  if (hp < 1) { r = k; g = x; }
  else if (hp < 2) { r = x; g = k; }
  else if (hp < 3) { g = k; b = x; }
  else if (hp < 4) { g = x; b = k; }
  else if (hp < 5) { r = x; b = k; }
  else { r = k; b = x; }
  const m = l - k / 2;                            // 亮度补正：把算出的分量整体抬到目标亮度
  return { r: (r + m) * 255, g: (g + m) * 255, b: (b + m) * 255 };
}

// 两个 RGB 颜色按 k 线性混合（0 取 a，1 取 b）：逐通道插值，不经过色相环，所以不会串出无关颜色
// 灯的亮起就等于「在灯上盖一层淡红遮罩并把遮罩的不透明度从 0 拉到 1」，这个式子正是那层遮罩的混合结果
function mixRgb(a, b, k) {
  return {
    r: a.r + (b.r - a.r) * k,
    g: a.g + (b.g - a.g) * k,
    b: a.b + (b.b - a.b) * k
  };
}

// RGB 三元组转成 CSS 颜色字符串；在这里统一取整，混合过程保留小数，避免连续过渡时逐帧累积误差
function rgbCss(c) {
  return "rgb(" + Math.round(c.r) + ", " + Math.round(c.g) + ", " + Math.round(c.b) + ")";
}

// 把配色朝白色提亮 k（0 原色、1 全白）：只抬亮度、顺手压一点饱和度，色相不动
// 这样不管用户把设置按钮调成什么颜色，亮态都还是同一个色系，不会变成另一种颜色
function hslLit(c, k) {
  const l = c.l + (100 - c.l) * k;
  const s = c.s * (1 - k * 0.25);
  return "hsl(" + c.h + ", " + s + "%, " + l + "%)";
}

// 把一组配色写到面板里对应的色块与色值文本上；group 是 paletteUI 里的那一组 DOM 引用
function refreshSwatch(group, c) {
  const css = hslCss(c);
  group.sw.style.background = css;
  group.code.textContent = css;
}

// 把元件配色写到所有已放置的元件上；元件配色是固定的，只在初始化与重开时刷一次
function applyElementColors() {
  const fillCss = hslCss(elementHSL.fill);
  const strokeCss = hslCss(elementHSL.stroke);
  for (let i = 0; i < elements.length; i++) {
    elements[i].node.setAttribute("fill", fillCss);
    elements[i].node.setAttribute("stroke", strokeCss);
    // 缓存键作废：这里直接写了常态色，若缓存还留着旧进度，下一帧会以为配色没变而跳过重写
    elements[i].litK = -1;
  }
  sceneDirty = true;  // 配色变了要重绘；否则静止判定会认为画面没变，颜色改了也不显示
}

// 把元件那两组沙盒配色写到面板里的色块与色值文本；元件实际颜色固定取 elementHSL，这里只刷新显示
function refreshElementColorUI() {
  if (paletteUI === null) return;
  refreshSwatch(paletteUI.fill, elementSandbox.fill);
  refreshSwatch(paletteUI.stroke, elementSandbox.stroke);
}

// 把一组 H/S/L 滑块接到一个配色对象上：target 直接是 {h,s,l}，prefix 是这组滑块的 id 前缀
// onChange 在每次拖动后调用；现在八组接的都是沙盒，所以它只负责把新值刷到面板显示上
function bindHSLGroup(target, prefix, onChange) {
  const parts = ["h", "s", "l"];
  for (let i = 0; i < parts.length; i++) {
    const part = parts[i];
    const slider = document.getElementById(prefix + part.toUpperCase());
    // 滑块初值取当前配色，保证面板显示和实际颜色一致
    slider.value = target[part];
    // input 事件在拖动过程中连续触发，配色实时跟随
    slider.addEventListener("input", function () {
      target[part] = Number(slider.value);
      onChange();
    });
  }
}

// 把沙盒配色写到面板里的色块与色值文本；底板实际颜色取 COLOR.panelFill，这里只刷新显示
function refreshPanelColorUI() {
  if (paletteUI === null) return;
  refreshSwatch(paletteUI.panel, panelHSL);
}

// 把槽填充的沙盒配色写到面板里的色块与色值文本；槽实际填充取 COLOR.slotFill，这里只刷新显示
function refreshSlotColorUI() {
  if (paletteUI === null) return;
  refreshSwatch(paletteUI.slot, slotHSL);
}

// 把设置那四组沙盒配色写到面板里的色块与色值文本；画面颜色固定取 settingsHSL，这里只刷新显示
// 所以拖这四组滑块不会改动画面上任何东西，纯粹是取色参考
function refreshSettingsColorUI() {
  if (paletteUI === null) return;
  refreshSwatch(paletteUI.gearFill, settingsSandbox.gearFill);
  refreshSwatch(paletteUI.gearStroke, settingsSandbox.gearStroke);
  refreshSwatch(paletteUI.setFill, settingsSandbox.slotFill);
  refreshSwatch(paletteUI.setStroke, settingsSandbox.slotStroke);
}

// 初始化调试面板：缓存根节点与色块引用、绑定四组滑块、同步一次显示（面板保持隐藏）
function setupDebugPanel() {
  debugPanelEl = document.getElementById("debugPanel");
  paletteUI = {
    fill: {
      sw: document.getElementById("swFill"),
      code: document.getElementById("codeFill")
    },
    stroke: {
      sw: document.getElementById("swStroke"),
      code: document.getElementById("codeStroke")
    },
    panel: {
      sw: document.getElementById("swPanel"),
      code: document.getElementById("codePanel")
    },
    slot: {
      sw: document.getElementById("swSlot"),
      code: document.getElementById("codeSlot")
    },
    gearFill: {
      sw: document.getElementById("swGearFill"),
      code: document.getElementById("codeGearFill")
    },
    gearStroke: {
      sw: document.getElementById("swGearStroke"),
      code: document.getElementById("codeGearStroke")
    },
    setFill: {
      sw: document.getElementById("swSetFill"),
      code: document.getElementById("codeSetFill")
    },
    setStroke: {
      sw: document.getElementById("swSetStroke"),
      code: document.getElementById("codeSetStroke")
    }
  };
  // 面板里八组滑块现在全是取色沙盒：拖动只改色块与色值文本，画面颜色一律取各自的固定配色
  bindHSLGroup(elementSandbox.fill, "fill", refreshElementColorUI);
  bindHSLGroup(elementSandbox.stroke, "stroke", refreshElementColorUI);
  bindHSLGroup(panelHSL, "panel", refreshPanelColorUI);
  bindHSLGroup(slotHSL, "slot", refreshSlotColorUI);
  bindHSLGroup(settingsSandbox.gearFill, "gearFill", refreshSettingsColorUI);
  bindHSLGroup(settingsSandbox.gearStroke, "gearStroke", refreshSettingsColorUI);
  bindHSLGroup(settingsSandbox.slotFill, "setFill", refreshSettingsColorUI);
  bindHSLGroup(settingsSandbox.slotStroke, "setStroke", refreshSettingsColorUI);
  applyElementColors();
  refreshElementColorUI();
  refreshPanelColorUI();
  refreshSlotColorUI();
  refreshSettingsColorUI();
}

/* ========== 更新与渲染 ========== */

// 用指数平滑把参考点屏幕位置与缩放推向目标值，dt 参与计算保证不同帧率下速度一致
function updateCamera(dt) {
  const k = 1 - Math.exp(-CONFIG.smoothLambda * dt);
  state.logScale += (state.tLogScale - state.logScale) * k;
  state.anchorSX += (state.tAnchorSX - state.anchorSX) * k;
  state.anchorSY += (state.tAnchorSY - state.anchorSY) * k;
  // 指数平滑永远逼近而不到达，静止后会一直做亚像素漂移；误差足够小就直接吸附，画面彻底静下来
  if (Math.abs(state.tAnchorSX - state.anchorSX) < CONFIG.settlePx) state.anchorSX = state.tAnchorSX;
  if (Math.abs(state.tAnchorSY - state.anchorSY) < CONFIG.settlePx) state.anchorSY = state.tAnchorSY;
  if (Math.abs(state.tLogScale - state.logScale) < CONFIG.settleLogEps) state.logScale = state.tLogScale;
  // 缩放按对数插值，等比例变化看起来才均匀
  state.scale = Math.exp(state.logScale);
}

// 判断场景是否完全静止：相机、选项槽、简介浮层、元件动画、虚影全都停下
// 全停下就说明画面不会再变，主循环可以整帧跳过渲染，空闲时占用降到接近零
function isSceneSettled() {
  // 相机：吸附后当前值与目标值相等，不等就说明还在平移或缩放
  if (state.anchorSX !== state.tAnchorSX || state.anchorSY !== state.tAnchorSY) return false;
  if (state.logScale !== state.tLogScale) return false;
  // 选项槽的缩放缓动：任一槽没停稳就还在动
  for (let i = 0; i < slotAnim.length; i++) {
    if (slotAnim[i].t < 1) return false;
  }
  // 两个按钮的提亮：它们的缩放已经在上面那轮槽里查过了，这里只需补上提亮，否则动画会卡在半路
  if (settingsLitAnim.t < 1) return false;
  if (fileLitAnim.t < 1) return false;
  if (tutorialLitAnim.t < 1) return false;  // 教程按钮的提亮同样要查，否则动画会卡在半路不动
  if (tutorialModalAnim.t < 1) return false;  // 教程弹窗的淡入淡出也要查，否则窗口会卡在半透明或停在没显示出来的状态
  // 简介浮层：动画没走完就还在动
  if (tipAnim.t < 1) return false;
  // 元件：删除动画进行中、朝向还在转、选中缓动没走完、或拖动缓动还差一点没追上，都要继续渲染
  for (let i = 0; i < elements.length; i++) {
    const el = elements[i];
    if (el.deleting || el.angle !== el.angleTarget || el.selP.t < 1) return false;
    if (el.litP.t < 1) return false;  // 灯的亮起缓动没走完就还在变，不能整帧跳过
    if (el.mvOffU !== 0 || el.mvOffV !== 0) return false;  // 拖动缓动没归零就还在滑，不能整帧跳过
  }
  // 虚影：可见时位置没吸附、透明度停在半途、旋转没停，都算还在动
  // 不可见时不检查位置，因为它此时停在「进不去」动画的终点上，本来就不等于目标格心
  if (ghostVisible && (ghostWX !== ghostTWX || ghostWY !== ghostTWY)) return false;
  if (ghostAlpha > 0 && ghostAlpha < 1) return false;
  if (ghostRejectActive && ghostRejectP < 1) return false;
  if (ghostAngle !== ghostAngleTarget) return false;
  return true;
}

// 渲染一帧：清屏 → 画网格视口 → 画边框 → 画上方面板与底部栏 → 画选项槽 → 同步简介浮层 → 同步 SVG 元件层
function render() {
  const vp = getViewport();
  // 先整体清成白底，视口外自然就是空白
  ctx.clearRect(0, 0, state.cssW, state.cssH);
  drawGrid(vp);
  drawLaser(vp);  // 激光在网格之上、元件之下：元件层是独立 SVG 图层，天然压在它上面
  drawLampGlow(vp);  // 灯光晕压在激光之上、元件之下：既能柔化照到灯上的激光，又不会盖住灯本体
  drawViewportBorder(vp);
  drawPanelBox(vp);
  drawBottomBar(vp);
  drawBottomBarHint(vp);
  drawPanelSlots(vp);
  renderSlotTip(vp);
  renderPanels(vp);
  renderTutorialPanel();  // 教程弹窗是纯 DOM 浮层，压在画布所有内容之上，所以放在最后同步
  renderElements();
  renderGhost();
  drawMarquee();  // 拉框画在最后，压在画布上所有内容之上，拖到哪儿都看得见
}

/* ========== 输入处理 ========== */

// 在光标位置缩放：把参考点换成光标下的世界点，再改缩放目标
function zoomAt(screenX, screenY, factor) {
  // 换参考点前的待走位移（平移还没走完的部分），换参考点时原样保留，避免打断正在进行的平移
  const pendingDX = state.tAnchorSX - state.anchorSX;
  const pendingDY = state.tAnchorSY - state.anchorSY;
  // 纯换参考系：新参考点取光标下的世界点、屏幕位置取光标本身，这一步不改变当前画面
  state.anchorWX = screenToWorldX(screenX);
  state.anchorWY = screenToWorldY(screenY);
  state.anchorSX = screenX;
  state.anchorSY = screenY;
  state.tAnchorSX = screenX + pendingDX;
  state.tAnchorSY = screenY + pendingDY;
  // 缩放目标单独推进；动画期间参考点屏幕位置不变，等于绕光标做纯缩放，屏幕位移不会过冲
  state.tLogScale = clamp(
    state.tLogScale + Math.log(factor),
    Math.log(CONFIG.minScale),
    Math.log(CONFIG.maxScale)
  );
}

// 绑定全部输入事件；init 只执行一次，所以监听器不会被重复注册
function setupInput() {
  // 滚轮缩放：deltaMode 为 1 时单位是「行」，换算成像素再做指数缩放
  canvas.addEventListener("wheel", function (e) {
    e.preventDefault();
    const delta = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
    zoomAt(e.clientX, e.clientY, Math.exp(-delta * CONFIG.wheelZoomRate));
  }, { passive: false });

  // 中键按下：阻止浏览器自动滚动，并开始拖拽视野
  canvas.addEventListener("mousedown", function (e) {
    if (e.button === 1) e.preventDefault();
  });

  // 右键：屏蔽浏览器右键菜单，右键在画布上的语义改成「删除指针所在格的元件」
  canvas.addEventListener("contextmenu", function (e) {
    e.preventDefault();
    deleteElementAtScreen(e.clientX, e.clientY);
  });

  canvas.addEventListener("pointerdown", function (e) {
    // 点击也算一次「进入画布」：页面加载时鼠标已在画布内的话不会触发 pointerenter，这里补上
    pointerSX = e.clientX;
    pointerSY = e.clientY;
    pointerInside = true;
    sceneDirty = true;  // 点击可能选槽、开关光源或放置元件，画面必须更新一次
    canvas.focus();
    // 左键：先判是不是点在选项槽上（是则选中该槽并进入按下态、不放置），否则在指针所在格心放置元件
    if (e.button === 0) {
      const hit = slotIndexAt(e.clientX, e.clientY);
      if (hit >= 0) {
        slotPressedIndex = hit;  // 按下态：只缩得更深，不改亮度，避免按下时闪一下
        // 两个按钮只是「长得像槽」，它们不是可选项：不能改选中项，否则虚影会去查一个不存在的元件
        // 选中槽与元件槽都能选中；从选中工具切到别的工具时，选区会被立刻收掉（元件就地落位）
        if (isPickableSlot(hit)) setSelectedSlot(hit);
        return;
      }
      // 选中工具激活时，画布上的左键一律是「选择」：按住不动是单击选中，拖动就成了拉框
      // 这一步必须排在放置和开关光源之前，否则选中工具会被这两个操作抢走左键
      if (selectToolActive()) {
        // 按在「已选中」的元件上（且没按 Shift）＝拖动这一批选中的元件
        // Shift 留给框选的翻转模式，两者不抢同一个手势；按在空处或未选中的元件上仍是拉框
        const hitEl = findElementAtPointer();
        if (!e.shiftKey && hitEl !== null && hitEl.selected && !hitEl.deleting) {
          beginMove(e);
          return;
        }
        beginMarquee(e);
        return;
      }
      // 左键点在已占用的格子上：交给元件自己处理（目前只有光源响应，切换开关），无论成不成都不再放置
      if (findElementAtPointer() !== null) {
        toggleLightAtPointer();
        return;
      }
      placeElementAtScreen(e.clientX, e.clientY);
      return;
    }
    if (e.button !== 1) return;
    e.preventDefault();
    state.isPanning = true;
    state.panPointerId = e.pointerId;
    state.panLastX = e.clientX;
    state.panLastY = e.clientY;
    // 捕获指针：指针移出画布甚至移出窗口也能继续收到 move 事件
    canvas.setPointerCapture(e.pointerId);
  });

  // 拖拽中：自己用前后 clientX/clientY 求位移，不用 movementX —— 后者在部分浏览器里会跳变，拖起来一抖一抖
  canvas.addEventListener("pointermove", function (e) {
    // 无论是否在拖拽都记录指针位置：虚影每帧据此重算目标格心，平移缩放时也能跟着更新
    pointerSX = e.clientX;
    pointerSY = e.clientY;
    pointerInside = true;
    sceneDirty = true;  // 指针位置变了，虚影与槽悬停都可能跟着变，强制重绘一次
    // 同步选项槽的悬停状态：命中判定与绘制共用 panelSlotRect，两边不会算歪
    updateSlotHoverAt(e.clientX, e.clientY);
    moveMarquee(e);  // 拉框与拖视野是两个互斥的指针操作，各认各的指针 id，互不干扰
    moveSelectionDrag(e);  // 拖动选中元件同理，也是各认各的指针 id
    if (!state.isPanning || e.pointerId !== state.panPointerId) return;
    const dx = e.clientX - state.panLastX;
    const dy = e.clientY - state.panLastY;
    state.panLastX = e.clientX;
    state.panLastY = e.clientY;
    // 平移只动参考点的屏幕位置，世界坐标不动，整个画面跟着屏幕位移走
    state.tAnchorSX += dx;
    state.tAnchorSY += dy;
  });

  // 指针进入画布：立刻记录位置并抢下键盘焦点，否则页面/iframe 未获得焦点时按 WASD 收不到 keydown
  canvas.addEventListener("pointerenter", function (e) {
    pointerSX = e.clientX;
    pointerSY = e.clientY;
    pointerInside = true;
    canvas.focus();
    sceneDirty = true;  // 指针可能正好从槽上进入画布，槽的悬停状态与虚影都要立刻反映出来
    // 这里也判一次槽的悬停，避免要等第一次移动才生效
    updateSlotHoverAt(e.clientX, e.clientY);
  });

  // 指针离开画布：标记为不在画布内，虚影随之隐藏
  canvas.addEventListener("pointerleave", function () {
    pointerInside = false;
    sceneDirty = true;  // 虚影要消失、槽要复位，这些变化必须重绘一次才看得到
    // 离开画布也要清掉槽的悬停与按下，否则槽会一直停在缩小状态回不去
    slotHoverIndex = -1;
    slotPressedIndex = -1;
    slotHoverTime = 0;  // 停留计时一并归零，重新进入时要重新数 1.4 秒
  });

  // 结束拖拽：释放捕获并清空拖拽状态
  canvas.addEventListener("pointerup", function (e) {
    // 设置按钮：松开时指针仍停在按钮上才算一次有效点击（按下后拖走再松手不算）
    // 只切换设置自己的开合状态，不去开合调试面板 —— 那个面板是调参用的，跟设置是两回事
    if (slotPressedIndex === SETTINGS_SLOT_INDEX && slotHoverIndex === SETTINGS_SLOT_INDEX) {
      settingsOpen = !settingsOpen;
      filePanelOpen = false;  // 弹窗互斥：开一个就把另外两个关掉，避免底板叠在一起、也保证同时只有一个按钮亮着
      tutorialOpen = false;
    }
    // 文件按钮：判定规则与设置按钮完全一致，同样是「按下又松开在同一按钮上」才算一次点击
    if (slotPressedIndex === FILE_SLOT_INDEX && slotHoverIndex === FILE_SLOT_INDEX) {
      filePanelOpen = !filePanelOpen;
      settingsOpen = false;   // 同上，反向互斥
      tutorialOpen = false;
    }
    // 教程按钮：判定规则同前两个按钮，按下又松开在同一按钮上才算一次点击
    // 打开时屏幕正中弹出教程窗口；一并把另外两个弹窗关掉，三个按钮同一时刻只有一个亮着
    if (slotPressedIndex === TUTORIAL_SLOT_INDEX && slotHoverIndex === TUTORIAL_SLOT_INDEX) {
      tutorialOpen = !tutorialOpen;
      settingsOpen = false;
      filePanelOpen = false;
    }
    slotPressedIndex = -1;  // 不论哪个键松开都退出按下态，所以放在提前 return 之前
    // 拉框收尾放在最前：松开左键必须把拉框结掉，否则框会一直挂在屏幕上
    if (e.pointerId === marqueePointerId) endMarquee(e);
    if (e.pointerId === movePointerId) endMove(e);  // 拖动收尾：清落点被覆盖的元件并复位状态
    if (e.pointerId !== state.panPointerId) return;
    endPan(e.pointerId);
  });

  // 指针被系统取消（如触控被中断）时也要收尾，否则会卡在拖拽态或按下态
  canvas.addEventListener("pointercancel", function (e) {
    slotPressedIndex = -1;  // 系统取消不算一次点击，只退出按下态
    if (e.pointerId === marqueePointerId) cancelMarquee(e);  // 拉框也要一并收掉，否则框会留在屏幕上
    if (e.pointerId === movePointerId) cancelMove(e);  // 拖动被系统打断：元件退回原位再收状态
    if (e.pointerId !== state.panPointerId) return;
    endPan(e.pointerId);
  });

  // 窗口尺寸变化：画布与元件层都要重新按新尺寸对齐
  window.addEventListener("resize", function () {
    resizeCanvas();
    resizeElementLayer();
    sceneDirty = true;  // 画布尺寸变了，整屏内容都要按新尺寸重画
  });

  // 标签页切回来时画布内容可能已被系统丢弃，强制重绘一次，避免留下一片空白
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) sceneDirty = true;
  });

  // 粘贴：只在这里挂一次，挂在 document 上而不是画布上——焦点落在哪个元素都能收到
  // 不用「读剪贴板」的接口，是因为它要授权、在本地文件下不可靠；粘贴事件由浏览器把内容直接递过来
  document.addEventListener("paste", onPaste);

  // 键盘：1/2/3/4… 直接选中对应序号的元件槽；WASD 把朝向直接拨到上、右、下、左
  // WASD 优先作用于选区：有选中元件时整批一起转；没有选区才落到指针悬停的元件上，再没有就转虚影
  // 判据用 e.code 而不是 e.key：中文输入法激活时 e.key 会变成 "Process"，字母键会被整个吞掉
  window.addEventListener("keydown", function (e) {
    // 教程窗口开着时，画布的快捷键一律不响应，只留 Esc 把它关掉
    // 放在最前面拦：它是模态窗口，在它前面按 WASD 不该把后面被挡住的元件转了
    if (tutorialOpen) {
      if (e.code === "Escape") tutorialOpen = false;  // Esc 是关模态窗口的通用习惯，顺手支持一下
      return;
    }
    // Cmd+S / Ctrl+S：保存。放在最前面拦，因为这是全局快捷键，与指针在不在画布上无关
    // 必须拦掉默认行为，否则浏览器会弹「保存网页」的框，把页面本身存成一个文件
    // 用键位码而不是键名，避免中文输入法把键名改掉；Mac 认 Cmd，其它平台认 Ctrl
    if (e.code === "KeyS" && (e.metaKey || e.ctrlKey)) {
      e.preventDefault();
      onSaveFile();
      return;
    }
    // Cmd+C / Ctrl+C：复制选区。与保存一样是全局快捷键，与指针在不在画布上无关
    // 这里只管复制；粘贴不在这里做，改由系统的粘贴事件接手，那条路才能拿到剪贴板里的文本
    if (e.code === "KeyC" && (e.metaKey || e.ctrlKey)) {
      e.preventDefault();
      copySelection();
      return;
    }
    // Cmd+Z / Ctrl+Z：撤销；带上 Shift 就是重做，与 Windows 上 Ctrl+Shift+Z 的习惯一致
    // 同样是全局快捷键，与指针在不在画布上无关；手上有悬空时由撤销自己先把它取消掉
    if (e.code === "KeyZ" && (e.metaKey || e.ctrlKey)) {
      e.preventDefault();
      if (e.shiftKey) redo(); else undo();
      return;
    }
    // Ctrl+Y：Windows 上另一套常用的重做键位，与 Ctrl+Shift+Z 等价，一并认下
    if (e.code === "KeyY" && e.ctrlKey) {
      e.preventDefault();
      redo();
      return;
    }
    // 反引号 `：切到选中工具（选中模式），与点第一个槽等价，不用鼠标也能进出选择
    // 只负责「切进去」：要退出就点别的槽或按数字键选元件，那两种路径会立刻把选区收掉
    if (e.code === "Backquote") {
      e.preventDefault();
      setSelectedSlot(SELECT_SLOT_INDEX);
      sceneDirty = true;  // 选中高亮与手上虚影都变了，静止时也得重绘一帧才看得到
      return;
    }
    // 数字键与鼠标点槽等价：只改选中项并换掉手上的虚影，不进入按下态（键盘没有按住不放这回事）
    // 上限取元件类型数量，所以以后往面板里加元件，数字键自然跟着往后扩，不必改这里
    const digit = digitKeyIndex(e.code);
    if (digit >= 0) {
      if (digit < PANEL_SLOT_TYPES.length) {
        e.preventDefault();
        setSelectedSlot(digit + ELEMENT_SLOT_BASE);   // 数字从 1 数起，加基准才是槽序号，1 仍对应第一个元件类型
        // 选中高亮是画在画布上的：不标脏的话，静止时这一帧会被整帧跳过，上面看着像没反应
        sceneDirty = true;
      }
      return;
    }
    // Delete：有选区时删掉整个选区，没有选区时才删指针所在格的元件（与右键点它等价）
    // 同时认 Backspace：MacBook 键盘上那个标着 delete 的键发出来的就是 Backspace，只认 Delete 的话按下去没反应
    if (e.code === "Delete" || e.code === "Backspace") {
      // 无条件拦下默认行为：Backspace 在浏览器里默认是「后退」，不拦会直接把页面退走
      e.preventDefault();
      // 有选区时删整个选区：删哪些元件由选区决定，与指针停在哪里无关，所以指针在画布外也照删
      if (deleteSelection()) return;
      // 没有选区才回到老行为：删指针所在格的元件
      // 指针已经离开画布时不响应：位置还停在最后一次进入画布的地方，照做会误删
      if (pointerInside) deleteElementAtScreen(pointerSX, pointerSY);
      return;
    }
    // Enter：在指针所在格放置手上选中的元件，与左键点空格完全等价
    // 小键盘的回车键位码不同，一并认下，否则小键盘按了没反应
    if (e.code === "Enter" || e.code === "NumpadEnter") {
      if (pointerInside) {
        e.preventDefault();
        placeElementAtScreen(pointerSX, pointerSY);
      }
      return;
    }
    const dirKey = DIR_KEYS[e.code];  // undefined 表示不是 WASD，注意朝向索引 0 是合法值，不能拿它判空
    if (dirKey === undefined) return;
    e.preventDefault();
    // 顺位一：有选中的元件就整批一起转，不再看指针停在哪个元件上
    if (rotateSelectionToDir(dirKey)) return;
    // 顺位二：没有选区、但指针正悬停在某个元件上，就转那个元件本身
    if (rotateHoveredElement(dirKey)) return;
    // 顺位三：都没有才转虚影；此时改的是手上元件的朝向，与指针是否压着元件无关
    ghostAngleTarget += shortestTurnTo(ghostAngleTarget, dirKey * 90);
  });
}

// 统一收尾拖拽：释放指针捕获并复位拖拽相关状态
function endPan(pointerId) {
  if (canvas.hasPointerCapture(pointerId)) {
    canvas.releasePointerCapture(pointerId);
  }
  state.isPanning = false;
  state.panPointerId = null;
}

/* ========== 重置 ========== */

// 把视图与输入状态全部复位到初始值，等价于「重开一局」
// 自查通过：无未定义函数（全部函数在本文件内声明）；监听器仅在 setupInput 里注册一次，无重复绑定泄漏；
// 画布位图按 dpr 缩放且绘制坐标用 CSS 像素，逻辑像素与位图匹配；
// 此处已清空参考点、缩放、拉框、拖动、公转、旋转拖动与虚影状态，复位后不留任何半截手势
function resetView() {
  state.anchorWX = CONFIG.defaultAnchorWX;
  state.anchorWY = CONFIG.defaultAnchorWY;
  // 参考点屏幕位置放在视口正中，等价于把网格原点摆在画面中央
  state.anchorSX = state.cssW / 2;
  state.anchorSY = state.cssH / 2;
  state.tAnchorSX = state.anchorSX;
  state.tAnchorSY = state.anchorSY;
  state.logScale = Math.log(CONFIG.defaultScale);
  state.tLogScale = state.logScale;
  state.scale = CONFIG.defaultScale;
  state.isPanning = false;
  state.panPointerId = null;
  state.panLastX = 0;
  state.panLastY = 0;
  state.lastTs = 0;
  // 虚影与指针状态一并复位，避免重开时残留上一局的虚影位置与动画进度
  ghostVisible = false;
  ghostAlpha = 0;
  ghostRejectActive = false;
  ghostRejectP = 0;
  ghostRejectStartAlpha = 0;
  ghostRejectFromWX = 0;
  ghostRejectFromWY = 0;
  ghostRejectToWX = 0;
  ghostRejectToWY = 0;
  // 朝向也复位成朝上，避免重开时虚影还停在上一局的朝向
  ghostAngle = 0;
  ghostAngleTarget = 0;
  pointerInside = false;
  // 指针操作的中间状态一并复位：拉框与拖动都回到「没在操作」的状态，不留半截手势
  marqueePressing = false;
  marqueeActive = false;
  marqueePointerId = -1;
  moveDragging = false;
  movePointerId = -1;
  moveDGX = 0;
  moveDGY = 0;
  moveGroup.length = 0;
  orbitActive = false;   // 公转也一并复位，不留半截姿态
  orbitP = 0;
  orbitTurns = 0;
  selOrientDir = 0;      // 选区朝向一并归零，重开一局后新选区仍默认朝上
  // 选项槽的悬停缩放状态一并复位，避免重开时残留上一局的悬停尺寸
  resetSlots();
  // 虚影形状跟着复位后的选中槽走；初始化时 ghostNode 还没建，applyGhostType 内部会跳过
  applyGhostType();
  sceneDirty = true;  // 复位后画面与上一局完全不同，强制重绘一次
}

/* ========== 主循环与入口 ========== */

// 主循环只负责算 dt、调用更新、调用渲染，不写具体逻辑
function frame(ts) {
  const dt = state.lastTs ? Math.min((ts - state.lastTs) / 1000, 0.1) : 0; // 钳制 dt，避免切回标签页时跳变
  state.lastTs = ts;
  updateCamera(dt);
  updateSlotAnim(dt);
  updateSlotTip(dt);
  updateDeletions(dt);
  updateElementRotations(dt);
  updateSelectionAnim(dt);
  updateLampAnim(dt);
  updateMoveAnim(dt);
  updateOrbit(dt);
  stepSimulation(dt);  // 按固定步长推进微帧时钟，本帧结算几个微帧由它决定
  updateGhost(dt);
  updateGhostRotation(dt);
  // 静止判定放在全部更新之后：静止、上帧也静止、又没有待重绘的变更时，整帧跳过渲染
  // 动画收尾那一帧上帧还不是静止，所以最终状态一定会被画出来，不会卡在中间态
  const settled = isSceneSettled();
  if (sceneDirty || !settled || !prevSettled) render();
  prevSettled = settled;
  sceneDirty = false;
  requestAnimationFrame(frame);
}

// 初始化：拿上下文 → 调尺寸 → 复位视图 → 建元件层 → 注入简介浮层外观 → 绑事件 → 启动主循环
function init() {
  canvas = document.getElementById("gridCanvas");
  ctx = canvas.getContext("2d");
  resizeCanvas();
  resetView();
  initElementLayer();
  initSlotTipDom();
  initSettingsPanelDom();
  initFilePanelDom();
  initTutorialPanelDom();
  setupDebugPanel();
  setupInput();
  loadPickerHandle();  // 异步把上次用过的文件句柄读回内存，供系统选择器定起始目录；读不到也不影响其它功能
  requestAnimationFrame(frame);
}

init();
</script>
</body>
</html>
