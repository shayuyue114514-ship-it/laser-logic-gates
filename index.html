<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<!-- 标题显示在浏览器标签和搜索结果的大字上；简介显示在搜索结果标题下方那两行 -->
<title>激光门 - 用光路搭出逻辑门</title>
<meta name="description" content="使用激光门造就奇迹。用不同的元件做出电路，让激光沿网格逐格传播，把与门、或门、非门亲手搭出来，看光是怎么把它们算出来的。">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<!-- 进屋前那一屏的样式：内联在这里，为的是让首次绘制不必等任何外部文件 -->
<!-- 整站样式表改成了下面那一行异步取，页面因此一被解析完就能把欢迎界面画出来，
     真正的界面在它后面慢慢到，到齐之前一直由遮挡层盖着（何时收掉见 js/boot.js）
     这一整段在两个页面里逐字相同，改一处要两处一起改 -->
<style>
  /* 兜底：样式表还没到的那一小段里，页面上的元素都还没有样式，内容可能比窗口高
     先把外边距与滚动条按掉，免得滚动条在欢迎界面旁边露出来 */
  html, body {
    margin: 0;
    overflow: hidden;
    background: #ffffff;
  }
  /* 遮挡层：铺满整屏，正中是项目名与一条来回走的进度条 */
  #bootScreen {
    position: fixed;
    inset: 0;               /* 四条边贴住窗口：不写宽高，窗口怎么变它都正好铺满 */
    z-index: 20;            /* 压在画布、元件层、竖栏与所有弹窗（弹窗从 4 起）之上 */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #ffffff;    /* 与页面同色：淡出时看不出接缝，只像内容自己浮上来 */
    color: #0D47A1;         /* 与首页标题、弹窗标题同一档深蓝 */
    font-family: "MiSans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  /* 收掉时的淡出：类名由 boot.js 加，0.22 秒后整块从页面里摘掉 */
  #bootScreen.is-gone {
    opacity: 0;
    pointer-events: none;   /* 淡出过程中不再接收点击，免得挡住底下刚露出来的按钮 */
    transition: opacity 0.22s ease-out;
  }
  /* 项目名：与首页大标题写的是同一串字，这里取小一些的字号，靠字重与深蓝字色立住 */
  #bootScreen .boot-title {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 2px;
  }
  /* 进度条：一条浅蓝底槽，里面一小段深蓝来回走 */
  /* 它表示的不是真实进度：浏览器不提供字体下载的进度，这一段的用处只是给出「正在进」这个信号 */
  #bootScreen .boot-track {
    position: relative;
    overflow: hidden;       /* 走到底与刚起头时那一小段要贴边裁掉，不能露出槽外 */
    width: 120px;
    height: 3px;
    margin-top: 18px;
    border-radius: 2px;
    background: #C4EBFF;
  }
  #bootScreen .boot-track i {
    position: absolute;
    top: 0;
    left: 0;
    width: 40px;
    height: 100%;
    border-radius: 2px;
    background: #1565C0;
    animation: bootSlide 1.1s ease-in-out infinite;
  }
  @keyframes bootSlide {
    from { transform: translateX(-40px); }
    to   { transform: translateX(120px); }
  }
  /* 系统里开了「减少动态效果」时不来回走：那一小段停在正中，位置本身也说得清页面正在进 */
  @media (prefers-reduced-motion: reduce) {
    #bootScreen .boot-track i {
      animation: none;
      left: 40px;
    }
  }
</style>
<!-- 整站样式表：media 先写 print，浏览器就不会为它停下首次绘制；文件一到手，onload 把它改回 all
     这是本项目里唯一一处内联事件：只有挂在元素自己身上，才能在文件到手的那一刻就改过来
     脚本被禁时 onload 不会跑，由下面那句 noscript 里的同款 link 兜住
     id 留给 js/boot.js 认：它靠 link.sheet 判断这份样式表到位没有，没到位就先不揭开遮挡层 -->
<link id="mainStyle" rel="stylesheet" href="css/style.css?v=1.0.0.023" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="css/style.css?v=1.0.0.023"></noscript>
</head>
<body>

<!-- 进屋前的遮挡层：从第一帧起盖住整屏，等首帧与字体都齐了再淡出收掉，何时收由 js/boot.js 决定
     它的外观写在 head 里那段内联样式里，底色与页面同为白，所以淡出时看不出接缝，只像内容自己浮上来
     正中间那串字与首页大标题是同一串字（config.js 里 HOME.titleText），改一处要两处一起改
     它必须放在 body 的最前面：越早解析到，越早能盖住底下那些还没成形的元素 -->
<div id="bootScreen">
  <div class="boot-title">激光门</div>
  <div class="boot-track"><i></i></div>
</div>

<!-- 首页整屏只有这一张画布：网格、两侧演示、标题与五个入口都画在它上面，画法与交互见 js/home.js
     首页没有编辑器左侧那栏存档列表，也不直接编辑电路，它只做展示与分流 -->
<canvas id="homeCanvas"></canvas>

<!-- 教程弹窗：与编辑器里那个同款，正文从 tutorial-content.js 取，两个页面的教程逐字相同
     尺寸、底板、圆角、边框由 home.js 从 CONFIG / COLOR 注入；点左上角那个叉才关，点窗外的暗处不关
     它和关于窗互斥，开一个另一个自动关，两处的显隐只由 home.js 的 setHomePopup 一处改写 -->
<div id="homeTutorialPanel" class="popup modal">
  <button class="btn icon" id="btnHomeTutorialClose" aria-label="关闭教程">
    <!-- 叉用两笔圆头描边画成，收笔是圆的，与编辑器弹窗里那个叉、以及画布上的图标同一套 -->
    <!-- 描边取 currentColor：颜色跟着按钮文字色走，以后改按钮色不必再改这里 -->
    <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true" focusable="false">
      <path d="M5.5 5.5 L12.5 12.5 M12.5 5.5 L5.5 12.5"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
    </svg>
  </button>
  <div class="doc" id="homeTutorialDoc"></div>
</div>

<!-- 关于弹窗：宽度取 420，高度交给内容自己定；项目名、简介、作者、地址、许可证由 home.js 按表填入 -->
<div id="homeAboutPanel" class="popup modal">
  <button class="btn icon" id="btnHomeAboutClose" aria-label="关闭关于">
    <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true" focusable="false">
      <path d="M5.5 5.5 L12.5 12.5 M12.5 5.5 L5.5 12.5"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
    </svg>
  </button>
  <div class="doc" id="homeAboutDoc"></div>
</div>

<!-- 日志弹窗：比教程窗更大，逐条列出每个对外版本的简介；每条左侧那枚按钮点开才露出详细信息
     正文来自 js/changelog.js 的 CHANGELOG，外观与排版由 home.js 注入，与上面两个弹窗同一套 -->
<div id="homeLogPanel" class="popup modal">
  <button class="btn icon" id="btnHomeLogClose" aria-label="关闭日志">
    <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true" focusable="false">
      <path d="M5.5 5.5 L12.5 12.5 M12.5 5.5 L5.5 12.5"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
    </svg>
  </button>
  <div class="doc" id="homeLogDoc"></div>
</div>

<!-- 加载顺序不可随意调整：util.js 必须排在最前面，因为 config.js 在文件顶层就要用 hslToRgb 算配色端点；
     handle-store.js 要排在 home.js 之前，「打开」要用它的 SAVE_FILE_TYPES、startInOption 与句柄记忆；
     element-types.js 与 circuit.js 是元件形状表与电路结算引擎，首页两侧的演示电路跑的就是编辑器同一套，
     它们依赖 CONFIG 与 ELEMENT_TYPES，所以只能排在 config.js 之后、home.js 之前；
     icons.js 与 tutorial-content.js 也是两个页面共用的那两份，home.js 借它们画图标、填教程正文。
     state.js 是共享状态容器：首页的演示引擎与编辑器读写的是同一份状态，所以两页都引它；
     其余的编辑器脚本（files.js、input.js 等）首页一概不引：那些是编辑职责，封面用不到。 -->
<script src="js/util.js?v=1.0.0.023"></script>
<script src="js/config.js?v=1.0.0.023"></script>
<!-- 数据与绘图基础：存档句柄库、元件类型表、共享状态、电路结算、图标与教程正文 -->
<script src="js/handle-store.js?v=1.0.0.023"></script>
<script src="js/element-types.js?v=1.0.0.023"></script>
<script src="js/state.js?v=1.0.0.023"></script>
<script src="js/circuit.js?v=1.0.0.023"></script>
<script src="js/icons.js?v=1.0.0.023"></script>
<script src="js/tutorial-content.js?v=1.0.0.023"></script>
<!-- 版本日志正文：首页「日志」弹窗按 CHANGELOG 逐条排，必须排在 home.js 之前 -->
<script src="js/changelog.js?v=1.0.0.023"></script>
<!-- 离线缓存登记：页面打开时静默把整站存进本地，之后断网也能直接打开，不依赖任何其它脚本 -->
<script src="js/offline.js?v=1.0.0.023"></script>
<!-- 加载界面与字体加载：两个都要排在 home.js 之前，home.js 起步时第一个要用、紧接着第二个也要用
     boot.js 管遮挡层何时收掉，fonts.js 把自带的 MiSans 点名取回来；两份都不碰编辑器状态，两页共用 -->
<script src="js/boot.js?v=1.0.0.023"></script>
<script src="js/fonts.js?v=1.0.0.023"></script>
<script src="js/home.js?v=1.0.0.023"></script>
</body>
</html>
