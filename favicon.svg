  <!-- 反相器元件形状，与编辑器画布上的那份几何同源：等腰三角形 + 顶点上的气泡，合并成一条外轮廓 -->
  <!-- 三角形底边半宽 0.225、顶点到底边 0.6；气泡半径 0.13，圆心落在顶点上，整体下移 0.065 使包围盒居中 -->
  <!-- 与画布同画法：先按 0.12 描边（比元件常态的 0.1 粗两成），再用填充盖住内侧一半，最终只露外侧 0.06 一圈 -->
  <!-- 外层整体缩到一半：图形连同描边一起缩放，缩完气泡顶端仍留在画布内，不会被裁掉 -->
  <g
     id="g4"
     transform="scale(1.939759)">
    <rect
